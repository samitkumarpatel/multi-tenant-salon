replicaCount: 1

image:
  repository: ghcr.io/samitkumarpatel/multi-tenant-salon-authz
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

fullnameOverride: "auth"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: nginx
  host: auth.salonsaas.org
  tls:
    enabled: true
    secretName: auth-tls

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

spot:
  enabled: true

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  IDENTITY_SERVICE_URL: "https://api.salonsaas.org"
