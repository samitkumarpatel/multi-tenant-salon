---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: salon

---
# ConfigMap — non-sensitive Postgres config
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: salon
data:
  POSTGRES_DB: salon
  POSTGRES_USER: postgres

---
# PersistentVolume — static binding to the Azure managed disk created by Terraform.
# Replace dbe2ac78-1258-48ea-9af7-846ae2c78634 with your Azure subscription ID.
# Disk URI: /subscriptions/dbe2ac78-1258-48ea-9af7-846ae2c78634/resourceGroups/multi-tenant-salon-dev/providers/Microsoft.Compute/disks/salon-saas-dev-postgres-data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: managed-premium
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - "0"
  csi:
    driver: disk.csi.azure.com
    volumeHandle: /subscriptions/dbe2ac78-1258-48ea-9af7-846ae2c78634/resourceGroups/multi-tenant-salon-dev/providers/Microsoft.Compute/disks/salon-saas-dev-postgres-data
    volumeAttributes:
      fsType: ext4

---
# PersistentVolumeClaim — binds to the PV above
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: salon
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium
  resources:
    requests:
      storage: 32Gi
  volumeName: postgres-pv

---
# Deployment — single replica Postgres (stateful, system node pool only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate   # required for ReadWriteOnce disks — no rolling update
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        workload-type: system   # pin to on-demand system pool, never spot
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# Service — ClusterIP (internal only, backend connects via postgres.salon.svc.cluster.local:5432)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: salon
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
