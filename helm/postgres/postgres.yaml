# =============================================================================
# RETAINED FOR ROLLBACK — NOT APPLIED ANY MORE
# =============================================================================
# Migration step 1 moved the `salon` database off this in-cluster Postgres and
# onto the managed Azure Database for PostgreSQL Flexible Server
# (salon-saas-mix-psql). The api Deployment now points there
# (helm/api/values.yaml: SPRING_DATASOURCE_URL + database.passwordSecretName).
#
# The manifest below is deliberately left in the repo, fully commented out, so
# the in-cluster DB can be brought back quickly if the managed server has to be
# rolled back:
#   1. Uncomment everything below this banner.
#   2. Restore the postgres-secret block in helm/pre-req-manifest/create-secrets.sh.
#   3. kubectl apply -f helm/postgres/postgres.yaml
#   4. Point helm/api/values.yaml back at
#      jdbc:postgresql://postgres.salon.svc.cluster.local:5432/salon and
#      database.passwordSecretName: postgres-secret, then `helm upgrade api`.
#
# NOTE: the live objects (Deployment/postgres, its PVC/PV, postgres-config,
# postgres-secret) are still running in the cluster untouched — commenting this
# file out does not delete them. It only stops `kubectl apply` from recreating
# them on a fresh environment.
# =============================================================================
