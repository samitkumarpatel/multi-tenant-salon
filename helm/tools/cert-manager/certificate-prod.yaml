apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: salonsaas.org
  # Must be the same namespace as any Ingress referencing spec.secretName below
  # (a Kubernetes Ingress can only use a TLS Secret from its own namespace) —
  # helm/api's Ingress lives in "salon", so this does too.
  namespace: salon
spec:
  secretName: salonsaas.org-prod
  dnsNames:
    - api.salonsaas.org
    - auth.salonsaas.org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer