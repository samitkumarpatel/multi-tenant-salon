replicaCount: 1

image:
  repository: ghcr.io/samitkumarpatel/multi-tenant-salon
  pullPolicy: IfNotPresent
  tag: "latest"

# Name of a kubernetes.io/dockerconfigjson Secret for pulling from ghcr.io
imagePullSecrets:
  - name: ghcr-secret

# fullnameOverride keeps the deployment name "api" so the CI workflow
# (kubectl set image deployment/api api=...) does not need to change.
fullnameOverride: "api"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: api.salonsaas.org
  tls:
    enabled: true
    # Must match the secretName produced by helm/tools/cert-manager/certificate-prod.yaml
    secretName: salonsaas.org-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Schedule on spot nodes to reduce cost.
# Matches the AKS spot pool taint: kubernetes.azure.com/scalesetpriority=spot:NoSchedule
spot:
  enabled: true

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Non-sensitive environment variables
env:
  SPRING_SQL_INIT_MODE: "never"
  SPRING_MODULITH_EVENTS_JDBC_SCHEMA_INITIALIZATION_ENABLED: "false"
  SPRING_FLYWAY_ENABLED: "true"
  STORAGE_TYPE: "LOCAL"
  CORS_ALLOWED_ORIGIN_PATTERNS: "https://salonsaas.org,https://www.salonsaas.org,https://*.salonsaas.org"
  BPL_JVM_THREAD_COUNT: "100"
  SPRING_CLOUD_AWS_S3_ENABLED: "false"
  AWS_DEFAULT_REGION: "eu-north-1"
  MEDIA_STAFF_CDN_BASE_URL: "https://staff.salonsaas.org"
  MEDIA_STAFF_BUCKET_NAME: ""  # only needed when STORAGE_TYPE=S3
  MEDIA_LOCAL_BASE_URL: "https://api.salonsaas.org"
  MEDIA_LOCAL_STORAGE_PATH: "/tmp/salon-photos"  # ephemeral — mount a PV here when storage is revisited
  # Migration step 1: compute stays on AKS, data now lives on the managed Azure
  # Database for PostgreSQL Flexible Server (salon-saas-mix-psql). AKS node/pod
  # egress reaches it through the server's "AllowAzureServices" firewall rule;
  # the server enforces TLS, hence ?sslmode=require. The in-cluster `postgres`
  # Deployment is left running untouched as an instant rollback (flip this URL
  # back to postgres.salon.svc.cluster.local + passwordSecretName to
  # postgres-secret).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://salon-saas-mix-psql.postgres.database.azure.com:5432/salon?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "postgres"
  # SPRING_DATASOURCE_PASSWORD is deliberately absent — templates/deployment.yaml
  # injects it from the Secret named by database.passwordSecretName (created by
  # helm/pre-req-manifest/create-secrets.sh). Setting it here would put the
  # password in plain text in git, and a value in `env` also silently
  # overrides anything supplied via envFrom.
  OAUTH2_ISSUER_URI: "https://auth.salonsaas.org"

# Secret (created out-of-band by helm/pre-req-manifest/create-secrets.sh) holding
# POSTGRES_PASSWORD for the datasource. azure-postgres-secret → managed Flexible
# Server; postgres-secret → the in-cluster postgres pod (pre-migration default).
database:
  passwordSecretName: azure-postgres-secret

# Sensitive values — override per environment (never commit real values).
# Rendered into a Kubernetes Secret and injected via envFrom. Empty by default:
# the datasource password comes from postgres-secret, not from here.
secret: {}
