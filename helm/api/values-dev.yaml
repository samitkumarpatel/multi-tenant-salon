replicaCount: 1

image:
  tag: "latest"

ingress:
  host: api.salonsaas.org

hpa:
  enabled: false

env:
  CORS_ALLOWED_ORIGIN_PATTERNS: "https://salonsaas.org,https://www.salonsaas.org,https://*.salonsaas.org"

# secret values are injected at deploy time from CI secrets — do not hardcode here
# helm upgrade api ./infrastructure/helm/api \
#   -f infrastructure/helm/api/values-dev.yaml \
#   --set secret.SPRING_DATASOURCE_URL="..." \
#   --set secret.SPRING_DATASOURCE_USERNAME="..." \
#   --set secret.SPRING_DATASOURCE_PASSWORD="..."
