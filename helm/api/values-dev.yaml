replicaCount: 1

ingress:
  host: api.salonsaas.org

hpa:
  enabled: false

env:
  CORS_ALLOWED_ORIGIN_PATTERNS: "https://salonsaas.org,https://www.salonsaas.org,https://*.salonsaas.org"
  MEDIA_STAFF_CDN_BASE_URL: "https://staff.salonsaas.org"
  MEDIA_LOCAL_BASE_URL: "https://api.salonsaas.org"
  # MEDIA_STAFF_BUCKET_NAME: ""  # only needed when STORAGE_TYPE=S3
  # MEDIA_LOCAL_STORAGE_PATH: "/tmp/salon-photos"  # ephemeral — mount a PV here when storage is revisited

# SPRING_DATASOURCE_URL / _USERNAME live in values.yaml `env` (they are not secrets);
# SPRING_DATASOURCE_PASSWORD is injected from the postgres-secret Secret.
secret: {}
