          type: string

    # ── Website Theme ─────────────────────────────────────────────────────────

    WebsiteTheme:
      type: object
      properties:
        salonId:
          type: string
          format: uuid
        heroBg:
          type: string
          description: Hero section background color (CSS value)
        heroTextColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
          description: Preset slug ("nunito", "playfair", ...) or any Google Fonts family name ("Noto Sans KR", ...). Default "Noto Sans KR".
        logoBgColor:
          type: string
        headerBg:
          type: string
          description: Navigation bar background color
        footerBg:
          type: string
          description: Footer background color
        mapsUrl:
          type: string
          description: Google Maps embed URL for the salon location
        chatLayout:
          type: string
          enum: [fullscreen, windowed]
          description: |
            How the Generative UI chat opens: "windowed" = a centered card; anything else
            (default, and the legacy value "app") = fullscreen.
          example: "fullscreen"
        websiteType:
          $ref: "#/components/schemas/WebsiteType"
        updatedAt:
          type: string
          format: date-time

    # ── Chat ───────────────────────────────────────────────────────────────────

    ChatTurn:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          description: |
            The turn's text. An `assistant` turn may also be a synthetic UI-state note authored
            by the frontend and wrapped in square brackets — e.g.
            `[Showed the visitor an interactive services card: Haircut, Colour]` or
            `[The visitor is using the interactive booking picker for Haircut — stylist: any;
            date: 2026-09-01; time: not chosen yet; ...]`. These stand in for generative-UI
            cards the visitor saw or is interacting with (which the chat renders instead of
            prose), so the assistant can answer follow-ups about them. The system prompt tells
            the model to treat them as current state and never echo the brackets.

    ChatRequest:
      type: object
      required: [message]
      properties:
        context:
          type: string
          enum: [website, booking]
          description: Which surface the chat is embedded in; shapes the assistant's persona/tone.
        message:
          type: string
        history:
          type: array
          description: |
            Prior turns of the conversation, oldest first. The frontend is the source of truth
            for conversation state (nothing is persisted server-side) and injects bracketed
            UI-state notes as `assistant` turns for interactive cards — see `ChatTurn.text`.
          items:
            $ref: "#/components/schemas/ChatTurn"

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        toolsUsed:
          type: array
          description: |
            Names of the data-lookup tools the assistant called to answer (e.g. "salon", "staff",
            "services", "holidays", "booking-proposal"). Empty when the reply needed no live
            lookup, or when the assistant is degraded/unconfigured and returned a fallback message.
          items:
            type: string
        pendingBooking:
          description: |
            Present only when the assistant staged a booking this turn (after calling
            checkAvailability and collecting the visitor's details). Same shape as
            CreateBookingRequest — the client is expected to show this to the visitor for
            confirmation and, only once they explicitly confirm, POST it verbatim to
            `/api/salon/{salonId}/booking` to actually create it. The assistant never creates a
            booking itself.
          allOf:
            - $ref: "#/components/schemas/CreateBookingRequest"
          nullable: true
        ui:
          description: |
            Which interactive generative-UI card the assistant chose to render for this turn, by
            calling one of its `show*` / `startBookingPicker` tools (the model decides — the
            client no longer guesses from the reply text). `null` when the turn is plain text.
            The client maps `component` to a card and ignores any value it doesn't recognise, so
            an unknown/renamed component degrades to text rather than breaking the turn.
          allOf:
            - $ref: "#/components/schemas/UiDirective"
          nullable: true

    ChatFollowupsRequest:
      type: object
      required: [history]
      properties:
        context:
          type: string
          enum: [website, booking]
          description: Which surface the chat is on; same meaning as `ChatRequest.context`.
        history:
          type: array
          description: The conversation so far, oldest first — same shape as `ChatRequest.history`.
          items:
            $ref: "#/components/schemas/ChatTurn"

    ChatFollowupsResponse:
      type: object
      properties:
        followups:
          type: array
          description: |
            2-4 short first-person questions the visitor is likely to want to ask next, derived
            from the latest message in the thread. Empty when the assistant is
            unconfigured/unavailable.
          items:
            type: string
          example: ["How much is a haircut?", "Who does colour?", "Can I book one?"]

    UiDirective:
      type: object
      required: [component]
      properties:
        component:
          type: string
          enum: [services, staff, hours, location, contact, booking-picker]
          description: The card to render.
        serviceId:
          type: integer
          format: int64
          nullable: true
          description: "`booking-picker`: the service to book."
        staffId:
          type: integer
          format: int64
          nullable: true
          description: "`booking-picker`: preferred staff member, if the visitor named one."
        forStaffId:
          type: integer
          format: int64
          nullable: true
          description: "`services`: restrict the card to what this staff member offers."
        forServiceId:
          type: integer
          format: int64
          nullable: true
          description: "`staff`: restrict the card to who can perform this service."
        forBooking:
          type: boolean
          nullable: true
          description: "`services`: true frames the card as \"pick one to book\" rather than browsing."

    SaveThemeRequest:
      type: object
      properties:
        heroBg:
          type: string
        heroTextColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
          description: Preset slug ("nunito", "playfair", ...) or any Google Fonts family name ("Noto Sans KR", ...). Default "Noto Sans KR".
        logoBgColor:
          type: string
        headerBg:
          type: string
          description: Navigation bar background color
        footerBg:
          type: string
          description: Footer background color
        mapsUrl:
          type: string
          description: Google Maps embed URL for the salon location
        chatLayout:
          type: string
          enum: [fullscreen, windowed]
          description: |
            How the Generative UI chat opens: "windowed" = a centered card; anything else
            (default when omitted, and the legacy value "app") = fullscreen.
          example: "fullscreen"

    WebsiteType:
      type: string
      enum: [STATIC_WEBSITE, GENERATIVE_UI, CUSTOMISE_WEBSITE_CONTACT_US]
      description: Website presentation type

    WebsiteTypeResponse:
      type: object
      properties:
        websiteType:
          $ref: "#/components/schemas/WebsiteType"

    WebsiteTypeRequest:
      type: object
      required: [websiteType]
      properties:
        websiteType:
          $ref: "#/components/schemas/WebsiteType"

