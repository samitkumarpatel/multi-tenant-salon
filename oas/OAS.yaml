          format: date-time

    SalonPolicy:
      type: object
      required: [key, title, enabled, website, booking, source, defaultLanguage, translations]
      properties:
        key:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9][a-z0-9-]{0,79}$'
          description: Stable policy identifier, unique within the salon.
          example: privacy
        title:
          type: string
          maxLength: 120
          example: Privacy Policy
        enabled:
          type: boolean
          description: Whether this policy is active for customers.
        website:
          type: boolean
          description: Show this policy link on the public salon website.
        booking:
          type: boolean
          description: Show this policy link on the booking experience.
        source:
          type: string
          enum: [DEFAULT, CUSTOM]
          description: Built-in starter text or salon-provided text.
        defaultLanguage:
          type: string
          enum: [en, da, sv, nb, fr, de]
          description: Language used if a visitor's selected language has no policy text.
        translations:
          type: object
          description: Policy text keyed by language code. Imported text is stored as plain text.
          additionalProperties:
            type: string
            maxLength: 30000
          example:
            en: Contact the salon for questions about this policy.
            da: Kontakt salonen, hvis du har spørgsmål til denne politik.

    # ── Chat ───────────────────────────────────────────────────────────────────

    ChatRequest:
      type: object
      required: [message]
      properties:
        sessionId:
          type: string
          nullable: true
          description: |
            Opaque per-visitor conversation key the frontend mints once and reuses for the life
            of the chat (persisted in `sessionStorage`). The server keeps the transcript under it
            in TTL memory (`spring.application.chat.memory.ttl`, default 30 min idle) — the
            client no longer re-sends the history. When blank/omitted the server mints one and
            returns it in `ChatResponse.sessionId`.
        context:
          type: string
          enum: [website, booking]
          description: Which surface the chat is embedded in; shapes the assistant's persona/tone.
        message:
          type: string
        uiState:
          type: string
          nullable: true
          description: |
            Optional single bracketed note describing what the visitor currently sees / is
            part-way through on the page — the on-screen interactive component(s) and any staged
            booking — e.g. `[Showed the visitor an interactive services card: Haircut, Colour]`
            or `[The visitor is using the interactive booking picker for Haircut — stylist: any;
            date: 2026-09-01; time: not chosen yet; ...]`. The model never sees the live widgets,
            so the server records this as a synthetic prior assistant turn before the message.
            The system prompt tells the model to treat bracketed notes as current state and
            never echo them.

    ChatResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: The conversation key for this turn — echoes `ChatRequest.sessionId`, or a
            freshly minted one when the request omitted it. Reuse it on the next turn.
        message:
          type: string
        components:
          type: array
          description: |
            The interactive generative-UI components the assistant chose to render this turn, in
            order, by calling its `show*` / `start*` tools. A turn may carry several (e.g. a
            services card plus a button group). Empty for a plain-text turn. The client maps each
            `type` to a component and silently ignores any it doesn't recognise, so an
            unknown/renamed component degrades to text rather than breaking the turn.
          items:
            $ref: "#/components/schemas/UiComponent"
        suggestedQuestions:
          type: array
          description: |
            2-4 short first-person questions the visitor is likely to want to ask next, generated
            inline with the reply (same content as `POST .../chat/followups`). Empty when the
            assistant is unconfigured/unavailable. The client shows them as chips above the
            composer; each is sent to `POST .../chat` verbatim when tapped.
          items:
            type: string
          example: ["How much is a haircut?", "Who does colour?", "Can I book one?"]
        toolsUsed:
          type: array
          description: |
            Names of the data-lookup tools the assistant called to answer (e.g. "salon", "staff",
            "services", "holidays", "booking-proposal"). Empty when the reply needed no live
            lookup, or when the assistant is degraded/unconfigured and returned a fallback message.
          items:
            type: string
        pendingBooking:
          description: |
            Present only when the assistant staged a booking this turn (after calling
            checkAvailability and collecting the visitor's details). Same shape as
            CreateBookingRequest — the client is expected to show this to the visitor for
            confirmation and, only once they explicitly confirm, POST it verbatim to
            `/api/salon/{salonId}/booking` to actually create it. The assistant never creates a
            booking itself.
          allOf:
            - $ref: "#/components/schemas/CreateBookingRequest"
          nullable: true
        mcpAppTool:
          type: string
          nullable: true
          description: |
            The Salon MCP App the assistant opened this turn — the same model-visible tool an
            external MCP host would call on `/mcp`. The website embeds that app's `ui://` resource
            under the reply. `null` when no app was opened.
          enum: [salon_explorer, salon_services, salon_team, salon_booking, salon_booking_by_stylist, salon_booking_week, salon_shop]
          example: salon_booking_week
        mcpAppCall:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Arguments for `mcpAppTool`, always including `salonIdOrHandler`; only the ids/dates the
            assistant already knew are present (e.g. `serviceId`, `staffId`, `date`, `weekStart`,
            `view` for `salon_explorer`). The host passes them to the tool unchanged.
          example: { salonIdOrHandler: "3f1c…", serviceId: 12, weekStart: "2026-10-26" }

    ChatFollowupsRequest:
      type: object
      properties:
        sessionId:
          type: string
          nullable: true
          description: Conversation key — same meaning as `ChatRequest.sessionId`. The service
            reads the transcript from memory under it.
        context:
          type: string
          enum: [website, booking]
          description: Which surface the chat is on; same meaning as `ChatRequest.context`.
        uiState:
          type: string
          nullable: true
          description: |
            Optional bracketed UI-state note — same format as `ChatRequest.uiState`. Used as the
            LATEST message the follow-ups are based on (e.g. after an instant sidebar card or a
            booking-picker step change that never hit `POST .../chat`).

    ChatFollowupsResponse:
      type: object
      properties:
        followups:
          type: array
          description: |
            2-4 short first-person questions the visitor is likely to want to ask next, derived
            from the latest message in the thread. Empty when the assistant is
            unconfigured/unavailable.
          items:
            type: string
          example: ["How much is a haircut?", "Who does colour?", "Can I book one?"]

    UiComponent:
      type: object
      required: [type, props]
      description: |
        One interactive element to render for this turn. `props` is model-authored UI scaffolding
        only — ids, flags, labels, field/choice specs — never salon data (prices, availability):
        data-bearing components (`services`, `time-slot-picker`, …) hydrate themselves from the
        live public API.
      properties:
        type:
          type: string
          enum:
            - services
            - staff
            - hours
            - location
            - contact
            - booking-picker
            - date-picker
            - time-slot-picker
            - form
            - button-group
            - radio-group
            - checkbox-group
            - option-list
          description: Which component to render.
        props:
          type: object
          additionalProperties: true
          description: |
            Component-specific scaffolding. Common keys by type:
            `services` → `forStaffId`, `forBooking`; `staff` → `forServiceId`;
            `booking-picker` / `date-picker` → `serviceId`, `staffId`, `date`
            (`date` is yyyy-MM-dd, the day the visitor named — the picker opens on it);
            `time-slot-picker` → `serviceId`, `date`, `staffId`;
            `form` → `title`, `submitLabel`, `fields[] {name,label,type,required,pattern}`;
            `button-group` / `radio-group` / `checkbox-group` / `option-list` →
            `prompt`, `choices[] {label,value}` (the tapped `value` is sent back as the
            visitor's next message).

    SaveThemeRequest:
      type: object
      properties:
        heroBg:
          type: string
        heroTextColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
          description: Preset slug ("nunito", "playfair", ...) or any Google Fonts family name ("Noto Sans KR", ...). Default "Noto Sans KR".
        logoBgColor:
          type: string
        headerBg:
          type: string
          description: Navigation bar background color
        footerBg:
          type: string
          description: Footer background color
        chatLayout:
          type: string
          enum: [fullscreen, windowed]
          description: |
            How the Generative UI chat opens: "windowed" = a centered card; anything else
            (default when omitted, and the legacy value "app") = fullscreen.
          example: "fullscreen"

