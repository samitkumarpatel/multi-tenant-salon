        label: { type: string, nullable: true }
        price: { type: number, format: double }
        currency: { type: string }
        quantityOnHand: { type: integer }
        reorderLevel: { type: integer }
        active: { type: boolean }

    ShopShippingAddress:
      type: object
      properties:
        line1: { type: string, nullable: true }
        line2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        country: { type: string, nullable: true }
        zipCode: { type: string, nullable: true }

    OrderLineActivity:
      type: object
      description: One entry on an order line's timeline.
      properties:
        id: { type: integer, format: int64 }
        orderLineId: { type: integer, format: int64 }
        type:
          type: string
          enum: [LINE_CREATED, STATUS_CHANGED, USER_NOTIFIED, NOTE_ADDED]
        message: { type: string, nullable: true }
        actor: { type: string, nullable: true, description: '"customer" or "admin".' }
        createdAt: { type: string, format: date-time }

    OrderActivity:
      type: object
      description: >
        One entry on an order's activity timeline. `CUSTOMER_NOTIFIED` entries additionally carry
        the exact email the customer received — `channel` / `subject` / `body` / `status` — appended
        by the shop module when the notification module acknowledges a send. All other types leave
        those four fields null.
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        type:
          type: string
          enum:
            [ORDER_PLACED, INVOICE_SENT, STATUS_CHANGED, REFUND_INITIATED, REFUND_ACCEPTED,
             REFUND_REJECTED, CREDIT_NOTE_CREATED, CREDIT_PAID, SHIPMENT_CREATED, CUSTOMER_NOTIFIED,
             WORK_NOTE]
        message: { type: string, nullable: true }
        actor: { type: string, nullable: true }
        notified: { type: boolean }
        channel: { type: string, nullable: true, example: EMAIL }
        subject: { type: string, nullable: true }
        body: { type: string, nullable: true, description: Plain-text body of the sent message. }
        status: { type: string, nullable: true, enum: [SENT, LOGGED, FAILED], description: "LOGGED = dispatch skipped (e.g. provider not configured in dev)." }
        createdAt: { type: string, format: date-time }

    ShopOrderLine:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64, nullable: true }
        variantId: { type: integer, format: int64, nullable: true }
        productName: { type: string }
        variantLabel: { type: string, nullable: true }
        unitPrice: { type: number, format: double }
        quantity: { type: integer }
        lineTotal: { type: number, format: double }
        activities:
          type: array
          description: Populated on the order-detail endpoint; empty in the list view.
          items: { $ref: "#/components/schemas/OrderLineActivity" }

    ShopOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        salonId: { type: string, format: uuid }
        orderNumber: { type: string, example: "SO-1A2B3C4D" }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string, nullable: true }
        shippingAddress:
          $ref: "#/components/schemas/ShopShippingAddress"
        status: { $ref: "#/components/schemas/OrderStatus" }
        paymentStatus: { type: string, enum: [PENDING, PAID, FAILED] }
        paymentReference: { type: string, nullable: true, example: "DUMMY-1A2B3C4D" }
        subtotal: { type: number, format: double }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ShopOrderLine" }
        activities:
          type: array
          description: The order's activity timeline. Populated on the order-detail endpoint; omitted in the list view.
          items: { $ref: "#/components/schemas/OrderActivity" }

    ShopOrderPage:
      type: object
      description: One page of the admin orders list.
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/ShopOrder" }
        page: { type: integer, description: Zero-based page index }
        size: { type: integer, description: Page size actually applied (1–100) }
        totalElements: { type: integer, format: int64, description: Orders matching the filter across all pages }
        totalPages: { type: integer }
        statusCounts:
          type: object
          description: Count per status over the search / date scope (ignores the `status` filter).
          additionalProperties: { type: integer, format: int64 }
          example: { NEW: 5, PROCESSING: 2, SHIPPED: 1, FULFILLED: 8, CANCELLED: 0 }

    ShopCheckoutRequest:
      type: object
      required: [customerName, customerEmail, items]
      properties:
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string, nullable: true }
        shippingAddress:
          $ref: "#/components/schemas/ShopShippingAddress"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
        returnUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Page Stripe Checkout returns the customer to (normally `window.location.href`). Used only
            when its origin belongs to this salon — the `<handler>.<SALON_DOMAIN>` subdomain, the salon's
            active custom domain, or a configured booking/website app. Anything else falls back to the
            default page. `payment`, `reference` and `session_id` query params are replaced on return.
        inlineCheckout:
          type: boolean
          nullable: true
          description: |
            The client can show Stripe's form in its own page. Only then does the salon's chosen checkout
            style for the area (`EMBEDDED` / `ELEMENTS`) apply; otherwise (MCP apps, chat, older clients)
            the response is always a redirect `checkoutUrl`.
