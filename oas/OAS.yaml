openapi: 3.1.0
info:
  title: Multi-Tenant Saloon API
  description: |
    REST API for the multi-tenant SaaS saloon/salon management platform.

    ## Module / Access Hierarchy

    The API is split into four distinct path namespaces:

    | Namespace | Base Path | Who uses it |
    |---|---|---|
    | **Saloon Onboarding** | `/api/saloon-onboarding` | Anyone registering a new saloon tenant; platform-level listing |
    | **Customer** | `/api/saloon/{saloonId}/...` | Public/customer-facing — browse, book, read |
    | **Admin** | `/api/saloon-admin/{saloonId}/...` | Saloon owner/administrator — manage, configure, operate |
    | **Utility** | `/api/saloon-utility/...` | Any consumer needing reference data (countries with embedded currency info) |

    ### Customer sub-paths
    - `/api/saloon/{saloonId}/services/...` — browse the service catalog
    - `/api/saloon/{saloonId}/staff/...` — view staff members
    - `/api/saloon/{saloonId}/booking/...` — slot discovery and appointment creation
    - `/api/saloon/{saloonId}/website` — public website theme

    ### Admin sub-paths
    - `/api/saloon-admin/{saloonId}/services/...` — full CRUD on the service catalog
    - `/api/saloon-admin/{saloonId}/staff/...` — full CRUD + availability management
    - `/api/saloon-admin/{saloonId}/booking/...` — view, reschedule, and change booking status
    - `/api/saloon-admin/{saloonId}/website` — website theme + publish trigger
    - `/api/saloon-admin/{saloonId}/website-type` — get or update the active website presentation type

    ## Notification Events
    Every booking and calendar activity emits an internal Spring Modulith event handled by
    the `notification` module:
    - **BookingCreatedEvent** → booking confirmation sent to customer.
    - **BookingStatusChangedEvent** → customer notified on confirm/cancel/complete/no-show.
    - **BookingRescheduledEvent** → customer notified of new date/time.
    - **StaffScheduleUpdatedEvent** → admin notified of weekly schedule replacement.
    - **StaffAvailabilityOverrideAddedEvent** → admin notified of new date override.
    - **StaffAvailabilityOverrideRemovedEvent** → admin notified of deleted override.
  version: 2.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: SaloonOnboarding
    description: |
      New saloon tenant registration and platform-level saloon listing.
      Creating a saloon triggers auto-enrolment of the owner as a staff member
      (`isOwner = true`, `role = MANAGER`, `availableForBooking = true`).
  - name: Saloon
    description: Customer-facing saloon discovery — browse, search by handler, view details.
  - name: Services
    description: Customer-facing service catalog — list and get services for a saloon.
  - name: Staff
    description: Customer-facing staff roster — list and view staff member profiles.
  - name: Booking
    description: |
      Customer-facing appointment flow — slot discovery and booking creation/retrieval.
  - name: Website
    description: Customer-facing website theme — read the public visual theme for a saloon.
  - name: SaloonAdmin
    description: |
      Admin operations on the saloon aggregate — update details, manage features, delete.
      In production these endpoints must be protected by an auth layer (e.g. Bearer JWT).
  - name: AdminServices
    description: Admin service catalog management — full CRUD on a saloon's service items.
  - name: AdminStaff
    description: Admin staff roster management — onboard, update, and remove staff members.
  - name: AdminAvailability
    description: |
      Admin staff availability calendar — replace weekly schedules and manage date-specific
      overrides. Reads are shared with the slot-discovery engine.
  - name: AdminBooking
    description: |
      Admin booking management — list, reschedule, change status (confirm/cancel/complete/
      no-show), and delete bookings.
  - name: AdminWebsite
    description: Admin website management — save/update the website theme and trigger publish.
  - name: Utility
    description: Reference data — countries with embedded currency info. Loaded from static classpath resources.

paths:

  # ─── Saloon Onboarding ────────────────────────────────────────────────────────

  /api/saloon-onboarding:
    get:
      tags: [SaloonOnboarding]
      summary: List all saloons (platform view)
      operationId: listSaloons
      responses:
        "200":
          description: List of all saloons across all tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Saloon"

    post:
      tags: [SaloonOnboarding]
      summary: Register a new saloon (tenant onboarding)
      operationId: createSaloon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaloonRequest"
      responses:
        "201":
          description: Saloon registered; owner auto-enrolled as staff member
          headers:
            Location:
              description: URL of the newly created saloon, e.g. /api/saloon/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSaloonResponse"

  # ─── Customer — Saloon Discovery ─────────────────────────────────────────────

  /api/saloon/{saloonIdOrHandler}:
    get:
      tags: [Saloon]
      summary: Get saloon by ID or handler (public)
      description: |
        Accepts either a UUID (`a1b2c3d4-e5f6-7890-abcd-ef1234567890`) or a handler slug
        (`glam-saloon`). UUID lookup is tried first; if the value is not a valid UUID the
        request falls back to a handler lookup.
      operationId: getSaloon
      parameters:
        - name: saloonIdOrHandler
          in: path
          required: true
          schema:
            type: string
          description: Saloon UUID or URL-friendly handler slug
      responses:
        "200":
          description: Saloon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saloon"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Services ──────────────────────────────────────────────────────

  /api/saloon/{saloonId}/services:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [Services]
      summary: List services for a saloon (public)
      operationId: listServices
      responses:
        "200":
          description: List of active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceItem"

  /api/saloon/{saloonId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/ServiceId"

    get:
      tags: [Services]
      summary: Get a service by ID (public)
      operationId: getService
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Staff ─────────────────────────────────────────────────────────

  /api/saloon/{saloonId}/staff:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [Staff]
      summary: List staff members for a saloon (public)
      operationId: listStaff
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /api/saloon/{saloonId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [Staff]
      summary: Get a staff member by ID (public)
      operationId: getStaffMember
      responses:
        "200":
          description: Staff member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Booking ───────────────────────────────────────────────────────

  /api/saloon/{saloonId}/booking/slots:
    get:
      tags: [Booking]
      summary: Get booking slots for a service on a given date
      description: |
        Customer-facing. Returns all time slots for a service on a specific date — both
        available and already-booked ones. Slots are derived from each eligible staff
        member's weekly schedule or date-specific override.
        Each slot carries a `booked` flag: `false` means the slot is open and selectable;
        `true` means it is taken (existing non-cancelled booking) and should be shown
        grayed-out / non-selectable in the UI.
        Optionally filter to a single staff member via `staffId`.
      operationId: getAvailableSlots
      parameters:
        - $ref: "#/components/parameters/SaloonId"
        - name: serviceId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-08-01"
        - name: staffId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter slots for a specific staff member; omit to see slots across all available staff
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSlot"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/saloon/{saloonId}/booking:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    post:
      tags: [Booking]
      summary: Create a booking
      description: |
        Customer-facing. Books an available slot for a service. `staffId` is optional — the
        system auto-assigns the first available staff member if omitted.
        Emits **BookingCreatedEvent** → customer receives a booking confirmation notification.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Requested slot is no longer available

  /api/saloon/{saloonId}/booking/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    get:
      tags: [Booking]
      summary: Get a booking by ID
      operationId: getBooking
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Website Theme ──────────────────────────────────────────────────

  /api/saloon/{saloonId}/website:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [Website]
      summary: Get website theme for a saloon (public)
      description: |
        Returns the visual theme used to render the saloon's public-facing website.
        If no theme has been saved yet, sensible defaults are returned without touching the DB.
      operationId: getTheme
      responses:
        "200":
          description: Website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Saloon Management ────────────────────────────────────────────────

  /api/saloon-admin/{saloonId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [SaloonAdmin]
      summary: Get saloon details (admin)
      description: Accepts either a UUID or a handler slug — same lookup logic as the public endpoint.
      operationId: adminGetSaloon
      responses:
        "200":
          description: Saloon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saloon"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [SaloonAdmin]
      summary: Update saloon details (admin)
      description: Admin-only. Updates name, location, contact info, and operating hours. Owner, handler, and features are preserved.
      operationId: updateSaloon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSaloonRequest"
      responses:
        "200":
          description: Updated saloon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saloon"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [SaloonAdmin]
      summary: Delete a saloon (admin)
      description: Admin-only. Permanently removes the saloon and all associated data (services, staff, bookings) via cascade delete.
      operationId: deleteSaloon
      responses:
        "204":
          description: Saloon deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/saloon-admin/{saloonId}/features:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    put:
      tags: [SaloonAdmin]
      summary: Replace saloon feature flags (admin)
      description: Admin-only. Replaces the full set of enabled features for the saloon (BOOKING, ANALYTICS, etc.).
      operationId: updateSaloonFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SaloonFeature"
              example: ["BOOKING", "ANALYTICS"]
      responses:
        "200":
          description: Features updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saloon"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Website ──────────────────────────────────────────────────────────

  /api/saloon-admin/{saloonId}/website:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [AdminWebsite]
      summary: Get website theme (admin)
      operationId: adminGetTheme
      responses:
        "200":
          description: Website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminWebsite]
      summary: Save website theme (admin)
      description: Admin-only. Upserts the website theme for the saloon. Creates a new row if none exists; otherwise updates in place.
      operationId: saveTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveThemeRequest"
      responses:
        "200":
          description: Theme saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"

  /api/saloon-admin/{saloonId}/website/publish:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    post:
      tags: [AdminWebsite]
      summary: Publish the saloon website (admin)
      description: |
        Admin-only. Triggers the website publish pipeline. Requires the `STATIC_WEBSITE`
        feature to be enabled. Returns immediately; actual deployment (S3, DNS) is handled
        asynchronously by the `website` module.
      operationId: publishSaloon
      responses:
        "202":
          description: Publish request accepted
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Saloon does not have the STATIC_WEBSITE feature enabled

  /api/saloon-admin/{saloonId}/website-type:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [AdminWebsite]
      summary: Get website type (admin)
      description: |
        Admin-only. Returns the current website presentation type for the saloon.
        Defaults to `STATIC_WEBSITE` if the theme row does not yet exist.
        This endpoint is called when the admin navigates to the website tab.
      operationId: getWebsiteType
      responses:
        "200":
          description: Current website type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTypeResponse"

    patch:
      tags: [AdminWebsite]
      summary: Update website type (admin)
      description: |
        Admin-only. Updates the website presentation type. One of `STATIC_WEBSITE`,
        `GENERATIVE_UI`, `CUSTOMISE_WEBSITE_CONTACT_US`. The rest of the theme is preserved.
        Creates the theme row if it does not yet exist.
      operationId: updateWebsiteType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteTypeRequest"
      responses:
        "200":
          description: Updated website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Services ─────────────────────────────────────────────────────────

  /api/saloon-admin/{saloonId}/services:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [AdminServices]
      summary: List services (admin)
      operationId: adminListServices
      responses:
        "200":
          description: List of service items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceItem"

    post:
      tags: [AdminServices]
      summary: Add a service to the catalog (admin)
      operationId: addService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"

  /api/saloon-admin/{saloonId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/ServiceId"

    get:
      tags: [AdminServices]
      summary: Get a service by ID (admin)
      operationId: adminGetService
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminServices]
      summary: Update a service (admin)
      description: Admin-only. Updates pricing, duration, category, assigned staff, and active status.
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminServices]
      summary: Delete a service (admin)
      operationId: deleteService
      responses:
        "204":
          description: Service deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff ────────────────────────────────────────────────────────────

  /api/saloon-admin/{saloonId}/staff:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [AdminStaff]
      summary: List staff members (admin)
      operationId: adminListStaff
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

    post:
      tags: [AdminStaff]
      summary: Onboard a new staff member (admin)
      operationId: onboardStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardStaffRequest"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /api/saloon-admin/{saloonId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminStaff]
      summary: Get a staff member by ID (admin)
      operationId: adminGetStaffMember
      responses:
        "200":
          description: Staff member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminStaff]
      summary: Update a staff member (admin)
      description: Admin-only. Updates name, contact, role, status, specializations, photos, bio, and booking availability.
      operationId: updateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminStaff]
      summary: Remove a staff member (admin)
      description: Admin-only. Removes a staff member from the roster. Existing bookings for this member are cascade-deleted. Owner-staff entries (`isOwner = true`) cannot be deleted.
      operationId: deleteStaffMember
      responses:
        "204":
          description: Staff member removed
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff Availability ───────────────────────────────────────────────

  /api/saloon-admin/{saloonId}/staff/{staffId}/availability:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: Get staff weekly availability schedule (admin)
      operationId: getStaffAvailability
      responses:
        "200":
          description: Weekly availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

    put:
      tags: [AdminAvailability]
      summary: Replace staff weekly availability schedule (admin)
      description: |
        Admin-only. Replaces the entire weekly schedule for a staff member. Previous entries
        are deleted before the new set is saved.
        Emits **StaffScheduleUpdatedEvent** → notification module logs the change.
      operationId: setStaffAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DayScheduleRequest"
      responses:
        "200":
          description: Updated availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

  /api/saloon-admin/{saloonId}/staff/{staffId}/availability/overrides:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: List date-specific availability overrides (admin)
      operationId: getAvailabilityOverrides
      responses:
        "200":
          description: List of overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityOverride"

    post:
      tags: [AdminAvailability]
      summary: Add a date-specific availability override (admin)
      description: |
        Admin-only. Pins availability for a staff member on a specific date, overriding the
        regular weekly schedule. Set `available: false` with no times to mark a day as
        unavailable (e.g. holiday or sick leave).
        Emits **StaffAvailabilityOverrideAddedEvent** → notification module logs the change.
      operationId: addAvailabilityOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOverrideRequest"
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityOverride"

  /api/saloon-admin/{saloonId}/staff/{staffId}/availability/overrides/{overrideId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/StaffId"
      - name: overrideId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    delete:
      tags: [AdminAvailability]
      summary: Remove a date-specific availability override (admin)
      description: |
        Admin-only. Deletes the override so the regular weekly schedule applies again for
        that date. Scoped to the given saloonId/staffId pair.
        Emits **StaffAvailabilityOverrideRemovedEvent** → notification module logs the change.
      operationId: removeAvailabilityOverride
      responses:
        "204":
          description: Override removed

  # ─── Admin — Booking ──────────────────────────────────────────────────────────

  /api/saloon-admin/{saloonId}/booking:
    parameters:
      - $ref: "#/components/parameters/SaloonId"

    get:
      tags: [AdminBooking]
      summary: List all bookings for a saloon (admin)
      description: Admin-only. Returns all bookings across all statuses.
      operationId: listBookings
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /api/saloon-admin/{saloonId}/booking/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    get:
      tags: [AdminBooking]
      summary: Get a booking by ID (admin)
      operationId: adminGetBooking
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminBooking]
      summary: Reschedule a booking (admin)
      description: |
        Admin-only. Moves a booking to a different date, time, or staff member. End time is
        recalculated automatically from the service duration.
        Emits **BookingRescheduledEvent** → customer receives a reschedule notification.
      operationId: rescheduleBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Booking rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminBooking]
      summary: Delete a booking (admin)
      description: Admin-only. Permanently removes a booking record.
      operationId: deleteBooking
      responses:
        "204":
          description: Booking deleted

  /api/saloon-admin/{saloonId}/booking/{bookingId}/confirm:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Confirm a booking (admin)
      description: |
        Admin-only. Moves the booking from PENDING to CONFIRMED.
        Emits **BookingStatusChangedEvent** → customer receives a confirmation notification.
      operationId: confirmBooking
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/saloon-admin/{saloonId}/booking/{bookingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Cancel a booking (admin)
      description: |
        Admin-only. Moves the booking to CANCELLED status.
        Emits **BookingStatusChangedEvent** → customer receives a cancellation notification.
      operationId: cancelBooking
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/saloon-admin/{saloonId}/booking/{bookingId}/complete:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as completed (admin)
      description: |
        Admin-only. Marks the appointment as COMPLETED after the customer's visit.
        Emits **BookingStatusChangedEvent** → customer receives a completion notification.
      operationId: completeBooking
      responses:
        "200":
          description: Booking completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/saloon-admin/{saloonId}/booking/{bookingId}/no-show:
    parameters:
      - $ref: "#/components/parameters/SaloonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as no-show (admin)
      description: |
        Admin-only. Records that the customer did not attend their appointment.
        Emits **BookingStatusChangedEvent** → customer receives a no-show notification.
      operationId: noShowBooking
      responses:
        "200":
          description: Booking marked as no-show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Utility ──────────────────────────────────────────────────────────────────

  /api/saloon-utility/countries:
    get:
      tags: [Utility]
      summary: List all supported countries
      operationId: listCountries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"


# ─── Components ───────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the identity provider after the admin authenticates.
        **Not yet enforced** — authentication/authorisation is a planned future addition.
        Currently the `saloonId` path parameter is the only enforcement in place.

  parameters:
    SaloonId:
      name: saloonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Saloon UUID

    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Service item ID

    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Staff member ID

    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Booking ID

  responses:
    NotFound:
      description: Resource not found

  schemas:

    # ── Saloon ────────────────────────────────────────────────────────────────

    Saloon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handler:
          type: string
          description: URL-friendly slug
        owner:
          $ref: "#/components/schemas/Owner"
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SaloonFeature"
          description: Serialized as a flat array of feature strings
          example: ["BOOKING", "ANALYTICS"]
        createdAt:
          type: string
          format: date-time

    CreateSaloonRequest:
      type: object
      required: [name, ownerName, ownerEmail]
      properties:
        name:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
          format: email
        ownerPhone:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SaloonFeature"

    CreateSaloonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        handler:
          type: string

    UpdateSaloonRequest:
      type: object
      properties:
        name:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"

    Owner:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    Location:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zipCode:
          type: string

    ContactInfo:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri

    OperatingHours:
      type: object
      properties:
        day:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        openTime:
          type: string
          description: Opening time in HH:mm format
          example: "09:00"
        closeTime:
          type: string
          description: Closing time in HH:mm format
          example: "18:00"
        closed:
          type: boolean
          default: false

    SaloonFeature:
      type: string
      enum:
        - STATIC_WEBSITE
        - BOOKING
        - MEMBERSHIP
        - WEBSHOP
        - ANALYTICS
        - LOYALTY_PROGRAM

    # ── Service ───────────────────────────────────────────────────────────────

    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saloonId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
          example: USD
        durationMinutes:
          type: integer
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string
          description: Serialized as a flat array of staff ID strings
        createdAt:
          type: string
          format: date-time

    AddServiceRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
        durationMinutes:
          type: integer
        category:
          $ref: "#/components/schemas/ServiceCategory"
        assignedStaffIds:
          type: array
          items:
            type: string

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        currency:
          type: string
        durationMinutes:
          type: integer
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string

    ServiceCategory:
      type: string
      enum:
        - HAIR
        - MAKEUP
        - NAILS
        - SKIN_CARE
        - BEARD
        - MASSAGE
        - WAXING
        - OTHER

    # ── Staff ─────────────────────────────────────────────────────────────────

    StaffMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saloonId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/StaffStatus"
        isOwner:
          type: boolean
          description: >
            True when this staff member was auto-created from the saloon owner's profile.
            Owner-staff entries cannot be deleted; the owner may opt out of the booking
            calendar by setting availableForBooking to false.
          default: false
        availableForBooking:
          type: boolean
          description: >
            When false, this staff member is excluded from slot discovery and will not
            be offered to customers during booking.
          default: true
        specializations:
          type: array
          items:
            type: string
          description: Serialized as a flat array of specialization strings
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          description: Photo URLs shown on the public website
        bio:
          type: string
          description: Short bio shown on the public website
        createdAt:
          type: string
          format: date-time

    OnboardStaffRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        specializations:
          type: array
          items:
            type: string
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        bio:
          type: string

    UpdateStaffRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/StaffStatus"
        availableForBooking:
          type: boolean
          description: Set to false to remove this staff member from slot discovery
          default: true
        specializations:
          type: array
          items:
            type: string
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        bio:
          type: string

    StaffRole:
      type: string
      enum:
        - MANAGER
        - STYLIST
        - COLORIST
        - MAKEUP_ARTIST
        - NAIL_TECHNICIAN
        - RECEPTIONIST
        - ASSISTANT

    StaffStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - ON_LEAVE

    # ── Availability ─────────────────────────────────────────────────────────

    StaffAvailability:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saloonId:
          type: string
          format: uuid
        staffId:
          type: integer
          format: int64
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        startTime:
          type: string
          format: time
          example: "09:00"
        endTime:
          type: string
          format: time
          example: "17:00"
        available:
          type: boolean

    DayScheduleRequest:
      type: object
      required: [dayOfWeek, startTime, endTime, available]
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        startTime:
          type: string
          format: time
          example: "09:00"
        endTime:
          type: string
          format: time
          example: "17:00"
        available:
          type: boolean

    StaffAvailabilityOverride:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saloonId:
          type: string
          format: uuid
        staffId:
          type: integer
          format: int64
        overrideDate:
          type: string
          format: date
          example: "2026-12-25"
        startTime:
          type: string
          format: time
          nullable: true
        endTime:
          type: string
          format: time
          nullable: true
        available:
          type: boolean
        reason:
          type: string
          example: "Public holiday"

    AddOverrideRequest:
      type: object
      required: [overrideDate, available]
      properties:
        overrideDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
          nullable: true
        endTime:
          type: string
          format: time
          nullable: true
        available:
          type: boolean
        reason:
          type: string

    # ── Booking ───────────────────────────────────────────────────────────────

    AvailableSlot:
      type: object
      properties:
        staffId:
          type: integer
          format: int64
        startTime:
          type: string
          format: time
          example: "10:00"
        endTime:
          type: string
          format: time
          example: "11:00"
        booked:
          type: boolean
          description: >
            true when an existing (non-cancelled) booking already occupies this slot.
            The slot is still returned so the UI can display it as grayed-out / non-selectable.
            false when the slot is open and can be booked.
          example: false

    Booking:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saloonId:
          type: string
          format: uuid
        serviceId:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        appointmentDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          $ref: "#/components/schemas/BookingStatus"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]

    CreateBookingRequest:
      type: object
      required: [serviceId, customerName, customerEmail, appointmentDate, startTime]
      properties:
        serviceId:
          type: integer
          format: int64
        staffId:
          type: integer
          format: int64
          description: Optional; system auto-assigns first available staff if omitted
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        appointmentDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        notes:
          type: string

    UpdateBookingRequest:
      type: object
      properties:
        appointmentDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        staffId:
          type: integer
          format: int64
        notes:
          type: string

    # ── Website Theme ─────────────────────────────────────────────────────────

    WebsiteTheme:
      type: object
      properties:
        saloonId:
          type: string
          format: uuid
        heroBg:
          type: string
          description: Hero section background color (CSS value)
        heroTextColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        logoBgColor:
          type: string
        headerBg:
          type: string
          description: Navigation bar background color
        footerBg:
          type: string
          description: Footer background color
        mapsUrl:
          type: string
          description: Google Maps embed URL for the saloon location
        websiteType:
          $ref: "#/components/schemas/WebsiteType"
        updatedAt:
          type: string
          format: date-time

    SaveThemeRequest:
      type: object
      properties:
        heroBg:
          type: string
        heroTextColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        logoBgColor:
          type: string
        headerBg:
          type: string
          description: Navigation bar background color
        footerBg:
          type: string
          description: Footer background color
        mapsUrl:
          type: string
          description: Google Maps embed URL for the saloon location

    WebsiteType:
      type: string
      enum: [STATIC_WEBSITE, GENERATIVE_UI, CUSTOMISE_WEBSITE_CONTACT_US]
      description: Website presentation type

    WebsiteTypeResponse:
      type: object
      properties:
        websiteType:
          $ref: "#/components/schemas/WebsiteType"

    WebsiteTypeRequest:
      type: object
      required: [websiteType]
      properties:
        websiteType:
          $ref: "#/components/schemas/WebsiteType"

    # ── Utility ───────────────────────────────────────────────────────────────

    Country:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: IN
        dialCode:
          type: string
          example: "+91"
        currencyCode:
          type: string
          example: INR
        currencyName:
          type: string
          example: Indian Rupee
        currencySymbol:
          type: string
          example: "₹"
