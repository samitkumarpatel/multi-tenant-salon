        customer name / email / phone, payment reference, tracking number, or any line's product name.
        `from` / `to` bound the order date (`yyyy-MM-dd`, the `to` day is included, interpreted in UTC).
        `statusCounts` in the response is faceted on `q` + date range but not on `status`.
      operationId: adminListOrders
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
