    # ── Booking ───────────────────────────────────────────────────────────────

    AvailableSlot:
      type: object
      properties:
        staffId:
          type: integer
          format: int64
        startTime:
          type: string
          format: time
          example: "10:00"
        endTime:
          type: string
          format: time
          example: "11:00"
        booked:
          type: boolean
          description: >
            true when an existing (non-cancelled) booking already occupies this slot.
            The slot is still returned so the UI can display it as grayed-out / non-selectable.
            false when the slot is open and can be booked.
          example: false

    Booking:
      type: object
