openapi: 3.1.0
info:
  title: Multi-Tenant Salon API
  description: |
    REST API for the multi-tenant SaaS salon/salon management platform.

    ## Module / Access Hierarchy

    The API is split into four distinct path namespaces:

    | Namespace | Base Path | Who uses it |
    |---|---|---|
    | **Salon Onboarding** | `/api/salon-onboarding` | Anyone registering a new salon tenant; platform-level listing |
    | **Customer** | `/api/salon/{salonId}/...` | Public/customer-facing — browse, book, read |
    | **Admin** | `/api/salon-admin/{salonId}/...` | Salon owner/administrator — manage, configure, operate. Also callable by a platform super-admin for any salon, since super-admin management of a specific salon reuses these endpoints rather than duplicating them. |
    | **Super Admin** | `/api/salon-super-admin/...` | Platform super-admin — cross-tenant management of all salons |
    | **Staff Portal** | `/api/salon-staff/...` | Authenticated staff member — self-service profile, appointments, personal holidays |
    | **Utility** | `/api/salon-utility/...` | Any consumer needing reference data (countries with embedded currency info) |
    | **Analytics Ingestion** | `/api/analytics/events` | Public, anonymous — client-side JS on the salon's public website reporting page views/clicks |

    ### Customer sub-paths
    - `/api/salon/{salonId}/services/...` — browse the service catalog
    - `/api/salon/{salonId}/staff/...` — view staff members
    - `/api/salon/{salonId}/booking/...` — slot discovery and appointment creation
    - `/api/salon/{salonId}/website` — public website theme
    - `/api/salon/{salonId}/policies` — published, salon-specific legal policies for the website or booking page
    - `/api/salon/{salonId}/chat` — AI assistant for the Generative UI website mode

    ### Admin sub-paths
    - `/api/salon-admin/{salonId}/services/...` — full CRUD on the service catalog
    - `/api/salon-admin/{salonId}/staff/...` — full CRUD + availability management
    - `/api/salon-admin/{salonId}/booking/...` — view, reschedule, and change booking status
    - `/api/salon-admin/{salonId}/website` — website theme management
    - `/api/salon-admin/{salonId}/website-type` — get or update the active website presentation type
    - `/api/salon-admin/{salonId}/policies` — edit and publish salon-specific customer policies
    - `/api/salon-admin/{salonId}/analytics/summary` — website analytics rollup (requires the `ANALYTICS` feature)
    - `/api/salon-admin/{salonId}/analytics/genui-summary` — Generative-UI chat usage rollup (requires the `ANALYTICS` feature)

    ## Notification Events
    Domain events are emitted via Spring Modulith and handled by the `notification` module,
    which is the single entry point for every outbound email. Emails are sent via Mailjet;
    when `spring.application.notification.mailjet.api-key` is unset (the default for dev/test),
    sends are logged instead of dispatched.
    - **SalonCreatedEvent** → welcome email to the owner with admin and public-website links.
    - **SalonUpdatedEvent** → owner notified whenever salon settings (profile, features,
      booking settings, or re-enabling) are changed.
    - **SalonDisabledEvent** → owner notified the salon has been disabled.
    - **BookingCreatedEvent** → booking confirmation sent to customer.
    - **BookingStatusChangedEvent** → customer notified on confirm/cancel/complete/no-show.
    - **BookingRescheduledEvent** → customer notified of new date/time.
    - **StaffBookingAssignedEvent** → the assigned staff member is notified of a new booking.
    - **StaffScheduleUpdatedEvent** → logged for admin visibility (weekly schedule replacement).
    - **StaffAvailabilityOverrideAddedEvent** → logged for admin visibility (new date override).
    - **StaffAvailabilityOverrideRemovedEvent** → logged for admin visibility (deleted override).
  version: 2.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: AdminPayments
    description: Stripe Connect (Accounts v2) onboarding and embedded account components, per-area payment settings and checkout style, card readers (Stripe Terminal), the payment ledger with refunds, and the Connect webhook.
  - name: SalonOnboarding
    description: |
      New salon tenant registration and platform-level salon listing.
      Creating a salon triggers auto-enrolment of the owner as a staff member
      (`isOwner = true`, `role = MANAGER`, `availableForBooking = true`).
  - name: Salon
    description: Customer-facing salon discovery — browse, search by handler, view details.
  - name: Services
    description: Customer-facing service catalog — list and get services for a salon.
  - name: Staff
    description: Customer-facing staff roster — list and view staff member profiles.
  - name: Booking
    description: |
      Customer-facing appointment flow — slot discovery and booking creation/retrieval.
  - name: Website
    description: Customer-facing website theme — read the public visual theme for a salon.
  - name: LegalPolicies
    description: Salon-specific legal policy drafts, publication, and public website/booking links.
  - name: Chat
    description: |
      Customer-facing AI assistant for the Generative UI website mode. Backed by an Anthropic
      model with tool-calling access to the salon's own public profile/staff/services/holidays
      endpoints — answers are grounded in live data, never invented.
  - name: Analytics
    description: |
      Public, anonymous ingestion of website activity events from the salon's public-website
      client-side JS. No authentication — `permitAll` in the security config. The batch is
      capped at 200 events; events for a salon that doesn't exist or hasn't enabled the
      `ANALYTICS` feature are silently dropped rather than rejected.
  - name: SalonAdmin
    description: |
      Admin operations on the salon aggregate — update details, manage features, delete.
      In production these endpoints must be protected by an auth layer (e.g. Bearer JWT).
  - name: AdminServices
    description: Admin service catalog management — full CRUD on a salon's service items.
  - name: AdminStaff
    description: Admin staff roster management — onboard, update, and remove staff members.
  - name: AdminAvailability
    description: |
      Admin staff availability calendar — replace weekly schedules and manage date-specific
      overrides. Reads are shared with the slot-discovery engine.
  - name: AdminBooking
    description: |
      Admin booking management — list, reschedule, change status (confirm/cancel/complete/
      no-show), and delete bookings.
  - name: AdminWebsite
    description: Admin website management — save/update the website theme and trigger publish.
  - name: AdminClosures
    description: |
      Admin salon-closure management — define date ranges when the entire salon is closed.
      When a closure covers the requested date, slot discovery returns an empty list and booking
      creation returns HTTP 400. Use this for vacations, public holidays, or emergency shutdowns.
  - name: AdminHolidays
    description: |
      Admin recurring/one-off holiday management. Adding a holiday automatically generates
      salon-closure rows for the current year and up to 4 years ahead so the booking engine
      blocks those dates without manual closure entry each year.
  - name: AdminAnalytics
    description: |
      Admin website-analytics summary — owner-facing rollup of the events ingested via the
      public Analytics endpoint. Mounted under the same {salonId}-templated admin prefix, so
      it inherits the ownership check from the global security config. Returns 403 if the
      salon hasn't enabled the `ANALYTICS` feature.
  - name: Shop
    description: |
      Public storefront for the `WEBSHOP` feature — browse active products (with per-variant
      pricing and stock) and place an order. Checkout runs an atomic stock decrement and a
      dummy payment step (the order comes back `PAID`).
  - name: Membership
    description: |
      Public membership catalogue, online sign-up and renewal for the `MEMBERSHIP` feature. Members pay each
      period with a one-time Stripe Checkout on the salon's connected account (like shop orders), receive a QR
      code (their member code) by email, and get a renewal link before the period ends.
  - name: AdminMembership
    description: |
      Owner/admin management of membership plans and members — payment status and history, renewal links,
      cancellation (now or at period end), QR check-in lookup, and the membership overview.
  - name: AdminShop
    description: |
      Owner/admin management of the shop: brands, categories, products and their variants,
      inventory (stock counts live on the variant), and customer orders. Each order line
      carries an activity timeline; "Notify User" and "Add a Note" append to it (the notify
      action also emits a dummy customer email).
  - name: StaffPortal
    description: |
      Staff self-service portal endpoints. A staff member authenticates via OAuth2 (or,
      in local/mock mode, an email lookup plus a mock OTP), then `GET /api/salon-staff/me`
      resolves their own staff record(s) from the bearer token before they use their
      `staffId` to manage their own profile, view their appointments, and book personal
      holidays (date-specific unavailability overrides that block new customer bookings).
  - name: SuperAdmin
    description: |
      Platform super-admin endpoints — cross-tenant management of all salons.
      Requires super-admin authentication (email `admin@my-salon.online` + OTP).
      All endpoints are prefixed `/api/salon-super-admin`.
  - name: Utility
    description: Reference data — countries with embedded currency info. Loaded from static classpath resources.
  - name: Internal
    description: |
      Service-to-service endpoints — consumed by internal ECS services only (e.g. the Authorization Server).
      These paths are NOT exposed through the public API Gateway and must be protected at the network/IAM layer.

paths:

  # ─── Internal ─────────────────────────────────────────────────────────────────

  /internal/user-identity:
    get:
      tags: [Internal]
      summary: Resolve user identity by email
      description: |
        Returns all `user_identity` view rows for the given email address.
        Used by the Authorization Server to load roles and salon associations for JWT issuance.
        Returns 404 when the email is not registered as an owner or active staff member.
      operationId: getUserIdentity
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Identity rows found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserIdentity"
        "404":
          description: No identity found for the given email

  # ─── Salon Onboarding ────────────────────────────────────────────────────────

  /api/salon-onboarding:
    get:
      tags: [SalonOnboarding]
      summary: List all salons (platform view)
      operationId: listSalons
      responses:
        "200":
          description: List of all salons across all tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"

    post:
      tags: [SalonOnboarding]
      summary: Register a new salon (tenant onboarding)
      operationId: createSalon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalonRequest"
      responses:
        "201":
          description: Salon registered; owner auto-enrolled as staff member
          headers:
            Location:
              description: URL of the newly created salon, e.g. /api/salon/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSalonResponse"

  # ─── Customer — Salon Discovery ─────────────────────────────────────────────

  /api/salon/{salonIdOrHandler}:
    get:
      tags: [Salon]
      summary: Get salon by ID or handler (public)
      description: |
        Accepts either a UUID (`a1b2c3d4-e5f6-7890-abcd-ef1234567890`) or a handler slug
        (`glam-salon`). UUID lookup is tried first; if the value is not a valid UUID the
        request falls back to a handler lookup.
      operationId: getSalon
      parameters:
        - name: salonIdOrHandler
          in: path
          required: true
          schema:
            type: string
          description: Salon UUID or URL-friendly handler slug
      responses:
        "200":
          description: Salon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Services ──────────────────────────────────────────────────────

  /api/salon/{salonId}/services:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Services]
      summary: List services for a salon (public)
      operationId: listServices
      responses:
        "200":
          description: List of active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceItem"

  /api/salon/{salonId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/ServiceId"

    get:
      tags: [Services]
      summary: Get a service by ID (public)
      operationId: getService
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Staff ─────────────────────────────────────────────────────────

  /api/salon/{salonId}/staff:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Staff]
      summary: List staff members for a salon (public)
      operationId: listStaff
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /api/salon/{salonId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [Staff]
      summary: Get a staff member by ID (public)
      operationId: getStaffMember
      responses:
        "200":
          description: Staff member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Booking ───────────────────────────────────────────────────────

  /api/salon/{salonId}/booking/slots:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [Booking]
      summary: Get booking slots for a service on a given date
      description: |
        Customer-facing. Returns all time slots for a service on a specific date — both
        available and already-booked ones. Slots are derived from each eligible staff
        member's weekly schedule or date-specific override. Times that have already started
        (server clock) are never returned — a past date returns an empty list.
        Each slot carries a `booked` flag: `false` means the slot is open and selectable;
        `true` means it is taken (existing non-cancelled booking) and should be shown
        grayed-out / non-selectable in the UI.
        Optionally filter to a single staff member via `staffId`.
        Returns an **empty array** when the date falls within a salon closure.
      operationId: getAvailableSlots
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-08-01"
        - name: staffId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter slots for a specific staff member; omit to see slots across all available staff
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSlot"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon/{salonId}/staff/{staffId}/schedule:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"
    get:
      tags: [Booking]
      summary: Get a staff member's schedule gaps
      description: |
        Customer-facing. Rolls up the days this staff member is never bookable — recurring
        weekly days off plus one-off unavailable dates — from the same data
        `getAvailableSlots` already checks per date. Lets a booking calendar grey out days
        for a specific staff member up front instead of only discovering a day is empty
        after the visitor picks it.
      operationId: getStaffSchedule
      responses:
        "200":
          description: This staff member's non-working weekdays and one-off closed dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSchedule"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon/{salonId}/availability:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [Booking]
      summary: Flexible availability query across a date range
      description: |
        Customer-facing. One call that answers the whole Gen-UI / assistant booking flow:
        which days can I come in, what times on a given day, which days does a stylist work,
        and who is free on a day. Scans `[from, to]` (defaults: today → the salon's
        `bookingAdvanceDays`; the span is capped at 92 days) and returns one
        `DayAvailability` per date with a `status`:
        `OPEN` (≥1 unbooked slot), `SALON_CLOSED` (holiday, one-off closure, or a
        non-working weekday — `reason` names it, e.g. the holiday's name, including
        multi-day and recurring holidays), `STAFF_OFF` (open but no candidate
        stylist scheduled), or `FULLY_BOOKED`. `granularity=SLOT` also fills each day's
        `slots`. `limit` returns only the first N `OPEN` days (blocked days omitted).
        `firstAvailable` is the soonest bookable slot in the range, or null.
      operationId: getAvailability
      parameters:
        - name: serviceId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Sizes the slots and (with no staffId) picks candidate stylists; omit for the default duration + all bookable staff
        - name: staffId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Restrict the query to one stylist
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: First date to scan; omitted or in the past → today
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Last date to scan; omit for today + bookingAdvanceDays (span capped at 92 days)
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [DAY, SLOT], default: DAY }
          description: SLOT also populates each day's `slots` array
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32 }
          description: Return only the first N OPEN days
      responses:
        "200":
          description: Day-by-day availability for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonAvailability"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon/{salonId}/booking:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    post:
      tags: [Booking]
      summary: Create a booking
      description: |
        Customer-facing. Books an available slot for a service. `staffId` is optional — the
        system auto-assigns the first available staff member if omitted.
        Returns HTTP 400 when `appointmentDate` falls within a salon closure, or (on this
        customer path only) when the requested date and start time have already passed.
        The initial booking status depends on the salon's `bookingRequiresConfirmation` setting:
        - `false` (default) → status is **CONFIRMED** immediately.
        - `true` → status is **PENDING**; an admin must confirm before the appointment is active.
        Emits **BookingCreatedEvent** → customer receives a booking confirmation notification.
        Also emits **StaffBookingAssignedEvent** → the assigned staff member is notified.

        **Stripe booking payments:** when the salon has booking payments enabled (see
        `/api/salon-admin/{salonId}/payments/settings`), the booking is created `PENDING` with
        `paymentStatus: PENDING` and the response is **200** `{ booking, checkoutUrl, checkout }` — redirect
        the customer to `checkoutUrl`, or (with `inlineCheckout: true` and an in-page checkout style chosen by
        the salon) mount Stripe's form from `checkout`. The Connect webhook later marks it `PAID` (→ CONFIRMED, or PENDING
        when confirmation is required) or `FAILED` (→ CANCELLED). Amount is the full service price
        or the configured deposit percentage.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "200":
          description: Booking reserved pending Stripe payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCheckoutResponse"
        "400":
          description: Salon is closed on the requested date (salon closure)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Requested slot is no longer available

  /api/salon/{salonId}/booking/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    get:
      tags: [Booking]
      summary: Get a booking by ID
      operationId: getBooking
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Website Theme ──────────────────────────────────────────────────

  /api/salon/{salonId}/website:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Website]
      summary: Get website theme for a salon (public)
      description: |
        Returns the visual theme used to render the salon's public-facing website.
        If no theme has been saved yet, sensible defaults are returned without touching the DB:
        `heroBg="#EEF2F4"`, `heroTextColor="#0F172A"`, `accentColor="#4B5563"`, `fontFamily="Noto Sans KR"`,
        `logoBgColor="#DB2777"`, `headerBg="#E2E8F0"`, `footerBg="#E2E8F0"`, `chatBg="#EEF2F4"`,
        `chatLayout="fullscreen"`, `updatedAt=null`.
        `fontFamily` is either a preset slug or any Google Fonts family name.
      operationId: getTheme
      responses:
        "200":
          description: Website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon/{salonId}/policies:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [LegalPolicies]
      summary: List published salon policies for a customer-facing page
      description: Returns only this salon's published, enabled policies selected for the requested placement. If no policies have been published, returns an empty array.
      operationId: getSalonPolicies
      parameters:
        - name: placement
          in: query
          required: false
          schema:
            type: string
            enum: [website, booking]
            default: website
          description: Public surface where the salon selected to show the policies.
      responses:
        "200":
          description: Published policies selected for this placement
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store; policy text is always fetched fresh.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonPolicy" }
        "400":
          description: Unknown placement value
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Chat ──────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/ai/polish:
    parameters:
      - name: salonId
        in: path
        required: true
        schema:
          type: string
        description: Salon UUID matching the owner's active salon claim; super-admins may access any salon.
    post:
      tags: [SalonAdmin]
      summary: Polish a biography or description with AI (admin)
      operationId: polishAdminText
      security:
        - BearerAuth: []
      description: |
        Requires an active OWNER claim for the salon UUID, or ROLE_SUPER_ADMIN.
        Authentication is bypassed in the backend's local/mock security mode.
        Returns polished, friendly and concise versions in one model call without reading or saving salon data.
        Uses the configured AI model without chat history or tools. The model is instructed
        to preserve language, meaning and facts while improving spelling, grammar and tone.
        Review the suggestion before applying it, then save through the normal resource endpoint.
        Does not require a Generative UI website or emit GenUiInteractionEvent analytics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextPolishRequest"
      responses:
        "200":
          description: Three plain-text suggestions; nothing has been persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextPolishResponse"
        "400":
          description: Missing, null, blank or over-5000-character text, or malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token (OAuth2 mode)
        "403":
          description: Caller lacks the required role or active ownership of this salon (OAuth2 mode)
        "502":
          description: AI returned malformed output or a missing, blank or over-5000-character version
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: AI request failed; editing is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/salon-staff/ai/polish:
    post:
      tags: [StaffPortal]
      summary: Polish a biography or description with AI (staff)
      operationId: polishStaffText
      security:
        - BearerAuth: []
      description: |
        Requires ROLE_STAFF or ROLE_OWNER. No staffId or salonId is needed.
        Authentication is bypassed in the backend's local/mock security mode.
        Returns polished, friendly and concise versions in one model call without reading or saving salon data.
        Uses the configured AI model without chat history or tools. The model is instructed
        to preserve language, meaning and facts while improving spelling, grammar and tone.
        Review the suggestion before applying it, then save through the normal resource endpoint.
        Does not require a Generative UI website or emit GenUiInteractionEvent analytics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextPolishRequest"
      responses:
        "200":
          description: Three plain-text suggestions; nothing has been persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextPolishResponse"
        "400":
          description: Missing, null, blank or over-5000-character text, or malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token (OAuth2 mode)
        "403":
          description: Caller lacks the required role (OAuth2 mode)
        "502":
          description: AI returned malformed output or a missing, blank or over-5000-character version
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: AI request failed; editing is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/salon-admin/{salonId}/ai/website-theme:
    parameters:
      - name: salonId
        in: path
        required: true
        schema:
          type: string
        description: Salon UUID matching the owner's active salon claim; super-admins may access any salon.
    post:
      tags: [SalonAdmin]
      summary: Suggest matching website palettes with AI (admin)
      operationId: suggestWebsiteTheme
      security:
        - BearerAuth: []
      description: |
        Requires an active OWNER claim for the salon UUID, or ROLE_SUPER_ADMIN.
        Authentication is bypassed in the backend's local/mock security mode.
        Powers **Match with AI** in the website design panel. One stateless model call returns up to
        three coordinated palettes — hero, branding, header/footer and chat colours plus a page font —
        chosen to match each other and the salon. Reads no salon records and persists nothing; apply a
        suggestion to the design panel, then save through `PUT /api/salon-admin/{salonId}/website`.
        The backend normalises colours to uppercase `#RRGGBB`, rejects fonts outside the preset slugs,
        defaults a missing `chatBg` to `heroBg`, and replaces `heroTextColor` with `#0F172A` or `#FFFFFF`
        when its contrast against `heroBg` is below 4.5:1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeSuggestRequest"
      responses:
        "200":
          description: One to three palette suggestions; nothing has been persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSuggestResponse"
        "400":
          description: Missing, blank or over-200-character salonName, or another field over its limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token (OAuth2 mode)
        "403":
          description: Caller is not the salon owner or a super-admin (OAuth2 mode)
        "502":
          description: AI returned malformed output, no suggestions, an invalid colour or an unknown font
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: AI request failed; design suggestions are temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/salon/{salonId}/chat:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    post:
      tags: [Chat]
      summary: Send a message to the salon's AI assistant (public)
      description: |
        Used by the Generative UI website mode. The assistant is scoped to this `salonId` only —
        it looks up live data via tool calls against this salon's own profile/staff/services/
        holidays endpoints and never accepts a salon id from the caller-supplied message. If the
        underlying model is unavailable or unconfigured, a friendly fallback `reply` is returned
        with an empty `toolsUsed` instead of an error.
      operationId: chatWithAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /api/salon/{salonId}/chat/stream:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    post:
      tags: [Chat]
      summary: Stream a reply from the salon's AI assistant (public, Server-Sent Events)
      description: |
        The same turn as `POST /api/salon/{salonId}/chat`, streamed as `text/event-stream` so the
        reply types in as the model writes it. Events, in order:

        | event | data | when |
        |---|---|---|
        | `session` | `{ "sessionId": "…" }` | first |
        | `delta` | `{ "text": "…" }` | each chunk of reply text, as generated |
        | `app` | `{ "tool": "salon_booking_week", "arguments": { … } }` | the moment the assistant opens a Salon MCP App — usually mid-sentence, so the page can start loading it |
        | `done` | `ChatResponse` (with `suggestedQuestions: []`) | the assembled reply — authoritative text, `mcpAppTool`/`mcpAppCall`, `toolsUsed` |
        | `suggestions` | `{ "questions": ["…"] }` | last; follow-up chips are generated after the reply so they never delay it |
        | `error` | `ChatResponse` with a friendly `message` | instead of `done`, if the model fails |

        Sent with `X-Accel-Buffering: no` so proxies pass chunks through. Clients that can't
        stream (or get a non-`text/event-stream` response) should fall back to `POST .../chat`.
      operationId: streamChatWithAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Server-Sent Events stream of the reply
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event:session
                  data:{"sessionId":"5f2b…"}

                  event:app
                  data:{"tool":"salon_booking_week","arguments":{"salonIdOrHandler":"3f1c…","serviceId":12}}

                  event:delta
                  data:{"text":"Here's the whole week "}

                  event:done
                  data:{"sessionId":"5f2b…","message":"Here's the whole week …","mcpAppTool":"salon_booking_week"}

                  event:suggestions
                  data:{"questions":["What about next week?"]}

  /api/salon/{salonId}/chat/followups:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    post:
      tags: [Chat]
      summary: Suggested next questions for the conversation (public)
      description: |
        The assistant suggests 2-4 short questions the visitor is likely to want to ask next,
        derived from the LATEST message in `history` (its most recent reply / the card it just
        showed); the earlier turns are context only. The Generative UI chat shows these as the
        chips above the composer — which are exclusively these dynamic suggestions — and
        refreshes them after every assistant turn (and after an instant card rendered from a
        sidebar option). Scoped to what the assistant can actually answer (services/pricing,
        staff, hours, location, contact, holidays — plus booking only if the salon has the
        `BOOKING` feature). Not cached. Returns an empty `followups` array when the model is
        unconfigured or errors — nothing is shown above the composer in that case.
      operationId: getChatFollowups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFollowupsRequest"
      responses:
        "200":
          description: Follow-up questions (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatFollowupsResponse"

  # ─── Analytics — Public Ingestion ───────────────────────────────────────────

  /api/analytics/events:
    post:
      tags: [Analytics]
      summary: Ingest a batch of website activity events (public, anonymous)
      description: |
        Called anonymously from the public salon website's client-side JS — no authentication
        required; `/api/analytics/**` is in the security config's `permitAll` matchers.

        Accepts a batch of up to 200 events per request; a larger batch returns `400`.
        Each event is looked up by `salonId` and silently dropped (not an error) if the salon
        doesn't exist, or exists but hasn't enabled the `ANALYTICS` feature flag — this check
        is the only real access control on this endpoint, and it's deliberate, not a bug. A
        `202` response therefore does not guarantee any individual event was stored: accepted
        events are pushed to an Azure Storage Queue and persisted asynchronously, with no
        synchronous confirmation.
      operationId: ingestAnalyticsEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/ActivityEvent"
            example:
              - salonId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                sessionId: "a1b2c3"
                eventType: "PAGE_VIEW"
                path: "/"
                occurredAt: "2026-08-31T10:15:30Z"
              - salonId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                sessionId: "a1b2c3"
                eventType: "CLICK"
                path: "/"
                label: "hero-book-appointment"
                occurredAt: "2026-08-31T10:15:42Z"
      responses:
        "202":
          description: |
            Batch accepted for processing. This holds even if some or all events in the batch
            were silently dropped (unknown salon, or ANALYTICS not enabled) — no per-event
            status is returned.
        "400":
          description: Batch contains more than 200 events

  # ─── Admin — Login / Session ─────────────────────────────────────────────────

  /api/salon-admin/my-salons:
    get:
      tags: [SalonAdmin]
      summary: Look up the caller's own salons (admin login)
      description: |
        Returns all salons owned by the authenticated caller.
        Used by the admin login flow to resolve the salonId before entering the admin UI.
        - **1 result** → proceed directly to the salon-admin UI.
        - **2+ results** → show a salon-picker screen and let the owner choose.
        - **0 results** → show "no salon found" error.

        The owner's identity is taken from the `sub` claim of the bearer token —
        never from client input, since that would let a caller ask for someone
        else's salons. The `email` query parameter is only a fallback for
        unauthenticated local/mock-mode use and is ignored whenever a bearer
        token is present.
      operationId: getMySalons
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          example: owner@example.com
          description: |
            Fallback owner email, used only when no bearer token is present
            (local/mock-mode login). Ignored when the caller is authenticated.
      responses:
        "200":
          description: One or more salons found for this email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"
        "401":
          description: No bearer token and no email fallback provided
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/my-desk-salons:
    get:
      tags: [SalonAdmin]
      summary: Salons the caller may open the salon desk for (desk login)
      description: |
        Salons the caller owns or works at as **active** staff (any staff role — stylist,
        receptionist, manager), read live from the database. The desk app picks one with the
        DASHBOARD feature, or explains that the desk isn't turned on. Unlike `my-salons`, staff
        salons are included; `my-salons` stays owner-only for the admin app.

        **Desk access for staff.** A staff member's token is accepted on `/api/salon-admin/{salonId}/**`
        only for the desk's own endpoints (salon read, desk settings, Till / POS sales and card checkout,
        payment status, bookings list/create/edit/confirm/cancel/complete/no-show, closures, holidays,
        services, staff and their availability, membership plans, check-in `verify`, member detail and QR,
        renewal link, `desk-sales`), only when their token names that salon, the database confirms they
        are still active staff there, and the salon has DASHBOARD. Everything else stays owner-only (`403`).

        Identity comes from the token's `sub`; `email` is only a fallback for local/mock-mode use and is
        ignored whenever a bearer token is present.
      operationId: getMyDeskSalons
      security:
        - BearerAuth: []
        - {}
      parameters:
        - { name: email, in: query, required: false, schema: { type: string, format: email }, description: Mock-mode fallback only }
      responses:
        "200":
          description: Salons the caller owns or is active staff at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"
        "401":
          description: No bearer token and no email fallback provided
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Salon Management ────────────────────────────────────────────────

  /api/salon-admin/{salonId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [SalonAdmin]
      summary: Get salon details (admin)
      description: Accepts either a UUID or a handler slug — same lookup logic as the public endpoint.
      operationId: adminGetSalon
      responses:
        "200":
          description: Salon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [SalonAdmin]
      summary: Update salon details (admin)
      description: |
        Admin-only. Updates name, location (including the optional `mapsUrl` "Open in Maps" link), contact info, and operating hours. `location` is replaced as a whole. Handler, features, and owner are never changed here — use PUT /api/salon-super-admin/salons/{id}/owner to change the owner.
        Emits **SalonUpdatedEvent** → owner receives a notification email.
      operationId: updateSalon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalonRequest"
      responses:
        "200":
          description: Updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "400":
          description: Missing name, or location.mapsUrl is not an http(s) URL of at most 2000 characters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [SalonAdmin]
      summary: Delete a salon (admin)
      description: Admin-only. Permanently removes the salon and all associated data (services, staff, bookings) via cascade delete.
      operationId: deleteSalon
      responses:
        "204":
          description: Salon deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/features:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    put:
      tags: [SalonAdmin]
      summary: Replace salon feature flags (admin)
      description: |
        Admin-only. Replaces the full set of enabled features for the salon (BOOKING, ANALYTICS, etc.).
        Emits **SalonUpdatedEvent** → owner receives a notification email.
      operationId: updateSalonFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalonFeature"
              example: ["BOOKING", "ANALYTICS"]
      responses:
        "200":
          description: Features updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking-settings:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    patch:
      tags: [SalonAdmin]
      summary: Update booking settings (admin)
      description: |
        Admin-only. Partially updates only the booking-related salon settings —
        `bookingAdvanceDays` and `bookingRequiresConfirmation`. All other salon fields
        are preserved. Either field may be omitted; omitted fields keep their current value.
        Emits **SalonUpdatedEvent** → owner receives a notification email.
      operationId: patchBookingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBookingSettingsRequest"
      responses:
        "200":
          description: Settings updated; full salon object returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/contact:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    patch:
      tags: [SalonAdmin]
      summary: Update the salon contact block (admin)
      description: |
        Admin-only. Replaces **only** the salon's `contact` block — phone/email/website plus
        the social links and their per-platform `*Visible` flags. Every other salon field
        (name, location, hours, features) is preserved. The body is a full `ContactInfo` and
        replaces the stored one, so send the fields to keep (omitted fields become null).
        Used by the admin Website tab's Social links editor. Emits **SalonUpdatedEvent**.
      operationId: patchSalonContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInfo"
      responses:
        "200":
          description: Contact updated; full salon object returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Analytics ────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/analytics/summary:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminAnalytics]
      summary: Get website analytics summary (admin)
      description: |
        Admin-only — same ownership rule as every other `/api/salon-admin/{salonId}/**`
        endpoint: the caller must be the salon's owner per the `salons` claim in their JWT,
        or hold `ROLE_SUPER_ADMIN`. Enforced by the global security config, not this endpoint.

        Also returns `403` if the salon has not enabled the `ANALYTICS` feature flag, on top
        of the normal 403 a non-owning caller gets from the security config.

        `totalViews`/`totalClicks` are totals across the full requested window; `topPages`
        and `topClicks` are each capped at the top 10 entries by count, descending.
      operationId: getAnalyticsSummary
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
          example: 7
          description: Look-back window in days. Clamped server-side to the range 1–90.
      responses:
        "200":
          description: Analytics summary for the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "403":
          description: The `ANALYTICS` feature is not enabled for this salon, or the caller does not own the salon

  /api/salon-admin/{salonId}/analytics/genui-summary:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminAnalytics]
      summary: Get Generative-UI chat usage summary (admin)
      description: |
        Admin-only — same ownership rule and `ANALYTICS` feature-flag gate as
        `GET /api/salon-admin/{salonId}/analytics/summary`. Rolls up usage of the Generative-UI
        chat widget on the public website/booking page: messages sent, interactive components
        shown, data-lookup tools invoked, and bookings proposed through chat. Recorded
        server-side whenever `POST /api/salon/{salonId}/chat` runs — see `chatWithAssistant`.

        `topComponents` and `topTools` are each capped at the top 10 entries by count,
        descending. `quick-actions` in `topComponents` is a useful proxy for how often
        visitors asked something off-topic with nothing else already in progress.
      operationId: getGenUiSummary
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
          example: 7
          description: Look-back window in days. Clamped server-side to the range 1–90.
      responses:
        "200":
          description: Generative-UI chat usage summary for the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenUiSummary"
        "403":
          description: The `ANALYTICS` feature is not enabled for this salon, or the caller does not own the salon

  # ─── Admin — Holidays ────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/holidays:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminHolidays]
      summary: List salon holidays (admin)
      operationId: listHolidays
      responses:
        "200":
          description: List of holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonHoliday"

    post:
      tags: [AdminHolidays]
      summary: Add a holiday (admin)
      description: |
        Admin-only. Creates a holiday record and automatically generates salon-closure rows
        for the current year through currentYear+4 (for recurring holidays) or for the
        specified year only (for one-off holidays). Invalid dates (e.g. Feb 29 on a non-leap
        year) are skipped silently.
      operationId: addHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHolidayRequest"
      responses:
        "200":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonHoliday"

  /api/salon-admin/{salonId}/holidays/{holidayId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - name: holidayId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Holiday ID

    delete:
      tags: [AdminHolidays]
      summary: Remove a holiday (admin)
      description: |
        Admin-only. Deletes the holiday record. All associated salon-closure rows are
        removed automatically via ON DELETE CASCADE.
      operationId: removeHoliday
      responses:
        "204":
          description: Holiday removed

  # ─── Admin — Website ──────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/website:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminWebsite]
      summary: Get website theme (admin)
      operationId: adminGetTheme
      responses:
        "200":
          description: Website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminWebsite]
      summary: Save website theme (admin)
      description: Admin-only. Upserts the website theme for the salon. Creates a new row if none exists; otherwise updates in place.
      operationId: saveTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveThemeRequest"
      responses:
        "200":
          description: Theme saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"

  /api/salon-admin/{salonId}/policies:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [LegalPolicies]
      summary: Get policy drafts and available default templates
      description: Owner-only. Returns this salon's editable drafts merged with the built-in policy templates for any policies not saved yet.
      operationId: getSalonPolicyDrafts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Draft policies and unsaved templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonPolicy" }
        "401": { description: Authentication required }
        "403": { description: Requires salon owner or super-admin access }
    put:
      tags: [LegalPolicies]
      summary: Save salon policy drafts
      description: Upserts the submitted salon-specific draft documents by policy key. Draft changes do not appear on public pages until published. Disable a policy and publish to remove it from public pages.
      operationId: saveSalonPolicyDrafts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: "#/components/schemas/SalonPolicy" }
      responses:
        "200":
          description: Saved draft policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonPolicy" }
        "400": { description: Invalid policy document or duplicate policy key }
        "401": { description: Authentication required }
        "403": { description: Requires salon owner or super-admin access }

  /api/salon-admin/{salonId}/policies/publish:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [LegalPolicies]
      summary: Publish this salon's saved policy drafts
      description: Copies the salon's complete draft set to its published set. Public website and booking requests then return enabled policies selected for their placement.
      operationId: publishSalonPolicies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Published policy set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonPolicy" }
        "401": { description: Authentication required }
        "403": { description: Requires salon owner or super-admin access }

  /api/salon-admin/{salonId}/website-type:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminWebsite]
      summary: Get website type (admin)
      description: |
        Admin-only. Returns the current website presentation type for the salon.
        Defaults to `STATIC_WEBSITE` if the theme row does not yet exist.
        This endpoint is called when the admin navigates to the website tab.
      operationId: getWebsiteType
      responses:
        "200":
          description: Current website type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTypeResponse"

    patch:
      tags: [AdminWebsite]
      summary: Update website type (admin)
      description: |
        Admin-only. Updates the website presentation type. One of `STATIC_WEBSITE`,
        `GENERATIVE_UI`, `CUSTOMISE_WEBSITE_CONTACT_US`. The rest of the theme is preserved.
        Creates the theme row if it does not yet exist.
      operationId: updateWebsiteType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteTypeRequest"
      responses:
        "200":
          description: Updated website theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteTheme"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Services ─────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/services:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminServices]
      summary: List services (admin)
      operationId: adminListServices
      responses:
        "200":
          description: List of service items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceItem"

    post:
      tags: [AdminServices]
      summary: Add a service to the catalog (admin)
      operationId: addService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"

  /api/salon-admin/{salonId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/ServiceId"

    get:
      tags: [AdminServices]
      summary: Get a service by ID (admin)
      operationId: adminGetService
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminServices]
      summary: Update a service (admin)
      description: Admin-only. Updates pricing, duration, category, assigned staff, and active status.
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminServices]
      summary: Delete a service (admin)
      operationId: deleteService
      responses:
        "204":
          description: Service deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff ────────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/staff:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminStaff]
      summary: List staff members (admin)
      operationId: adminListStaff
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

    post:
      tags: [AdminStaff]
      summary: Onboard a new staff member (admin)
      operationId: onboardStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardStaffRequest"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /api/salon-admin/{salonId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminStaff]
      summary: Get a staff member by ID (admin)
      operationId: adminGetStaffMember
      responses:
        "200":
          description: Staff member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminStaff]
      summary: Update a staff member (admin)
      description: Admin-only. Updates name, contact, role, status, specializations, photos, bio, and booking availability.
      operationId: updateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminStaff]
      summary: Remove a staff member (admin)
      description: Admin-only. Removes a staff member from the roster. Existing bookings for this member are cascade-deleted. Owner-staff entries (`isOwner = true`) cannot be deleted.
      operationId: deleteStaffMember
      responses:
        "204":
          description: Staff member removed
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff Availability ───────────────────────────────────────────────

  /api/salon-admin/{salonId}/staff/{staffId}/availability:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: Get staff weekly availability schedule (admin)
      operationId: getStaffAvailability
      responses:
        "200":
          description: Weekly availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

    put:
      tags: [AdminAvailability]
      summary: Replace staff weekly availability schedule (admin)
      description: |
        Admin-only. Replaces the entire weekly schedule for a staff member. Previous entries
        are deleted before the new set is saved.
        Emits **StaffScheduleUpdatedEvent** → notification module logs the change.
      operationId: setStaffAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DayScheduleRequest"
      responses:
        "200":
          description: Updated availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

  /api/salon-admin/{salonId}/staff/{staffId}/availability/overrides:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: List date-specific availability overrides (admin)
      operationId: getAvailabilityOverrides
      responses:
        "200":
          description: List of overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityOverride"

    post:
      tags: [AdminAvailability]
      summary: Add a date-specific availability override (admin)
      description: |
        Admin-only. Pins availability for a staff member on a specific date, overriding the
        regular weekly schedule. Set `available: false` with no times to mark a day as
        unavailable (e.g. holiday or sick leave).
        Emits **StaffAvailabilityOverrideAddedEvent** → notification module logs the change.
      operationId: addAvailabilityOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOverrideRequest"
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityOverride"

  /api/salon-admin/{salonId}/staff/{staffId}/availability/overrides/{overrideId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"
      - name: overrideId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    delete:
      tags: [AdminAvailability]
      summary: Remove a date-specific availability override (admin)
      description: |
        Admin-only. Deletes the override so the regular weekly schedule applies again for
        that date. Scoped to the given salonId/staffId pair.
        Emits **StaffAvailabilityOverrideRemovedEvent** → notification module logs the change.
      operationId: removeAvailabilityOverride
      responses:
        "204":
          description: Override removed

  # ─── Admin — Booking ──────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/booking:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminBooking]
      summary: List all bookings for a salon (admin)
      description: Admin-only. Returns all bookings across all statuses.
      operationId: listBookings
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /api/salon-admin/{salonId}/booking/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    get:
      tags: [AdminBooking]
      summary: Get a booking by ID (admin)
      operationId: adminGetBooking
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminBooking]
      summary: Reschedule a booking (admin)
      description: |
        Admin-only. Moves a booking to a different date, time, or staff member. End time is
        recalculated automatically from the service duration.
        Emits **BookingRescheduledEvent** → customer receives a reschedule notification.
      operationId: rescheduleBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Booking rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminBooking]
      summary: Delete a booking (admin)
      description: Admin-only. Permanently removes a booking record.
      operationId: deleteBooking
      responses:
        "204":
          description: Booking deleted

  /api/salon-admin/{salonId}/booking/{bookingId}/confirm:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Confirm a booking (admin)
      description: |
        Admin-only. Moves the booking from PENDING to CONFIRMED.
        Emits **BookingStatusChangedEvent** → customer receives a confirmation notification.
      operationId: confirmBooking
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Cancel a booking (admin)
      description: |
        Admin-only. Moves the booking to CANCELLED status.
        Emits **BookingStatusChangedEvent** → customer receives a cancellation notification.
      operationId: cancelBooking
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/complete:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as completed (admin)
      description: |
        Admin-only. Marks the appointment as COMPLETED after the customer's visit.
        Emits **BookingStatusChangedEvent** → customer receives a completion notification.
      operationId: completeBooking
      responses:
        "200":
          description: Booking completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/no-show:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as no-show (admin)
      description: |
        Admin-only. Records that the customer did not attend their appointment.
        Emits **BookingStatusChangedEvent** → customer receives a no-show notification.
      operationId: noShowBooking
      responses:
        "200":
          description: Booking marked as no-show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Holidays (read-only) ─────────────────────────────────────────

  /api/salon/{salonId}/holidays:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Booking]
      summary: List salon holidays (customer)
      description: >
        Returns all holidays defined for this salon. The public website uses this
        to label days as holidays in the opening-hours display.
      operationId: listHolidaysPublic
      responses:
        "200":
          description: List of holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonHoliday"

  # ─── Customer — Closures (read-only) ─────────────────────────────────────────

  /api/salon/{salonId}/closures:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Booking]
      summary: List salon closures (customer)
      description: >
        Returns all closures defined for this salon. The booking wizard uses this
        to disable closed date ranges in all three calendar views.
      operationId: listClosuresPublic
      responses:
        "200":
          description: List of closures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonClosure"

  # ─── Admin — Closures ────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/closures:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminClosures]
      summary: List salon closures (admin)
      description: Returns all closures defined for this salon, sorted by start date.
      operationId: listClosures
      responses:
        "200":
          description: List of closures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonClosure"

    post:
      tags: [AdminClosures]
      summary: Add a salon closure (admin)
      description: |
        Admin-only. Marks the salon as closed for a date range. A single day can be closed
        by setting `startDate` and `endDate` to the same value. Once saved, slot discovery
        will return an empty list for any date within the closure, and booking creation will
        return HTTP 400 for those dates.
      operationId: addClosure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClosureRequest"
      responses:
        "200":
          description: Closure created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonClosure"

  /api/salon-admin/{salonId}/closures/{closureId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - name: closureId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Closure ID

    delete:
      tags: [AdminClosures]
      summary: Remove a salon closure (admin)
      description: Admin-only. Removes the closure so bookings can be taken for those dates again.
      operationId: removeClosure
      responses:
        "204":
          description: Closure removed

  # ─── Super Admin ──────────────────────────────────────────────────────────────

  /api/salon-super-admin/salons:
    get:
      tags: [SuperAdmin]
      summary: List / search salons (super-admin)
      description: |
        Returns registered salons across all tenants. Supports optional server-side full-text
        search (`q`) and status filtering (`status`). When `q` is provided the search is performed
        in the database across: salon name, handler, owner name, owner email, owner phone,
        contact phone, contact email, city, and country (case-insensitive LIKE). Combining
        `q` and `status` is supported. Omitting both parameters returns all salons.
      operationId: superAdminListSalons
      parameters:
        - name: q
          in: query
          required: false
          description: Full-text search term (case-insensitive). Searched across name, handler, owner name/email/phone, contact phone/email, city, country.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by salon status.
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
      responses:
        "200":
          description: List of matching salons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"

  /api/salon-super-admin/salons/{id}:
    get:
      tags: [SuperAdmin]
      summary: Get a salon by ID (super-admin)
      operationId: superAdminGetSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

    delete:
      tags: [SuperAdmin]
      summary: Disable a salon (super-admin)
      description: Soft-deletes the salon (sets status to DISABLED). Data is preserved and the salon can be re-enabled.
      operationId: superAdminDisableSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon disabled; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/features:
    put:
      tags: [SuperAdmin]
      summary: Update salon features (super-admin)
      description: Replaces the full set of enabled features for a salon.
      operationId: superAdminUpdateFeatures
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalonFeature"
      responses:
        "200":
          description: Features updated; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/owner:
    put:
      tags: [SuperAdmin]
      summary: Update salon owner (super-admin)
      description: >
        Replaces the owner record (name, email, phone) for a salon.
        Only accessible by a super-admin. The regular salon-admin update endpoint
        (PUT /api/salon-admin/{id}) does not touch owner data.
      operationId: superAdminUpdateOwner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerRequest"
      responses:
        "200":
          description: Owner updated; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "400":
          description: Validation error (name or email blank)
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/enable:
    put:
      tags: [SuperAdmin]
      summary: Enable a disabled salon (super-admin)
      description: |
        Re-activates a previously disabled salon (sets status to ACTIVE).
        Emits **SalonUpdatedEvent** → owner receives a notification email.
      operationId: superAdminEnableSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon enabled; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  # ─── Utility ──────────────────────────────────────────────────────────────────

  /api/salon-utility/countries:
    get:
      tags: [Utility]
      summary: List all supported countries
      operationId: listCountries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"


  # ─── Staff Portal ────────────────────────────────────────────────────────────

  /api/salon-staff/me:
    get:
      summary: Look up the caller's own staff record(s)
      description: |
        Returns all staff records for the authenticated caller, enriched with the salon's
        `name` and `handler` so the login picker can distinguish between accounts at
        different salons. Used during login to identify the staff member before OTP verification.

        The caller's identity is taken from the `sub` claim of the bearer token —
        never from client input, since that would let a caller ask for someone
        else's staff record. The `email` query parameter is only a fallback for
        unauthenticated local/mock-mode use and is ignored whenever a bearer
        token is present.
      tags: [StaffPortal]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            format: email
          description: |
            Fallback email, used only when no bearer token is present
            (local/mock-mode login). Ignored when the caller is authenticated.
      responses:
        "200":
          description: Staff records found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMemberSummary"
        "401":
          description: No bearer token and no email fallback provided
        "404":
          description: No staff account found for this email

  /api/salon-staff/{staffId}:
    get:
      summary: Get own staff profile
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Staff member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Not found

  /api/salon-staff/{staffId}/profile:
    patch:
      summary: Update own profile
      description: >
        Self-service update of the caller's own staff record. Any omitted field is
        left unchanged. Email, role, and status remain admin-managed.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                specializations:
                  type: array
                  items:
                    type: string
                availableForBooking:
                  type: boolean
                avatarUrl:
                  type: string
                  format: uri
                  description: Profile photo (avatar) URL.
                bio:
                  type: string
                  description: Free-text "About me" blurb shown on the public website.
                workMedia:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Image or video URLs of the staff member's work, shown on the public website.
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Not found

  /api/salon-staff/{staffId}/appointments:
    get:
      summary: List own appointments
      description: Returns all bookings assigned to this staff member across all dates.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Bookings assigned to this staff member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "404":
          description: Staff member not found

  /api/salon-staff/{staffId}/holidays:
    get:
      summary: List personal holidays (days off)
      description: Returns all availability overrides where `available=false` — these block the booking calendar.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Personal holiday overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityOverride"
        "404":
          description: Staff member not found
    post:
      summary: Book a personal holiday
      description: Creates a date-specific unavailability override (`available=false`). Customers cannot book this staff member on that date.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrideDate]
              properties:
                overrideDate:
                  type: string
                  format: date
                  example: "2026-12-25"
                reason:
                  type: string
                  example: "Christmas"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityOverride"
        "404":
          description: Staff member not found

  /api/salon-staff/{staffId}/photo-upload-url:
    post:
      summary: Get a pre-signed URL to upload a photo or video
      description: |
        Returns a pre-signed PUT URL the browser can use to upload a file directly to
        object storage — S3, Azure Blob Storage, or the local dev endpoint — per the
        server's `STORAGE_TYPE`. PUT the file with the matching `Content-Type` header,
        plus `x-ms-blob-type: BlockBlob` when the URL is an Azure Blob endpoint. The
        `publicUrl` is the CDN URL to save on the staff profile after the upload
        completes — as `avatarUrl` (profile photo) or appended to `workMedia` (work gallery),
        at the caller's choice. `contentType` accepts `image/*` and `video/*` (mp4,
        webm, quicktime). Returns `503` when media storage is not configured.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  example: "image/jpeg"
      responses:
        "200":
          description: Pre-signed upload URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "404":
          description: Staff member not found
        "503":
          description: Media storage not configured

  /api/salon-staff/{staffId}/holidays/{holidayId}:
    delete:
      summary: Remove a personal holiday
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
        - in: path
          name: holidayId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Holiday removed
        "404":
          description: Staff member not found

