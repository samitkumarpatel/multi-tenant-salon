    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [Shop]
      summary: List active shop products
      operationId: listShopProducts
      parameters:
        - name: brandId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by brand ID (server-side)
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by category ID (server-side)
      responses:
        "200":
          description: Active products with their active variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"

  /api/salon/{salonId}/shop/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Shop]
      summary: Get an active shop product
      operationId: getShopProduct
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon/{salonId}/shop/checkout-options:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [Shop]
      summary: What happens at checkout
      description: |
        Whether placing an order hands the customer to Stripe Checkout (`onlinePayment: true` — shop
        payments enabled on a connected account that can take charges). When `false`, `POST /orders`
        completes immediately with the legacy dummy payment and no card is charged.
      operationId: getShopCheckoutOptions
      responses:
        "200":
          description: Checkout options
          content:
            application/json:
              schema:
                type: object
                required: [onlinePayment]
                properties:
                  onlinePayment:
                    type: boolean
                    description: true when checkout redirects to Stripe Checkout

  /api/salon/{salonId}/shop/orders:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [Shop]
      summary: Place an order (checkout)
      description: |
        Validates each variant, atomically decrements stock, snapshots price/name onto the
        order lines, then completes a dummy payment — the returned order is `PAID`. Returns
        409 if any item is out of stock, 400 for an empty cart, missing name/email or a malformed
        email. Omit `shippingAddress` (or send it empty) for collect-in-salon orders.

        **Stripe shop payments:** when the salon has shop payments enabled, the order is created with
        `paymentStatus: PENDING` and the 201 body is `{ order, checkoutUrl, checkout }` — redirect to
        `checkoutUrl`, or mount Stripe's form from `checkout` (see `PaymentCheckout`). The Connect webhook marks it `PAID` (emits OrderPlacedEvent) or `FAILED`
        (stock is restored). Returns 502 if Stripe rejects the Checkout Session.
      operationId: placeShopOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopCheckoutRequest"
      responses:
        "201":
          description: Order placed (`ShopOrder`), or pending payment (`ShopCheckoutResponse`) when Stripe is enabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShopOrder"
                  - $ref: "#/components/schemas/ShopCheckoutResponse"
        "400":
          description: Empty cart, missing customer name / email, or a malformed email address
        "409":
          description: An item is out of stock or no longer available

