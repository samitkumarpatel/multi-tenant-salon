          example: ["MONDAY", "SATURDAY"]
        closedDates:
          type: array
          description: >
            One-off dates with an unavailable StaffAvailabilityOverride. Dates where this staff
            member is exceptionally *available* (an override with available: true) are not
            included here.
          items:
            type: string
            format: date
          example: ["2026-09-14"]

    SalonAvailability:
      type: object
      description: Result of GET /api/salon/{salonId}/availability.
      properties:
