# ─── Components ───────────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/website/domains:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      summary: Get custom website domain settings and DNS instructions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current settings; domain is null when no connection exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteDomainSettings'
        '401':
          description: Authentication required
        '403':
          description: Requires active salon owner or super-admin
    post:
      summary: Connect one customer-managed CNAME hostname
      description: Requires the website feature and configured provider. Customers retain their DNS provider. Unverified claims expire after seven days. Returns 400 for a bare/root domain (the hostname is itself a DNS zone apex, detected by an SOA answer for the exact name), since a CNAME cannot be placed there — connect `www.` instead.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname:
                  type: string
                  maxLength: 253
                  example: www.mysalon.dk
      responses:
        '200':
          description: Pending connection with TXT and CNAME instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteDomainSettings'
        '400':
          description: Invalid hostname
        '401':
          description: Authentication required
        '403':
          description: Requires active salon owner or super-admin
        '409':
          description: Existing hostname or salon connection, or website feature disabled
        '503':
          description: Domain provider is not configured
    delete:
      summary: Disconnect the domain and queue provider cleanup
      description: Removes serving and custom-origin access immediately. The claim remains reserved until provider cleanup succeeds.
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Cleanup queued, or no connection exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteDomainSettings'
        '401':
          description: Authentication required
        '403':
          description: Requires active salon owner or super-admin

  /api/salon-admin/{salonId}/website/domains/check:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      summary: Check ownership, routing and HTTPS readiness
      description: Checks have a 30-second cooldown. Concurrent checks return the current state. Provisioning also retries automatically.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current settings, including actionable provisioning status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteDomainSettings'
        '401':
          description: Authentication required
        '403':
          description: Requires active salon owner or super-admin
        '503':
          description: Domain provider is not configured

  /api/salon/domain/resolve:
    get:
      summary: Resolve an active custom hostname to a salon
      description: Public, no-store. Only active domains of active salons with the website feature resolve. Never returns ownership tokens.
      parameters:
        - name: hostname
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified active mapping
          content:
            application/json:
              schema:
                type: object
                required: [salonId, hostname]
                properties:
                  salonId:
                    type: string
                    format: uuid
                  hostname:
                    type: string
        '404':
          description: Unknown, disabled, disconnected or unverified hostname

  /api/salon/{salonId}/website/domain:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      summary: Get the preferred active custom hostname
      description: Public, no-store. Returns null when no active custom domain is available.
      responses:
        '200':
          description: Preferred hostname
          content:
            application/json:
              schema:
                type: object
                required: [hostname]
                properties:
                  hostname:
                    type: [string, 'null']

  # ─── Payments — Stripe Connect ───────────────────────────────────────────────

  /api/salon-admin/{salonId}/payments/stripe:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminPayments]
      summary: Get Stripe Connect status and payment settings
      description: |
        Refreshes the connected account's `details_submitted` / `charges_enabled` from Stripe when configured,
        and reports the onboarding stage with Stripe's outstanding requirements.
      operationId: getStripeConnectStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConnectStatus"
        "502":
          description: Stripe could not be reached

  /api/salon-admin/{salonId}/payments/stripe/onboarding-link:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [AdminPayments]
      summary: Create a Stripe Connect onboarding link
      description: |
        Creates the salon's connected account on first use with Accounts v2 (`POST /v2/core/accounts`:
        merchant `card_payments`, `dashboard: full`, `fees_collector`/`losses_collector: stripe`;
        country from the salon location), then returns a single-use v2 Account Link
        (`account_onboarding`, configuration `merchant`). Stripe returns the owner to
        `<PAYMENTS_ADMIN_APP_URL>/{salonId}/payments?stripe=return|refresh`.
      operationId: createStripeOnboardingLink
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Onboarding link
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "409":
          description: Salon has no valid country
        "502":
          description: Stripe rejected the request; the reason carries Stripe's error message
        "503":
          description: Stripe secret key / webhook secret not configured on the server

  /api/salon-admin/{salonId}/payments/settings:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    put:
      tags: [AdminPayments]
      summary: Payment areas and how customers pay in each
      description: |
        Turns card payments on/off per area and picks each area's checkout style (`checkoutUi`). Areas left out
        of `areas` keep their setting. Areas can be selected as soon as the connected account exists. A selected area only takes effect
        for customers once Stripe has activated card payments on the account; until then shop, booking
        and till behave as if the area were off.
      operationId: updatePaymentSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentSettingsRequest"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonPaymentSettings"
        "400":
          description: Missing booking payment type or deposit outside 1–100
        "409":
          description: Related salon feature (WEBSHOP / BOOKING / DASHBOARD / MEMBERSHIP) disabled, no Stripe account connected yet, or an in-page checkout style without STRIPE_PUBLISHABLE_KEY

  /api/salon-admin/{salonId}/dashboard/sales/card-checkout:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [AdminPayments]
      summary: Take a Till / POS card payment through Stripe Checkout
      description: |
        Records the sale with `paymentStatus: PENDING` and starts a Checkout that returns to the dashboard
        cashier view — a redirect `checkoutUrl`, or (with `inlineCheckout: true` and an in-page style for POS)
        Stripe's form from `checkout`. The webhook marks it `PAID`, or `FAILED` (product stock restored).
        For a card reader use `/dashboard/sales/terminal-checkout`.
      operationId: createPosCardCheckout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerName: { type: string, nullable: true }
                items:
                  type: array
                  items: { type: object }
                inlineCheckout: { type: boolean, nullable: true }
      responses:
        "200":
          description: Pending sale and its checkout
          content:
            application/json:
              schema:
                type: object
                required: [sale]
                properties:
                  sale: { type: object }
                  checkoutUrl: { type: string, format: uri, nullable: true }
                  checkout: { $ref: "#/components/schemas/PaymentCheckout" }
        "409":
          description: POS payments not enabled or Stripe not ready

  /api/salon-admin/{salonId}/dashboard/sales/terminal-checkout:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [AdminPayments]
      summary: Take a Till / POS card payment on a card reader
      description: |
        Records the sale with `paymentStatus: PENDING` (committed first, stock held) and sends a card-present
        PaymentIntent to the chosen Stripe Terminal reader (server-driven). Follow the payment with
        `GET /payments/terminal-payments/{paymentId}`; the sale becomes `PAID`, or `FAILED` with stock restored
        when the payment is canceled. A declined card leaves the payment open for another card. Staff may call it.
      operationId: createPosTerminalCheckout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminalId, items]
              properties:
                customerName: { type: string, nullable: true }
                terminalId: { type: integer, format: int64 }
                items:
                  type: array
                  items: { type: object }
      responses:
        "200":
          description: Pending sale and the payment on the reader
          content:
            application/json:
              schema:
                type: object
                properties:
                  sale: { type: object }
                  terminalPayment: { $ref: "#/components/schemas/TerminalPayment" }
        "404":
          description: Card reader not found
        "409":
          description: POS payments not enabled or Stripe not ready

  /api/salon-admin/{salonId}/payments/stripe/account-session:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [AdminPayments]
      summary: Create a session for Stripe's embedded account components
      description: |
        Owner only. Creates an Account Session (creating the connected account first if the salon has none)
        enabling `account_onboarding`, `account_management`, `notification_banner`, `payments` (refunds,
        disputes, capture) and `payouts` (instant/standard payouts, payout schedule). The admin app renders
        them with Connect.js, so onboarding, payouts, payments and disputes are handled without leaving the app.
      operationId: createStripeAccountSession
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string }
                  publishableKey: { type: string }
                  stripeAccountId: { type: string }
        "409":
          description: Salon has no valid country (needed to create the account)
        "503":
          description: Stripe keys or the publishable key are not configured

  /api/salon-admin/{salonId}/payments/transactions:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminPayments]
      summary: List card payments (payment ledger)
      description: Every checkout and card-reader payment of the salon, newest first. Owner only.
      operationId: listPaymentTransactions
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: area, schema: { type: string, enum: [SHOP, BOOKING, POS, MEMBERSHIP] } }
        - { in: query, name: limit, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentTransaction" }

  /api/salon-admin/{salonId}/payments/transactions/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: paymentId, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [AdminPayments]
      summary: One payment with its refunds
      operationId: getPaymentTransaction
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Payment and refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/PaymentTransaction" }
                  refunds:
                    type: array
                    items: { type: object }
        "404":
          description: Payment not found

  /api/salon-admin/{salonId}/payments/transactions/{paymentId}/refunds:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: paymentId, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [AdminPayments]
      summary: Refund a card payment
      description: |
        Refunds all or part of a completed card payment to the customer's card (Stripe refund on the salon's
        account). `amount` omitted = everything not yet refunded. Never more than what is left; a refund that
        Stripe later reports as failed is given back to the refundable balance. Owner only.
      operationId: refundPaymentTransaction
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRefund" }
        "409":
          description: Not a completed card payment, already fully refunded, or amount above what is left
        "502":
          description: Stripe rejected the refund

  /api/salon-admin/{salonId}/payments/terminals:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminPayments]
      summary: List the salon's card readers
      description: Staff may call it (the desk picks a reader). `refresh=true` re-reads online status from Stripe.
      operationId: listPaymentTerminals
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: refresh, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Card readers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentTerminal" }
    post:
      tags: [AdminPayments]
      summary: Register a card reader
      description: |
        Owner only. Registers a Stripe Terminal reader by the pairing code it shows (`simulated-wpe` gives a
        simulated reader in test mode). The first reader creates the salon's Terminal Location from its address.
      operationId: registerPaymentTerminal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationCode]
              properties:
                registrationCode: { type: string }
                label: { type: string, nullable: true }
      responses:
        "201":
          description: Reader registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentTerminal" }
        "409":
          description: No Stripe account, Dashboard feature off, or the salon address is incomplete
        "502":
          description: Stripe rejected the code

  /api/salon-admin/{salonId}/payments/terminals/{terminalId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: terminalId, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [AdminPayments]
      summary: Rename a card reader
      operationId: renamePaymentTerminal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentTerminal" }
    delete:
      tags: [AdminPayments]
      summary: Remove a card reader
      operationId: removePaymentTerminal
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Removed (also at Stripe)

  /api/salon-admin/{salonId}/payments/terminal-payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: paymentId, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [AdminPayments]
      summary: Follow a card-reader payment
      description: |
        Staff may call it. The outcome normally arrives by webhook; when the stored state is older than a few
        seconds (or `refresh=true`), Stripe is asked directly, so a late webhook doesn't keep the desk waiting.
      operationId: getTerminalPayment
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: refresh, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalPayment" }
        "404":
          description: Payment not found

  /api/salon-admin/{salonId}/payments/terminal-payments/{paymentId}/{action}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: paymentId, required: true, schema: { type: integer, format: int64 } }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [cancel, retry, simulate] }
    post:
      tags: [AdminPayments]
      summary: Cancel, retry or (test mode) simulate a card-reader payment
      description: |
        Staff may call it. `cancel` stops the reader and cancels the PaymentIntent (the sale / membership
        payment fails); refused with 409 while the card is being authorised. `retry` sends the open payment to
        a reader again — body `{ "terminalId": … }` to switch reader. `simulate` (Stripe test mode only)
        presents a test card on a simulated reader — optional body `{ "cardNumber": "4000000000000002" }`.
      operationId: actOnTerminalPayment
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                terminalId: { type: integer, format: int64, nullable: true }
                cardNumber: { type: string, nullable: true }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalPayment" }
        "409":
          description: Already settled, card being processed, or not in test mode

  /api/payments/stripe/webhook:
    post:
      tags: [AdminPayments]
      summary: Stripe Connect webhook
      description: |
        Unauthenticated; verified with the `Stripe-Signature` header (HMAC-SHA256, 5-minute
        tolerance) against `STRIPE_WEBHOOK_SECRET`. Register it as a **Connect** endpoint for
        `checkout.session.completed`, `checkout.session.async_payment_succeeded`,
        `checkout.session.async_payment_failed`, `checkout.session.expired` (online checkouts),
        `payment_intent.succeeded`, `payment_intent.payment_failed`, `payment_intent.canceled`,
        `terminal.reader.action_failed` (card readers) and `refund.created`, `refund.updated`,
        `refund.failed`, `charge.refund.updated` (refunds, including ones made in Stripe's embedded payments
        component). Events for unknown accounts or mismatched `metadata.salon_id` are acknowledged and
        ignored. Payment areas are `SHOP`, `BOOKING`, `POS` and `MEMBERSHIP`; `payment_reference` is the
        order / booking / sale / membership-payment id. Every payment is recorded in the payment ledger
        (`/payments/transactions`).
      operationId: stripeWebhook
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Processed or ignored
        "400":
          description: Invalid signature or payload
        "503":
          description: Webhook secret not configured

  # ─── Membership — Customer ───────────────────────────────────────────────────

  /api/salon/{salonId}/membership/plans:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [Membership]
      summary: List membership plans on sale
      description: |
        Plans with status `ACTIVE`, in the salon's order. `onlineSignup` is true when the salon has
        Stripe membership payments enabled and its account can charge — otherwise show the plans with
        a "contact the salon" call to action. 404 when the salon doesn't have the `MEMBERSHIP` feature.
      operationId: listPublicMembershipPlans
      responses:
        "200":
          description: Plan catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCatalog" }
        "404":
          description: Salon not found, disabled, or without the MEMBERSHIP feature

  /api/salon/{salonId}/membership/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: planId, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Membership]
      summary: Get one membership plan on sale
      operationId: getPublicMembershipPlan
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "404":
          description: No such plan on sale

  /api/salon/{salonId}/membership/checkout:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [Membership]
      summary: Start a membership checkout
      description: |
        Works like the shop's checkout: creates a `PENDING_PAYMENT` membership (price and interval
        snapshotted from the plan) and a `PENDING` sign-up payment of one period's price plus any sign-up
        fee, then a one-time Stripe Checkout on the salon's connected account (payment area `MEMBERSHIP`,
        reference = the payment id) — redirect to `checkoutUrl`. An unpaid checkout holds a place on a
        capped plan for 60 minutes. Stripe returns the visitor to `returnUrl` (only if it belongs to the
        salon; otherwise the website's `/membership` page) with `?payment=success|cancel&reference=<paymentId>`.

        When the Connect webhook confirms payment the membership becomes `ACTIVE` until one billing interval
        from now, and the member is emailed their QR code (encoding `memberCode`). Nothing renews by itself:
        before the period ends the member is emailed a renewal link (see the `renewals` endpoints).
      operationId: startMembershipCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCheckoutRequest" }
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCheckoutResponse" }
        "400":
          description: Missing plan, name, or a valid email address
        "404":
          description: Plan not on sale, or the salon has no MEMBERSHIP feature
        "409":
          description: Online sign-up not enabled, the plan is full, or this email is already a member of the plan
        "502":
          description: Stripe rejected the Checkout Session

  /api/salon/{salonId}/membership/renewals/{token}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: token, required: true, schema: { type: string }, description: The renewal token from the member's reminder email }
    get:
      tags: [Membership]
      summary: What the renewal link shows
      operationId: getMembershipRenewal
      responses:
        "200":
          description: Renewal view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipRenewal" }
        "404":
          description: Unknown token, or the salon has no MEMBERSHIP feature

  /api/salon/{salonId}/membership/renewals/{token}/checkout:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: token, required: true, schema: { type: string } }
    post:
      tags: [Membership]
      summary: Pay for the next period
      description: |
        A `RENEWAL` payment of the member's snapshotted price and a one-time Checkout, exactly like sign-up.
        Once paid, the new period starts where the current one ends (or now, if it has expired). Allowed for
        `ACTIVE` memberships within 31 days of their end and for `EXPIRED` ones; renewing clears a scheduled
        cancellation.
      operationId: startMembershipRenewal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                returnUrl: { type: string, format: uri, nullable: true }
                inlineCheckout: { type: boolean, nullable: true }
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCheckoutResponse" }
        "404":
          description: Unknown token
        "409":
          description: Cancelled or never-paid membership, too early to renew, or online payment off
        "502":
          description: Stripe rejected the Checkout Session

  # ─── Membership — Admin ──────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/membership/plans:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminMembership]
      summary: List all plans (any status) with member counts
      operationId: adminListMembershipPlans
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPlan" }
    post:
      tags: [AdminMembership]
      summary: Create a plan
      operationId: createMembershipPlan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPlanRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "400":
          description: Validation failed (name, price > 0, 3-letter currency, interval, discounts 0–100, limit ≥ 1, services of this salon)

  /api/salon-admin/{salonId}/membership/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - { in: path, name: planId, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [AdminMembership]
      summary: Get a plan
      operationId: adminGetMembershipPlan
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "404":
          description: Not found
    put:
      tags: [AdminMembership]
      summary: Update a plan
      description: Price and interval changes apply to new members only; existing subscriptions keep their snapshot.
      operationId: updateMembershipPlan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPlanRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "400":
          description: Validation failed
        "404":
          description: Not found
    delete:
      tags: [AdminMembership]
      summary: Delete a plan that never had members
      operationId: deleteMembershipPlan
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: "The plan has (or had) members — archive it instead (status ARCHIVED)"

  /api/salon-admin/{salonId}/membership/plans/order:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    put:
      tags: [AdminMembership]
      summary: Reorder plans
      operationId: reorderMembershipPlans
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        "200":
          description: Plans in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPlan" }

  /api/salon-admin/{salonId}/membership/subscriptions:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminMembership]
      summary: List members
      description: Newest first. `q` matches name, email or member code.
      operationId: listMembershipSubscriptions
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: status, schema: { $ref: "#/components/schemas/MembershipStatus" } }
        - { in: query, name: planId, schema: { type: integer, format: int64 } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipSubscription" }

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    get:
      tags: [AdminMembership]
      summary: Get a member with payments and timeline
      operationId: getMembershipSubscription
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Member detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "404":
          description: Not found

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/qr.png:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    get:
      tags: [AdminMembership]
      summary: The member's QR code (encodes `memberCode`)
      operationId: getMembershipQrCode
      security:
        - BearerAuth: []
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Not found

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    post:
      tags: [AdminMembership]
      summary: Cancel a membership
      description: |
        Nothing renews by itself, so no Stripe call is needed. `atPeriodEnd` (default `true`) keeps an
        `ACTIVE` member until their paid period ends, sends no renewal reminder, then ends it (`CANCELLED`);
        `false` (and any `EXPIRED` membership) ends it now. No refund is issued. The member is emailed either
        way and can no longer renew from their link.
      operationId: cancelMembershipSubscription
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                atPeriodEnd: { type: boolean, default: true }
                reason: { type: string, nullable: true, description: Internal note, not sent to the member }
      responses:
        "200":
          description: Updated member detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "409":
          description: Checkout not paid yet, or the membership has already ended

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/resume:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    post:
      tags: [AdminMembership]
      summary: Undo an end-of-period cancellation
      operationId: resumeMembershipSubscription
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Updated member detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "409":
          description: The membership isn't set to cancel at period end

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/notes:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    post:
      tags: [AdminMembership]
      summary: Add a staff note to the member's timeline
      operationId: addMembershipNote
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "200":
          description: Updated member detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "400":
          description: Empty note

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/resend-welcome:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    post:
      tags: [AdminMembership]
      summary: Email the member their QR code again
      operationId: resendMembershipWelcome
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Member detail (the email is sent asynchronously and recorded on the timeline)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "409":
          description: Not a current member

  /api/salon-admin/{salonId}/membership/subscriptions/{subscriptionId}/send-renewal-link:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/MembershipSubscriptionId"
    post:
      tags: [AdminMembership]
      summary: Email the member their renewal link now
      operationId: sendMembershipRenewalLink
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Member detail (the email is sent asynchronously and recorded on the timeline)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "409":
          description: Not an active or expired membership, or it is set to cancel

  /api/salon-admin/{salonId}/membership/desk-sales:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    post:
      tags: [AdminMembership]
      summary: Sell a membership at the salon desk (Till / POS)
      description: >
        Same plan, capacity and duplicate rules as online sign-up; the membership's `source` is `ADMIN`.
        `CASH` / `OTHER` are paid on the spot — the membership is `ACTIVE` when this returns, the QR welcome
        email is queued, and `checkoutUrl` is null. `CARD` with `terminalId` sends the payment to that card reader
        (`terminalPayment` in the response — follow it with `/payments/terminal-payments/{paymentId}`); without it,
        the same one-time Stripe Checkout as online sign-up (needs membership payments enabled); `returnUrl` may
        point at the salon desk app.
      operationId: sellMembershipAtDesk
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipDeskSaleRequest" }
      responses:
        "201":
          description: Membership created (and active, unless paying by card)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCheckoutResponse" }
        "400":
          description: Missing plan, name, valid email or payment method
        "404":
          description: Plan not found or not on sale
        "409":
          description: Plan full, already a member of this plan, or card chosen without membership payments enabled

  /api/salon-admin/{salonId}/membership/verify:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminMembership]
      summary: Look up a member by the code in their QR (check-in)
      description: Case and separators are ignored, so a scanned or typed code both work.
      operationId: verifyMembership
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200":
          description: Member detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipDetail" }
        "404":
          description: No membership at this salon has that code

  /api/salon-admin/{salonId}/membership/overview:
    parameters:
      - $ref: "#/components/parameters/SalonId"
    get:
      tags: [AdminMembership]
      summary: Membership dashboard
      description: |
        Member counts (active, expired-not-renewed, pending), monthly recurring revenue (each active member's
        price converted to a monthly amount; members set to cancel excluded), money collected this calendar
        month (UTC), renewals due in 7 / 30 days, a per-plan breakdown, the next renewals and the latest
        activity. Money is reported per currency.
      operationId: getMembershipOverview
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipOverview" }

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the identity provider after the admin authenticates.
        Enforced in OAuth2 mode by the backend's path-specific role and ownership rules.
        Authentication is bypassed in local/mock security mode.

  parameters:
    MembershipSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SalonId:
      name: salonId
      in: path
      required: true
      schema:
        type: string
      description: |
        Salon UUID (`a1b2c3d4-e5f6-7890-abcd-ef1234567890`) or handler slug (`glam-salon`).
        UUID form is tried first; if the value isn't a valid UUID it falls back to a handler
        lookup — the same rule `GET /api/salon/{salonIdOrHandler}` uses. Returns `404` if
        neither matches.

    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Service item ID

    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Staff member ID

    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Booking ID

    BrandId:
      name: brandId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Shop brand ID

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Shop category ID

    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Product ID

    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Product variant ID

    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Shop order ID

    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Order line ID

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    StripeConnectStatus:
      type: object
      properties:
        stripe:
          type: object
          properties:
            configured:
              type: boolean
              description: Server has both STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET
            account:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/StripeConnectedAccount"
            settings:
              $ref: "#/components/schemas/SalonPaymentSettings"
            testMode:
              type: boolean
              description: The server uses a Stripe sandbox/test secret key (`sk_test_…`)
            inlineCheckoutAvailable:
              type: boolean
              description: The server has STRIPE_PUBLISHABLE_KEY, so areas can use the EMBEDDED / ELEMENTS checkout
            publishableKey:
              type: string
              nullable: true
              description: Platform publishable key for Stripe.js / Connect.js (embedded account components)
            onboarding:
              type: object
              properties:
                stage:
                  type: string
                  enum: [NOT_STARTED, ACTION_REQUIRED, IN_REVIEW, READY]
                  description: |
                    `NOT_STARTED` no connected account; `ACTION_REQUIRED` Stripe needs information from
                    the salon; `IN_REVIEW` everything due is submitted but card payments aren't active
                    yet; `READY` card payments active.
                requirements:
                  type: array
                  description: Stripe requirements that are currently or past due (empty when Stripe wasn't queried)
                  items:
                    type: object
                    properties:
                      description: { type: string }
                      awaitingActionFrom: { type: string, enum: [user, stripe] }
                      deadline: { type: string, enum: [currently_due, past_due] }

    StripeConnectedAccount:
      type: object
      properties:
        salonId: { type: string, format: uuid }
        stripeAccountId: { type: string, example: "acct_1Nxyz" }
        country: { type: string, example: "DK" }
        detailsSubmitted: { type: boolean }
        chargesEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        updatedAt: { type: string, format: date-time }

    MembershipBillingInterval:
      type: string
      enum: [MONTHLY, QUARTERLY, YEARLY]

    MembershipStatus:
      type: string
      enum: [PENDING_PAYMENT, ACTIVE, EXPIRED, CANCELLED, INCOMPLETE]
      description: |
        `PENDING_PAYMENT` first checkout started · `ACTIVE` paid through `currentPeriodEnd` · `EXPIRED` the
        period ran out without a renewal (can still renew) · `CANCELLED` ended by the salon ·
        `INCOMPLETE` first checkout abandoned or its payment failed.

    MembershipIncludedService:
      type: object
      properties:
        serviceId: { type: integer, format: int64 }
        name: { type: string }
        durationMinutes: { type: integer, nullable: true }
        price: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        quantityPerCycle: { type: integer }

    MembershipPlan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        currency: { type: string, example: EUR }
        billingInterval: { $ref: "#/components/schemas/MembershipBillingInterval" }
        signupFee: { type: number, nullable: true }
        serviceDiscountPercent: { type: integer, nullable: true }
        productDiscountPercent: { type: integer, nullable: true }
        maxMembers: { type: integer, nullable: true, description: Cap on members at once; null = unlimited }
        spotsLeft: { type: integer, nullable: true, description: Capped plans only — counts unpaid checkouts still within their hold }
        soldOut: { type: boolean }
        highlighted: { type: boolean, description: Shown as "Most popular" }
        sortOrder: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        perks: { type: array, items: { type: string } }
        includedServices: { type: array, items: { $ref: "#/components/schemas/MembershipIncludedService" } }
        includedValue: { type: number, nullable: true, description: List price of the included services per period }
        activeMembers: { type: integer, description: Admin responses only }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MembershipPlanRequest:
      type: object
      required: [name, price, currency, billingInterval]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        billingInterval: { $ref: "#/components/schemas/MembershipBillingInterval" }
        signupFee: { type: number, nullable: true, minimum: 0 }
        serviceDiscountPercent: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        productDiscountPercent: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        maxMembers: { type: integer, nullable: true, minimum: 1 }
        highlighted: { type: boolean }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED], default: DRAFT }
        perks: { type: array, items: { type: string, maxLength: 300 } }
        includedServices:
          type: array
          items:
            type: object
            required: [serviceId]
            properties:
              serviceId: { type: integer, format: int64 }
              quantityPerCycle: { type: integer, minimum: 1, default: 1 }

    MembershipCatalog:
      type: object
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/MembershipPlan" } }
        onlineSignup: { type: boolean }

    MembershipCheckoutRequest:
      type: object
      required: [planId, customerName, customerEmail]
      properties:
        planId: { type: integer, format: int64 }
        customerName: { type: string }
        customerEmail: { type: string, format: email, description: The QR code is emailed here }
        customerPhone: { type: string, nullable: true }
        returnUrl: { type: string, format: uri, nullable: true }
        inlineCheckout: { type: boolean, nullable: true, description: The website can show Stripe's form in its page (see the shop order request) }

    MembershipDeskSaleRequest:
      type: object
      required: [planId, customerName, customerEmail, paymentMethod]
      properties:
        planId: { type: integer, format: int64 }
        customerName: { type: string }
        customerEmail: { type: string, format: email, description: The QR code is emailed here }
        customerPhone: { type: string, nullable: true }
        paymentMethod: { type: string, enum: [CASH, CARD, OTHER], description: CARD goes to a card reader (terminalId) or through Stripe Checkout }
        returnUrl: { type: string, format: uri, nullable: true, description: Where Stripe returns after a CARD checkout }
        terminalId: { type: integer, format: int64, nullable: true, description: For CARD, the salon card reader to take the payment on }
        inlineCheckout: { type: boolean, nullable: true, description: For a CARD checkout, the desk shows Stripe's form itself }

    MembershipCheckoutResponse:
      type: object
      properties:
        subscriptionId: { type: integer, format: int64 }
        checkoutUrl: { type: string, format: uri, nullable: true, description: Redirect checkout URL; null for cash/other, a card reader, or an in-page form }
        checkout:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PaymentCheckout" }]
        terminalPayment:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TerminalPayment" }]

    MembershipSubscription:
      type: object
      properties:
        id: { type: integer, format: int64 }
        salonId: { type: string, format: uuid }
        planId: { type: integer, format: int64 }
        planName: { type: string }
        memberCode: { type: string, example: M7K2Q9XZT, description: What the member's QR code encodes }
        renewalToken: { type: string, description: Secret in the member's renewal link }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/MembershipStatus" }
        price: { type: number }
        currency: { type: string }
        billingInterval: { $ref: "#/components/schemas/MembershipBillingInterval" }
        signupFee: { type: number, nullable: true }
        source: { type: string, enum: [ONLINE, ADMIN] }
        startedAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true, description: Paid through }
        cancelAtPeriodEnd: { type: boolean }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        renewalReminderFor: { type: string, format: date-time, nullable: true, description: Period end the last renewal reminder was sent for }
        lastPaymentStatus: { type: string, enum: [PAID, FAILED], nullable: true }
        lastPaymentAt: { type: string, format: date-time, nullable: true }
        lastPaymentAmount: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    MembershipPayment:
      type: object
      description: >
        The payment for one billing period. A CARD payment is a one-time Stripe Checkout whose
        payment_reference is this id; CASH / OTHER were taken at the salon desk and are paid on creation.
      properties:
        id: { type: integer, format: int64 }
        subscriptionId: { type: integer, format: int64 }
        kind: { type: string, enum: [SIGNUP, RENEWAL] }
        status: { type: string, enum: [PENDING, PAID, FAILED] }
        method: { type: string, enum: [CARD, CASH, OTHER] }
        amount: { type: number }
        currency: { type: string }
        checkoutSessionId: { type: string, nullable: true }
        periodStart: { type: string, format: date-time, nullable: true }
        periodEnd: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    MembershipRenewal:
      type: object
      properties:
        subscriptionId: { type: integer, format: int64 }
        planName: { type: string }
        firstName: { type: string }
        price: { type: number }
        currency: { type: string }
        billingInterval: { $ref: "#/components/schemas/MembershipBillingInterval" }
        status: { $ref: "#/components/schemas/MembershipStatus" }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        canRenewNow: { type: boolean, description: Expired, or active within 31 days of its end }
        onlinePayment: { type: boolean }

    MembershipActivity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        subscriptionId: { type: integer, format: int64 }
        type:
          type: string
          enum: [CHECKOUT_STARTED, CHECKOUT_FAILED, ACTIVATED, RENEWAL_STARTED, RENEWED, PAYMENT_FAILED, EXPIRED,
                 CANCELLATION_SCHEDULED, CANCELLATION_UNDONE, CANCELLED, CUSTOMER_NOTIFIED, NOTE]
        message: { type: string }
        actor: { type: string, example: stripe }
        createdAt: { type: string, format: date-time }

    MembershipDetail:
      type: object
      properties:
        subscription: { $ref: "#/components/schemas/MembershipSubscription" }
        payments: { type: array, items: { $ref: "#/components/schemas/MembershipPayment" } }
        activity: { type: array, items: { $ref: "#/components/schemas/MembershipActivity" } }

    MembershipMoney:
      type: object
      properties:
        currency: { type: string }
        amount: { type: number }

    MembershipOverview:
      type: object
      properties:
        activeMembers: { type: integer }
        expiredMembers: { type: integer }
        pendingCheckouts: { type: integer }
        newThisMonth: { type: integer }
        cancelledThisMonth: { type: integer }
        renewalsNext7Days: { type: integer }
        renewalsNext30Days: { type: integer }
        monthlyRecurringRevenue: { type: array, items: { $ref: "#/components/schemas/MembershipMoney" } }
        collectedThisMonth: { type: array, items: { $ref: "#/components/schemas/MembershipMoney" } }
        plans:
          type: array
          items:
            type: object
            properties:
              planId: { type: integer, format: int64 }
              name: { type: string }
              status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
              activeMembers: { type: integer }
              maxMembers: { type: integer, nullable: true }
              monthlyRecurringRevenue: { $ref: "#/components/schemas/MembershipMoney" }
        upcomingRenewals: { type: array, items: { $ref: "#/components/schemas/MembershipSubscription" } }
        recentActivity:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MembershipActivity"
              - type: object
                properties:
                  customerName: { type: string }
                  planName: { type: string }

    PaymentAreaSetting:
      type: object
      required: [area, enabled, checkoutUi]
      properties:
        area: { type: string, enum: [SHOP, BOOKING, POS, MEMBERSHIP] }
        enabled: { type: boolean }
        checkoutUi:
          type: string
          enum: [REDIRECT, EMBEDDED, ELEMENTS]
          description: |
            How customers pay online in this area. `REDIRECT` Stripe-hosted Checkout page (with the salon's
            name and website colours); `EMBEDDED` Stripe's Checkout form inside the salon's page;
            `ELEMENTS` the salon's own payment form (Stripe Payment Element styled with the website theme).
            `EMBEDDED`/`ELEMENTS` need `STRIPE_PUBLISHABLE_KEY` on the server and apply only to clients
            that send `inlineCheckout: true`.

    SalonPaymentSettings:
      type: object
      properties:
        salonId: { type: string, format: uuid }
        areas:
          type: array
          description: One entry per area (SHOP, BOOKING, POS, MEMBERSHIP)
          items: { $ref: "#/components/schemas/PaymentAreaSetting" }
        bookingPaymentType: { type: string, enum: [FULL, DEPOSIT] }
        bookingDepositPercent: { type: integer, minimum: 1, maximum: 100 }
        updatedAt: { type: string, format: date-time, nullable: true }

    UpdatePaymentSettingsRequest:
      type: object
      required: [bookingPaymentType, bookingDepositPercent]
      properties:
        areas:
          type: array
          description: Areas to change; areas left out keep their current setting
          items: { $ref: "#/components/schemas/PaymentAreaSetting" }
        bookingPaymentType: { type: string, enum: [FULL, DEPOSIT] }
        bookingDepositPercent: { type: integer, minimum: 1, maximum: 100 }

    PaymentCheckout:
      type: object
      description: |
        How to take the customer through payment. `REDIRECT`: open `url`. `EMBEDDED`: Stripe.js
        `loadStripe(publishableKey, { stripeAccount: stripeAccountId })` then `createEmbeddedCheckoutPage`
        with `clientSecret`. `ELEMENTS`: `initCheckoutElementsSdk({ clientSecret })` and a Payment Element,
        styled from `branding`. Stripe sends the customer to `returnUrl` once paid; leaving the form goes to
        `cancelUrl` — the same `?payment=success|cancel` pages the redirect checkout returns to.
      properties:
        ui: { type: string, enum: [REDIRECT, EMBEDDED, ELEMENTS] }
        url: { type: string, format: uri, nullable: true }
        clientSecret: { type: string, nullable: true }
        publishableKey: { type: string, nullable: true }
        stripeAccountId: { type: string, nullable: true }
        returnUrl: { type: string, format: uri, nullable: true }
        cancelUrl: { type: string, format: uri, nullable: true }
        branding:
          type: object
          nullable: true
          properties:
            displayName: { type: string, nullable: true }
            primaryColor: { type: string, nullable: true, description: Website accent colour (#RRGGBB) }
            backgroundColor: { type: string, nullable: true, description: Website hero background (#RRGGBB) }
            fontFamily: { type: string, nullable: true, description: Website font (Google Fonts family or preset) }

    TerminalPayment:
      type: object
      description: A card payment running on a salon card reader
      properties:
        paymentId: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, CANCELED] }
        terminalId: { type: integer, format: int64, nullable: true }
        terminalLabel: { type: string, nullable: true }
        amount: { type: number }
        currency: { type: string }
        failureMessage: { type: string, nullable: true, description: Last reader problem (e.g. card declined); the payment stays open for a retry }

    PaymentTerminal:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stripeReaderId: { type: string }
        label: { type: string }
        deviceType: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [online, offline, null] }
        createdAt: { type: string, format: date-time }

    PaymentTransaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        salonId: { type: string, format: uuid }
        area: { type: string, enum: [SHOP, BOOKING, POS, MEMBERSHIP] }
        reference: { type: string, description: Order / booking / sale / membership-payment id }
        channel: { type: string, enum: [CHECKOUT, TERMINAL] }
        checkoutUi: { type: string, nullable: true, enum: [REDIRECT, EMBEDDED, ELEMENTS, null] }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, CANCELED, PARTIALLY_REFUNDED, REFUNDED] }
        amount: { type: number }
        currency: { type: string }
        amountRefunded: { type: number }
        description: { type: string, nullable: true }
        customerEmail: { type: string, nullable: true }
        checkoutSessionId: { type: string, nullable: true }
        paymentIntentId: { type: string, nullable: true }
        terminalId: { type: integer, format: int64, nullable: true }
        failureMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PaymentRefund:
      type: object
      properties:
        id: { type: integer, format: int64 }
        paymentId: { type: integer, format: int64 }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, description: "Stripe refund status: pending, requires_action, succeeded, failed, canceled" }

    BookingCheckoutResponse:
      type: object
      required: [booking]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        checkoutUrl: { type: string, format: uri, nullable: true, description: Redirect checkout URL (null for an in-page form) }
        checkout: { $ref: "#/components/schemas/PaymentCheckout" }

    ShopCheckoutResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: "#/components/schemas/ShopOrder" }
        checkoutUrl: { type: string, format: uri, nullable: true, description: Redirect checkout URL (null for an in-page form) }
        checkout: { $ref: "#/components/schemas/PaymentCheckout" }

    WebsiteDomainSettings:
      type: object
      required: [available, websiteEnabled, domain]
      properties:
        available:
          type: boolean
        websiteEnabled:
          type: boolean
        domain:
          oneOf:
            - $ref: '#/components/schemas/WebsiteDomain'
            - type: 'null'
    WebsiteDomain:
      type: object
      required: [hostname, status, records]
      properties:
        hostname:
          type: string
        status:
          type: string
          enum: [PENDING_DNS, PROVISIONING, ACTIVE, ERROR, DELETING]
        message:
          type: [string, 'null']
        checkedAt:
          type: [string, 'null']
          format: date-time
        records:
          type: array
          items:
            type: object
            required: [type, name, value]
            properties:
              type:
                type: string
                enum: [TXT, CNAME]
              name:
                type: string
                description: Fully qualified record name
              value:
                type: string
              host:
                type: [string, 'null']
                description: |
                  `name` relative to `zone` (e.g. `_salonsaas-verification.www`, `www`) — what to type in DNS
                  providers that append the zone (Azure DNS, GoDaddy, Cloudflare…). Null when the zone is unknown.
              zone:
                type: [string, 'null']
                description: DNS zone holding the hostname, discovered from the SOA authority at connect time


    TextPolishRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Existing biography or description to polish. Must contain non-whitespace text; the backend applies Java NotBlank and Size validation.
          examples: ["i specialise in hair colour and love helping clients find their style"]

    TextPolishResponse:
      type: object
      required: [text, suggestions]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Default polished version, retained for compatibility; identical to suggestions.polished.
          examples: ["I specialise in hair colour and love helping clients find their personal style."]
        suggestions:
          type: object
          required: [polished, friendly, concise]
          description: Three versions generated together. Each is nonblank, stripped of surrounding whitespace, and must be reviewed before saving.
          properties:
            polished:
              type: string
              minLength: 1
              maxLength: 5000
              description: Professional and natural wording.
            friendly:
              type: string
              minLength: 1
              maxLength: 5000
              description: Warm and approachable wording.
            concise:
              type: string
              minLength: 1
              maxLength: 5000
              description: Shorter, direct wording preserving the supplied facts.

    ThemeSuggestRequest:
      type: object
      required: [salonName]
      properties:
        salonName:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Rose Studio"]
        style:
          type: string
          maxLength: 300
          description: Optional style hint from the admin, treated as descriptive data.
          examples: ["luxury, soft pink"]
        services:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 120
          description: Optional service names giving the model a sense of the salon's niche.
          examples: [["Balayage", "Bridal makeup"]]
        websiteType:
          type: string
          maxLength: 40
          description: When `GENERATIVE_UI`, the model favours the chat-window colours.

    ThemeSuggestion:
      type: object
      required: [name, mood, heroBg, heroTextColor, accentColor, logoBgColor, headerBg, footerBg, chatBg, fontFamily]
      properties:
        name:
          type: string
          maxLength: 60
          examples: ["Blush Luxe"]
        mood:
          type: string
          maxLength: 300
          description: One sentence on why the colours and font work together.
        heroBg:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        heroTextColor:
          type: string
          pattern: "^#[0-9A-F]{6}$"
          description: Guaranteed at least 4.5:1 contrast against heroBg.
        accentColor:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        logoBgColor:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        headerBg:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        footerBg:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        chatBg:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        fontFamily:
          type: string
          enum: [inter, playfair, raleway, lato, poppins, montserrat, lora, cormorant, oswald, dancing, nunito, merriweather, system, georgia]
          description: Preset font slug, stored as-is in `WebsiteTheme.fontFamily`.

    ThemeSuggestResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ThemeSuggestion"

    # ── Errors ───────────────────────────────────────────────────────────────

    ProblemDetail:
      type: object
      description: >
        RFC 9457 problem detail. Every error response (4xx/5xx) uses this shape,
        served as `application/problem+json`.
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Salon not found"
        instance:
          type: string
          format: uri
          example: "/api/salon/nan/booking/slots"
        timestamp:
          type: string
          format: date-time
          description: When the error was produced (added by the global handler).

    # ── Closure ──────────────────────────────────────────────────────────────

    SalonClosure:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          example: "2026-08-01"
        endDate:
          type: string
          format: date
          example: "2026-08-14"
        reason:
          type: string
          example: "Annual vacation"
        holidayId:
          type: integer
          format: int64
          nullable: true
          description: >
            Set when this closure was auto-generated from a holiday record.
            Holiday-backed closures cannot be deleted directly — delete the parent holiday instead.

    SalonHoliday:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
          example: "Christmas Day"
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Month of the holiday (1 = January)
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: Day-of-month of the holiday
        year:
          type: integer
          nullable: true
          description: >
            Specific year for a one-off holiday; null for an annually recurring holiday.
        createdAt:
          type: string
          format: date-time

    AddHolidayRequest:
      type: object
      required: [name, month, day]
      properties:
        name:
          type: string
          description: Human-readable holiday name
          example: "Christmas Day"
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        year:
          type: integer
          nullable: true
          description: >
            Omit (or send null) for an annually recurring holiday.
            Provide a specific year for a one-off occurrence.

    AddClosureRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          description: First day of the closure (inclusive)
        endDate:
          type: string
          format: date
          description: Last day of the closure (inclusive); use same value as startDate for a single day
        reason:
          type: string
          description: Optional human-readable reason shown in the admin UI

    # ── Salon ────────────────────────────────────────────────────────────────

    Salon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handler:
          type: string
          description: URL-friendly slug
        owner:
          $ref: "#/components/schemas/Owner"
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SalonFeature"
          description: Serialized as a flat array of feature strings
          example: ["BOOKING", "ANALYTICS"]
        bookingAdvanceDays:
          type: integer
          description: How many days in advance customers can book. Defaults to 60.
          default: 60
        businessRegistrationId:
          type: string
          description: Company/business registration number (e.g. CVR, EIN, Company Number).
        showBusinessId:
          type: boolean
          description: Whether to display the registration number on the public website. Defaults to false.
          default: false
        termsAccepted:
          type: boolean
          description: Whether the salon owner has accepted the terms and conditions. Defaults to false.
          default: false
        termsAcceptedAt:
          type: string
          format: date-time
          description: Timestamp when the terms were accepted. Set automatically on creation when termsAccepted is true.
          readOnly: true
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings are created with status PENDING and must be manually confirmed
            by an admin. When false (default), bookings are auto-confirmed immediately (status CONFIRMED).
          default: false
        businessIdLabel:
          type: string
          description: >
            Country-specific label for the registration number (e.g. "CVR Number" for Denmark,
            "EIN" for United States). Derived automatically from location.country on create/update;
            read-only in responses.
          readOnly: true
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: Salon lifecycle status. Defaults to ACTIVE on creation.

    CreateSalonRequest:
      type: object
      required: [name, ownerName, ownerEmail, termsAccepted]
      properties:
        name:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
          format: email
        ownerPhone:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SalonFeature"
        businessRegistrationId:
          type: string
          description: Company/business registration number.
        showBusinessId:
          type: boolean
          description: Whether to show the registration number on the public website. Defaults to false.
          default: false
        termsAccepted:
          type: boolean
          description: Must be true — the owner explicitly accepted the terms and conditions before salon creation.

    CreateSalonResponse:
      type: object
      properties:
        salonId:
          type: string
          format: uuid
          description: The newly created salon's UUID
        salonHandler:
          type: string
          description: URL-friendly slug derived from the salon name
        emailId:
          type: string
          format: email
          description: The owner's email address to use when signing in to the admin panel
        message:
          type: string
          description: Human-readable confirmation that a welcome email has been sent with the login link and setup guide

    UpdateSalonRequest:
      type: object
      required: [name]
      description: >
        Salon admin update — owner data is NOT changeable here.
        To change the owner, use PUT /api/salon-super-admin/salons/{id}/owner (super-admin only).
      properties:
        name:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        bookingAdvanceDays:
          type: integer
          description: How many days ahead customers can book. Preserved if omitted.
        businessRegistrationId:
          type: string
          description: Business registration number (e.g. CVR for Denmark, EIN for USA). Displayed on the public website when showBusinessId is true.
        showBusinessId:
          type: boolean
          default: false
          description: Whether to display the business registration number on the public website. When updated alongside location.country, businessIdLabel is re-derived automatically.
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings require manual admin confirmation (created as PENDING).
            When false, bookings are auto-confirmed. Preserved if omitted.

    PatchBookingSettingsRequest:
      type: object
      description: Partial update for booking-related salon settings. Omitted fields are preserved.
      properties:
        bookingAdvanceDays:
          type: integer
          description: How many days ahead customers can book.
          example: 60
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings are created as PENDING and must be manually confirmed.
            When false, bookings are auto-confirmed immediately.

    UpdateOwnerRequest:
      type: object
      required: [name, email]
      description: Request body for the super-admin owner-change endpoint.
      properties:
        name:
          type: string
          description: Full name of the new owner.
        email:
          type: string
          format: email
          description: Email address used for owner login.
        phone:
          type: string
          description: Optional contact phone number.

    Owner:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    Location:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zipCode:
          type: string
        mapsUrl:
          type: string
          format: uri
          maxLength: 2000
          description: >
            Optional custom "Open in Maps" link (e.g. a Google Maps share link). Must be an http(s) URL;
            blank is stored as null. When null, the website links to a Google Maps search for the address.
            Edited in salon-admin under Edit salon → Location (moved from the website design panel).

    ContactInfo:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        facebook:
          type: string
          format: uri
          description: Public Facebook profile/page URL.
        facebookVisible:
          type: boolean
          description: Show the Facebook icon in the website footer. When true with no URL set, the icon renders disabled.
        instagram:
          type: string
          format: uri
          description: Public Instagram profile URL.
        instagramVisible:
          type: boolean
          description: Show the Instagram icon in the website footer. When true with no URL set, the icon renders disabled.
        tiktok:
          type: string
          format: uri
          description: Public TikTok profile URL.
        tiktokVisible:
          type: boolean
          description: Show the TikTok icon in the website footer. When true with no URL set, the icon renders disabled.
        youtube:
          type: string
          format: uri
          description: Public YouTube channel URL.
        youtubeVisible:
          type: boolean
          description: Show the YouTube icon in the website footer. When true with no URL set, the icon renders disabled.
        x:
          type: string
          format: uri
          description: Public X (Twitter) profile URL.
        xVisible:
          type: boolean
          description: Show the X icon in the website footer. When true with no URL set, the icon renders disabled.

    OperatingHours:
      type: object
      properties:
        day:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        openTime:
          type: string
          description: Opening time in HH:mm format
          example: "09:00"
        closeTime:
          type: string
          description: Closing time in HH:mm format
          example: "18:00"
        closed:
          type: boolean
          default: false

    SalonFeature:
      type: string
      enum:
        - STATIC_WEBSITE
        - BOOKING
        - MEMBERSHIP
        - WEBSHOP
        - ANALYTICS
        - LOYALTY_PROGRAM
      description: |
        `ANALYTICS` is activated by `POST /api/analytics/events` (ingestion) and
        `GET /api/salon-admin/{salonId}/analytics/summary` (the owner-facing rollup) — no
        schema/enum change was needed for the flag itself, it pre-dates those endpoints.

    # ── Analytics ────────────────────────────────────────────────────────────

    AnalyticsEventType:
      type: string
      enum:
        - PAGE_VIEW
        - CLICK

    ActivityEvent:
      type: object
      required: [salonId, eventType, path]
      properties:
        salonId:
          type: string
          format: uuid
          description: |
            Salon the event belongs to. Events for a salon that doesn't exist, or hasn't
            enabled the `ANALYTICS` feature, are accepted but silently dropped.
        sessionId:
          type: string
          nullable: true
          description: Client-generated session identifier.
          example: "a1b2c3"
        eventType:
          $ref: "#/components/schemas/AnalyticsEventType"
        path:
          type: string
          description: The page path the event occurred on.
          example: "/"
        label:
          type: string
          nullable: true
          description: |
            A `data-track` attribute value identifying what was clicked. Typically present
            for CLICK events, absent for PAGE_VIEW.
          example: "hero-book-appointment"
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Client-reported event time. The server uses the current server time if omitted.

    AnalyticsSummary:
      type: object
      properties:
        totalViews:
          type: integer
          format: int64
          description: Total PAGE_VIEW events across the full requested window (not just topPages).
          example: 128
        totalClicks:
          type: integer
          format: int64
          description: Total CLICK events across the full requested window (not just topClicks).
          example: 34
        viewsByDay:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
                example: "2026-08-25"
              count:
                type: integer
                format: int64
                example: 12
        topPages:
          type: array
          description: Top 10 paths by view count, descending.
          items:
            type: object
            properties:
              path:
                type: string
                example: "/"
              count:
                type: integer
                format: int64
                example: 80
        topClicks:
          type: array
          description: Top 10 click labels by count, descending.
          items:
            type: object
            properties:
              label:
                type: string
                example: "hero-book-appointment"
              count:
                type: integer
                format: int64
                example: 20

    GenUiSummary:
      type: object
      properties:
        totalSessions:
          type: integer
          format: int64
          description: Distinct chat sessionIds seen across the full requested window.
          example: 42
        totalMessages:
          type: integer
          format: int64
          description: Total visitor messages sent to the assistant across the full requested window.
          example: 210
        totalBookingsProposed:
          type: integer
          format: int64
          description: Turns where the assistant staged a booking proposal (proposeBooking).
          example: 15
        topComponents:
          type: array
          description: Top 10 interactive component types rendered, descending by count.
          items:
            type: object
            properties:
              type:
                type: string
                example: "services"
              count:
                type: integer
                format: int64
                example: 60
        topTools:
          type: array
          description: Top 10 data-lookup tool names invoked, descending by count.
          items:
            type: object
            properties:
              tool:
                type: string
                example: "services"
              count:
                type: integer
                format: int64
                example: 80

    # ── Service ───────────────────────────────────────────────────────────────

    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: null for pay-as-you-go services
        currency:
          type: ["string", "null"]
          example: USD
          description: null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: null for pay-as-you-go services; UI defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string
          description: Serialized as a flat array of staff ID strings
        createdAt:
          type: string
          format: date-time

    AddServiceRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: Omit or send null for a pay-as-you-go service
        currency:
          type: ["string", "null"]
          description: ISO 4217; omit or send null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: Omit or send null for pay-as-you-go; slot engine defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        assignedStaffIds:
          type: array
          items:
            type: string

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: null for pay-as-you-go services
        currency:
          type: ["string", "null"]
          description: null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: null for pay-as-you-go; UI defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string

    ServiceCategory:
      type: string
      enum:
        - HAIR
        - MAKEUP
        - NAILS
        - SKIN_CARE
        - BEARD
        - MASSAGE
        - WAXING
        - OTHER

    # ── Staff ─────────────────────────────────────────────────────────────────

    StaffMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/StaffStatus"
        isOwner:
          type: boolean
          description: >
            True when this staff member was auto-created from the salon owner's profile.
            Owner-staff entries cannot be deleted; the owner may opt out of the booking
            calendar by setting availableForBooking to false.
          default: false
        availableForBooking:
          type: boolean
          description: >
            When false, this staff member is excluded from slot discovery and will not
            be offered to customers during booking.
          default: true
        specializations:
          type: array
          items:
            type: string
          description: Serialized as a flat array of specialization strings
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Profile photo URL. (DB column profile_photo_url.)
        workMedia:
          type: array
          items:
            type: string
            format: uri
          description: Image or video URLs of the staff member's work, shown on the public website
        bio:
          type: string
          description: Short bio shown on the public website
        createdAt:
          type: string
          format: date-time

    StaffMemberSummary:
      type: object
      description: >
        Staff member record enriched with salon context. Returned only by
        `GET /api/salon-staff/me` so the login picker can distinguish between
        accounts at different salons. `role` and `status` are serialized as
        plain strings (enum name).
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        salonName:
          type: string
          description: Display name of the salon this staff record belongs to.
          nullable: true
        salonHandler:
          type: string
          description: URL-friendly slug of the salon (e.g. "sunshine-cuts").
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          description: Staff role serialized as its enum name (e.g. "MANAGER").
        status:
          type: string
          description: Staff status serialized as its enum name (e.g. "ACTIVE").
        isOwner:
          type: boolean
          default: false
        availableForBooking:
          type: boolean
          default: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Profile photo (avatar) URL.
        bio:
          type: string
          nullable: true
          description: Free-text "About me" blurb shown on the public website.
        specializations:
          type: array
          items:
            type: string
        workMedia:
          type: array
          items:
            type: string
            format: uri
          description: Image or video URLs of the staff member's work, shown on the public website.
        createdAt:
          type: string
          format: date-time

    PresignedUpload:
      type: object
      description: Pre-signed URLs for a direct-to-storage photo upload.
      properties:
        presignedUrl:
          type: string
          format: uri
          description: >
            PUT this URL with the file body and matching `Content-Type` header to
            upload the photo. In production this is a time-limited S3 signed URL;
            in local dev it is a backend endpoint.
        publicUrl:
          type: string
          format: uri
          description: >
            The CDN or public URL to persist on the staff profile once the
            upload completes.

    OnboardStaffRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
