          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceItem"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminServices]
      summary: Delete a service (admin)
      operationId: deleteService
      responses:
        "204":
          description: Service deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff ────────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/staff:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminStaff]
      summary: List staff members (admin)
      operationId: adminListStaff
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

    post:
      tags: [AdminStaff]
      summary: Onboard a new staff member (admin)
      operationId: onboardStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardStaffRequest"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /api/salon-admin/{salonId}/staff/{staffId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminStaff]
      summary: Get a staff member by ID (admin)
      operationId: adminGetStaffMember
      responses:
        "200":
          description: Staff member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminStaff]
      summary: Update a staff member (admin)
      description: Admin-only. Updates name, contact, role, status, specializations, photos, bio, and booking availability.
      operationId: updateStaffMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminStaff]
      summary: Remove a staff member (admin)
      description: Admin-only. Removes a staff member from the roster. Existing bookings for this member are cascade-deleted. Owner-staff entries (`isOwner = true`) cannot be deleted.
      operationId: deleteStaffMember
      responses:
        "204":
          description: Staff member removed
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Admin — Staff Availability ───────────────────────────────────────────────

  /api/salon-admin/{salonId}/staff/{staffId}/availability:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: Get staff weekly availability schedule (admin)
      operationId: getStaffAvailability
      responses:
        "200":
          description: Weekly availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

    put:
      tags: [AdminAvailability]
      summary: Replace staff weekly availability schedule (admin)
      description: |
        Admin-only. Replaces the entire weekly schedule for a staff member. Previous entries
        are deleted before the new set is saved.
        Emits **StaffScheduleUpdatedEvent** → notification module logs the change.
      operationId: setStaffAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/DayScheduleRequest"
      responses:
        "200":
          description: Updated availability entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailability"

  /api/salon-admin/{salonId}/staff/{staffId}/availability/overrides:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"

    get:
      tags: [AdminAvailability]
      summary: List date-specific availability overrides (admin)
      operationId: getAvailabilityOverrides
      responses:
        "200":
          description: List of overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityOverride"

    post:
      tags: [AdminAvailability]
      summary: Add a date-specific availability override (admin)
      description: |
        Admin-only. Pins availability for a staff member on a specific date, overriding the
        regular weekly schedule. Set `available: false` with no times to mark a day as
        unavailable (e.g. holiday or sick leave).
        Emits **StaffAvailabilityOverrideAddedEvent** → notification module logs the change.
      operationId: addAvailabilityOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOverrideRequest"
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityOverride"

  /api/salon-admin/{salonId}/staff/{staffId}/availability/overrides/{overrideId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/StaffId"
      - name: overrideId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    delete:
      tags: [AdminAvailability]
      summary: Remove a date-specific availability override (admin)
      description: |
        Admin-only. Deletes the override so the regular weekly schedule applies again for
        that date. Scoped to the given salonId/staffId pair.
        Emits **StaffAvailabilityOverrideRemovedEvent** → notification module logs the change.
      operationId: removeAvailabilityOverride
      responses:
        "204":
          description: Override removed

  # ─── Admin — Booking ──────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/booking:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminBooking]
      summary: List all bookings for a salon (admin)
      description: Admin-only. Returns all bookings across all statuses.
      operationId: listBookings
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /api/salon-admin/{salonId}/booking/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    get:
      tags: [AdminBooking]
      summary: Get a booking by ID (admin)
      operationId: adminGetBooking
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [AdminBooking]
      summary: Reschedule a booking (admin)
      description: |
        Admin-only. Moves a booking to a different date, time, or staff member. End time is
        recalculated automatically from the service duration.
        Emits **BookingRescheduledEvent** → customer receives a reschedule notification.
      operationId: rescheduleBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Booking rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [AdminBooking]
      summary: Delete a booking (admin)
      description: Admin-only. Permanently removes a booking record.
      operationId: deleteBooking
      responses:
        "204":
          description: Booking deleted

  /api/salon-admin/{salonId}/booking/{bookingId}/confirm:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Confirm a booking (admin)
      description: |
        Admin-only. Moves the booking from PENDING to CONFIRMED.
        Emits **BookingStatusChangedEvent** → customer receives a confirmation notification.
      operationId: confirmBooking
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Cancel a booking (admin)
      description: |
        Admin-only. Moves the booking to CANCELLED status.
        Emits **BookingStatusChangedEvent** → customer receives a cancellation notification.
      operationId: cancelBooking
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/complete:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as completed (admin)
      description: |
        Admin-only. Marks the appointment as COMPLETED after the customer's visit.
        Emits **BookingStatusChangedEvent** → customer receives a completion notification.
      operationId: completeBooking
      responses:
        "200":
          description: Booking completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/salon-admin/{salonId}/booking/{bookingId}/no-show:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - $ref: "#/components/parameters/BookingId"

    post:
      tags: [AdminBooking]
      summary: Mark a booking as no-show (admin)
      description: |
        Admin-only. Records that the customer did not attend their appointment.
        Emits **BookingStatusChangedEvent** → customer receives a no-show notification.
      operationId: noShowBooking
      responses:
        "200":
          description: Booking marked as no-show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Customer — Holidays (read-only) ─────────────────────────────────────────

  /api/salon/{salonId}/holidays:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Booking]
      summary: List salon holidays (customer)
      description: >
        Returns all holidays defined for this salon. The public website uses this
        to label days as holidays in the opening-hours display.
      operationId: listHolidaysPublic
      responses:
        "200":
          description: List of holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonHoliday"

  # ─── Customer — Closures (read-only) ─────────────────────────────────────────

  /api/salon/{salonId}/closures:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [Booking]
      summary: List salon closures (customer)
      description: >
        Returns all closures defined for this salon. The booking wizard uses this
        to disable closed date ranges in all three calendar views.
      operationId: listClosuresPublic
      responses:
        "200":
          description: List of closures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonClosure"

  # ─── Admin — Closures ────────────────────────────────────────────────────────

  /api/salon-admin/{salonId}/closures:
    parameters:
      - $ref: "#/components/parameters/SalonId"

    get:
      tags: [AdminClosures]
      summary: List salon closures (admin)
      description: Returns all closures defined for this salon, sorted by start date.
      operationId: listClosures
      responses:
        "200":
          description: List of closures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalonClosure"

    post:
      tags: [AdminClosures]
      summary: Add a salon closure (admin)
      description: |
        Admin-only. Marks the salon as closed for a date range. A single day can be closed
        by setting `startDate` and `endDate` to the same value. Once saved, slot discovery
        will return an empty list for any date within the closure, and booking creation will
        return HTTP 400 for those dates.
      operationId: addClosure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClosureRequest"
      responses:
        "200":
          description: Closure created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonClosure"

  /api/salon-admin/{salonId}/closures/{closureId}:
    parameters:
      - $ref: "#/components/parameters/SalonId"
      - name: closureId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Closure ID

    delete:
      tags: [AdminClosures]
      summary: Remove a salon closure (admin)
      description: Admin-only. Removes the closure so bookings can be taken for those dates again.
      operationId: removeClosure
      responses:
        "204":
          description: Closure removed

  # ─── Super Admin ──────────────────────────────────────────────────────────────

  /api/salon-super-admin/salons:
    get:
      tags: [SuperAdmin]
      summary: List / search salons (super-admin)
      description: |
        Returns registered salons across all tenants. Supports optional server-side full-text
        search (`q`) and status filtering (`status`). When `q` is provided the search is performed
        in the database across: salon name, handler, owner name, owner email, owner phone,
        contact phone, contact email, city, and country (case-insensitive LIKE). Combining
        `q` and `status` is supported. Omitting both parameters returns all salons.
      operationId: superAdminListSalons
      parameters:
        - name: q
          in: query
          required: false
          description: Full-text search term (case-insensitive). Searched across name, handler, owner name/email/phone, contact phone/email, city, country.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by salon status.
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
      responses:
        "200":
          description: List of matching salons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salon"

  /api/salon-super-admin/salons/{id}:
    get:
      tags: [SuperAdmin]
      summary: Get a salon by ID (super-admin)
      operationId: superAdminGetSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

    delete:
      tags: [SuperAdmin]
      summary: Disable a salon (super-admin)
      description: Soft-deletes the salon (sets status to DISABLED). Data is preserved and the salon can be re-enabled.
      operationId: superAdminDisableSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon disabled; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/features:
    put:
      tags: [SuperAdmin]
      summary: Update salon features (super-admin)
      description: Replaces the full set of enabled features for a salon.
      operationId: superAdminUpdateFeatures
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SalonFeature"
      responses:
        "200":
          description: Features updated; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/owner:
    put:
      tags: [SuperAdmin]
      summary: Update salon owner (super-admin)
      description: >
        Replaces the owner record (name, email, phone) for a salon.
        Only accessible by a super-admin. The regular salon-admin update endpoint
        (PUT /api/salon-admin/{id}) does not touch owner data.
      operationId: superAdminUpdateOwner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerRequest"
      responses:
        "200":
          description: Owner updated; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "400":
          description: Validation error (name or email blank)
        "404":
          description: Salon not found

  /api/salon-super-admin/salons/{id}/enable:
    put:
      tags: [SuperAdmin]
      summary: Enable a disabled salon (super-admin)
      description: |
        Re-activates a previously disabled salon (sets status to ACTIVE).
        Emits **SalonUpdatedEvent** → owner receives a notification email.
      operationId: superAdminEnableSalon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Salon UUID or handler slug — same resolution rule as the `salonId` parameter used
            elsewhere (UUID tried first, falls back to a handler lookup; 404 if neither matches).
      responses:
        "200":
          description: Salon enabled; returns updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salon"
        "404":
          description: Salon not found

  # ─── Utility ──────────────────────────────────────────────────────────────────

  /api/salon-utility/countries:
    get:
      tags: [Utility]
      summary: List all supported countries
      operationId: listCountries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"


  # ─── Staff Portal ────────────────────────────────────────────────────────────

  /api/salon-staff/me:
    get:
      summary: Look up the caller's own staff record(s)
      description: |
        Returns all staff records for the authenticated caller, enriched with the salon's
        `name` and `handler` so the login picker can distinguish between accounts at
        different salons. Used during login to identify the staff member before OTP verification.

        The caller's identity is taken from the `sub` claim of the bearer token —
        never from client input, since that would let a caller ask for someone
        else's staff record. The `email` query parameter is only a fallback for
        unauthenticated local/mock-mode use and is ignored whenever a bearer
        token is present.
      tags: [StaffPortal]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: query
          name: email
          required: false
          schema:
            type: string
            format: email
          description: |
            Fallback email, used only when no bearer token is present
            (local/mock-mode login). Ignored when the caller is authenticated.
      responses:
        "200":
          description: Staff records found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMemberSummary"
        "401":
          description: No bearer token and no email fallback provided
        "404":
          description: No staff account found for this email

  /api/salon-staff/{staffId}:
    get:
      summary: Get own staff profile
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Staff member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Not found

  /api/salon-staff/{staffId}/profile:
    patch:
      summary: Update own profile
      description: >
        Self-service update of the caller's own staff record. Any omitted field is
        left unchanged. Email, role, and status remain admin-managed.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                specializations:
                  type: array
                  items:
                    type: string
                availableForBooking:
                  type: boolean
                photoUrl:
                  type: string
                  format: uri
                  description: Profile photo (avatar) URL.
                bio:
                  type: string
                  description: Free-text "About me" blurb shown on the public website.
                photoUrls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: Image or video URLs of the staff member's work, shown on the public website.
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "404":
          description: Not found

  /api/salon-staff/{staffId}/appointments:
    get:
      summary: List own appointments
      description: Returns all bookings assigned to this staff member across all dates.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Bookings assigned to this staff member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "404":
          description: Staff member not found

  /api/salon-staff/{staffId}/holidays:
    get:
      summary: List personal holidays (days off)
      description: Returns all availability overrides where `available=false` — these block the booking calendar.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Personal holiday overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityOverride"
        "404":
          description: Staff member not found
    post:
      summary: Book a personal holiday
      description: Creates a date-specific unavailability override (`available=false`). Customers cannot book this staff member on that date.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrideDate]
              properties:
                overrideDate:
                  type: string
                  format: date
                  example: "2026-12-25"
                reason:
                  type: string
                  example: "Christmas"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityOverride"
        "404":
          description: Staff member not found

  /api/salon-staff/{staffId}/photo-upload-url:
    post:
      summary: Get a pre-signed URL to upload a photo or video
      description: |
        Returns a pre-signed PUT URL the browser can use to upload a file directly to
        S3 (or to the local dev endpoint when S3 is not configured). The `publicUrl`
        is the CDN URL to save on the staff profile after the upload completes — as
        `photoUrl` (avatar) or appended to `photoUrls` (work gallery), at the caller's
        choice. `contentType` accepts `image/*` and `video/*` (mp4, webm, quicktime).
        Returns `503` when media storage is not configured.
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  example: "image/jpeg"
      responses:
        "200":
          description: Pre-signed upload URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "404":
          description: Staff member not found
        "503":
          description: Media storage not configured

  /api/salon-staff/{staffId}/holidays/{holidayId}:
    delete:
      summary: Remove a personal holiday
      tags: [StaffPortal]
      parameters:
        - $ref: "#/components/parameters/StaffId"
        - in: path
          name: holidayId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Holiday removed
        "404":
          description: Staff member not found


# ─── Components ───────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the identity provider after the admin authenticates.
        **Not yet enforced** — authentication/authorisation is a planned future addition.
        Currently the `salonId` path parameter is the only enforcement in place.

  parameters:
    SalonId:
      name: salonId
      in: path
      required: true
      schema:
        type: string
      description: |
        Salon UUID (`a1b2c3d4-e5f6-7890-abcd-ef1234567890`) or handler slug (`glam-salon`).
        UUID form is tried first; if the value isn't a valid UUID it falls back to a handler
        lookup — the same rule `GET /api/salon/{salonIdOrHandler}` uses. Returns `404` if
        neither matches.

    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Service item ID

    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Staff member ID

    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Booking ID

  responses:
    NotFound:
      description: Resource not found

  schemas:

    # ── Closure ──────────────────────────────────────────────────────────────

    SalonClosure:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          example: "2026-08-01"
        endDate:
          type: string
          format: date
          example: "2026-08-14"
        reason:
          type: string
          example: "Annual vacation"
        holidayId:
          type: integer
          format: int64
          nullable: true
          description: >
            Set when this closure was auto-generated from a holiday record.
            Holiday-backed closures cannot be deleted directly — delete the parent holiday instead.

    SalonHoliday:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
          example: "Christmas Day"
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Month of the holiday (1 = January)
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: Day-of-month of the holiday
        year:
          type: integer
          nullable: true
          description: >
            Specific year for a one-off holiday; null for an annually recurring holiday.
        createdAt:
          type: string
          format: date-time

    AddHolidayRequest:
      type: object
      required: [name, month, day]
      properties:
        name:
          type: string
          description: Human-readable holiday name
          example: "Christmas Day"
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        year:
          type: integer
          nullable: true
          description: >
            Omit (or send null) for an annually recurring holiday.
            Provide a specific year for a one-off occurrence.

    AddClosureRequest:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          description: First day of the closure (inclusive)
        endDate:
          type: string
          format: date
          description: Last day of the closure (inclusive); use same value as startDate for a single day
        reason:
          type: string
          description: Optional human-readable reason shown in the admin UI

    # ── Salon ────────────────────────────────────────────────────────────────

    Salon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handler:
          type: string
          description: URL-friendly slug
        owner:
          $ref: "#/components/schemas/Owner"
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SalonFeature"
          description: Serialized as a flat array of feature strings
          example: ["BOOKING", "ANALYTICS"]
        bookingAdvanceDays:
          type: integer
          description: How many days in advance customers can book. Defaults to 60.
          default: 60
        businessRegistrationId:
          type: string
          description: Company/business registration number (e.g. CVR, EIN, Company Number).
        showBusinessId:
          type: boolean
          description: Whether to display the registration number on the public website. Defaults to false.
          default: false
        termsAccepted:
          type: boolean
          description: Whether the salon owner has accepted the terms and conditions. Defaults to false.
          default: false
        termsAcceptedAt:
          type: string
          format: date-time
          description: Timestamp when the terms were accepted. Set automatically on creation when termsAccepted is true.
          readOnly: true
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings are created with status PENDING and must be manually confirmed
            by an admin. When false (default), bookings are auto-confirmed immediately (status CONFIRMED).
          default: false
        businessIdLabel:
          type: string
          description: >
            Country-specific label for the registration number (e.g. "CVR Number" for Denmark,
            "EIN" for United States). Derived automatically from location.country on create/update;
            read-only in responses.
          readOnly: true
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: Salon lifecycle status. Defaults to ACTIVE on creation.

    CreateSalonRequest:
      type: object
      required: [name, ownerName, ownerEmail, termsAccepted]
      properties:
        name:
          type: string
        ownerName:
          type: string
        ownerEmail:
          type: string
          format: email
        ownerPhone:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SalonFeature"
        businessRegistrationId:
          type: string
          description: Company/business registration number.
        showBusinessId:
          type: boolean
          description: Whether to show the registration number on the public website. Defaults to false.
          default: false
        termsAccepted:
          type: boolean
          description: Must be true — the owner explicitly accepted the terms and conditions before salon creation.

    CreateSalonResponse:
      type: object
      properties:
        salonId:
          type: string
          format: uuid
          description: The newly created salon's UUID
        salonHandler:
          type: string
          description: URL-friendly slug derived from the salon name
        emailId:
          type: string
          format: email
          description: The owner's email address to use when signing in to the admin panel
        message:
          type: string
          description: Human-readable confirmation that a welcome email has been sent with the login link and setup guide

    UpdateSalonRequest:
      type: object
      required: [name]
      description: >
        Salon admin update — owner data is NOT changeable here.
        To change the owner, use PUT /api/salon-super-admin/salons/{id}/owner (super-admin only).
      properties:
        name:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/ContactInfo"
        operatingHours:
          type: array
          items:
            $ref: "#/components/schemas/OperatingHours"
        bookingAdvanceDays:
          type: integer
          description: How many days ahead customers can book. Preserved if omitted.
        businessRegistrationId:
          type: string
          description: Business registration number (e.g. CVR for Denmark, EIN for USA). Displayed on the public website when showBusinessId is true.
        showBusinessId:
          type: boolean
          default: false
          description: Whether to display the business registration number on the public website. When updated alongside location.country, businessIdLabel is re-derived automatically.
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings require manual admin confirmation (created as PENDING).
            When false, bookings are auto-confirmed. Preserved if omitted.

    PatchBookingSettingsRequest:
      type: object
      description: Partial update for booking-related salon settings. Omitted fields are preserved.
      properties:
        bookingAdvanceDays:
          type: integer
          description: How many days ahead customers can book.
          example: 60
        bookingRequiresConfirmation:
          type: boolean
          description: >
            When true, new bookings are created as PENDING and must be manually confirmed.
            When false, bookings are auto-confirmed immediately.

    UpdateOwnerRequest:
      type: object
      required: [name, email]
      description: Request body for the super-admin owner-change endpoint.
      properties:
        name:
          type: string
          description: Full name of the new owner.
        email:
          type: string
          format: email
          description: Email address used for owner login.
        phone:
          type: string
          description: Optional contact phone number.

    Owner:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    Location:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zipCode:
          type: string

    ContactInfo:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri

    OperatingHours:
      type: object
      properties:
        day:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        openTime:
          type: string
          description: Opening time in HH:mm format
          example: "09:00"
        closeTime:
          type: string
          description: Closing time in HH:mm format
          example: "18:00"
        closed:
          type: boolean
          default: false

    SalonFeature:
      type: string
      enum:
        - STATIC_WEBSITE
        - BOOKING
        - MEMBERSHIP
        - WEBSHOP
        - ANALYTICS
        - LOYALTY_PROGRAM
      description: |
        `ANALYTICS` is activated by `POST /api/analytics/events` (ingestion) and
        `GET /api/salon-admin/{salonId}/analytics/summary` (the owner-facing rollup) — no
        schema/enum change was needed for the flag itself, it pre-dates those endpoints.

    # ── Analytics ────────────────────────────────────────────────────────────

    AnalyticsEventType:
      type: string
      enum:
        - PAGE_VIEW
        - CLICK

    ActivityEvent:
      type: object
      required: [salonId, eventType, path]
      properties:
        salonId:
          type: string
          format: uuid
          description: |
            Salon the event belongs to. Events for a salon that doesn't exist, or hasn't
            enabled the `ANALYTICS` feature, are accepted but silently dropped.
        sessionId:
          type: string
          nullable: true
          description: Client-generated session identifier.
          example: "a1b2c3"
        eventType:
          $ref: "#/components/schemas/AnalyticsEventType"
        path:
          type: string
          description: The page path the event occurred on.
          example: "/"
        label:
          type: string
          nullable: true
          description: |
            A `data-track` attribute value identifying what was clicked. Typically present
            for CLICK events, absent for PAGE_VIEW.
          example: "hero-book-appointment"
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Client-reported event time. The server uses the current server time if omitted.

    AnalyticsSummary:
      type: object
      properties:
        totalViews:
          type: integer
          format: int64
          description: Total PAGE_VIEW events across the full requested window (not just topPages).
          example: 128
        totalClicks:
          type: integer
          format: int64
          description: Total CLICK events across the full requested window (not just topClicks).
          example: 34
        viewsByDay:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
                example: "2026-08-25"
              count:
                type: integer
                format: int64
                example: 12
        topPages:
          type: array
          description: Top 10 paths by view count, descending.
          items:
            type: object
            properties:
              path:
                type: string
                example: "/"
              count:
                type: integer
                format: int64
                example: 80
        topClicks:
          type: array
          description: Top 10 click labels by count, descending.
          items:
            type: object
            properties:
              label:
                type: string
                example: "hero-book-appointment"
              count:
                type: integer
                format: int64
                example: 20

    # ── Service ───────────────────────────────────────────────────────────────

    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: null for pay-as-you-go services
        currency:
          type: ["string", "null"]
          example: USD
          description: null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: null for pay-as-you-go services; UI defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string
          description: Serialized as a flat array of staff ID strings
        createdAt:
          type: string
          format: date-time

    AddServiceRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: Omit or send null for a pay-as-you-go service
        currency:
          type: ["string", "null"]
          description: ISO 4217; omit or send null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: Omit or send null for pay-as-you-go; slot engine defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        assignedStaffIds:
          type: array
          items:
            type: string

    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
          description: null for pay-as-you-go services
        currency:
          type: ["string", "null"]
          description: null when price is null
        durationMinutes:
          type: ["integer", "null"]
          description: null for pay-as-you-go; UI defaults to 30 min
        category:
          $ref: "#/components/schemas/ServiceCategory"
        active:
          type: boolean
        assignedStaffIds:
          type: array
          items:
            type: string

    ServiceCategory:
      type: string
      enum:
        - HAIR
        - MAKEUP
        - NAILS
        - SKIN_CARE
        - BEARD
        - MASSAGE
        - WAXING
        - OTHER

    # ── Staff ─────────────────────────────────────────────────────────────────

    StaffMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          $ref: "#/components/schemas/StaffStatus"
        isOwner:
          type: boolean
          description: >
            True when this staff member was auto-created from the salon owner's profile.
            Owner-staff entries cannot be deleted; the owner may opt out of the booking
            calendar by setting availableForBooking to false.
          default: false
        availableForBooking:
          type: boolean
          description: >
            When false, this staff member is excluded from slot discovery and will not
            be offered to customers during booking.
          default: true
        specializations:
          type: array
          items:
            type: string
          description: Serialized as a flat array of specialization strings
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          description: Image or video URLs of the staff member's work, shown on the public website
        bio:
          type: string
          description: Short bio shown on the public website
        createdAt:
          type: string
          format: date-time

    StaffMemberSummary:
      type: object
      description: >
        Staff member record enriched with salon context. Returned only by
        `GET /api/salon-staff/me` so the login picker can distinguish between
        accounts at different salons. `role` and `status` are serialized as
        plain strings (enum name).
      properties:
        id:
          type: integer
          format: int64
        salonId:
          type: string
          format: uuid
        salonName:
          type: string
          description: Display name of the salon this staff record belongs to.
          nullable: true
        salonHandler:
          type: string
          description: URL-friendly slug of the salon (e.g. "sunshine-cuts").
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          description: Staff role serialized as its enum name (e.g. "MANAGER").
        status:
          type: string
          description: Staff status serialized as its enum name (e.g. "ACTIVE").
        isOwner:
          type: boolean
          default: false
        availableForBooking:
          type: boolean
          default: true
        photoUrl:
          type: string
          format: uri
          nullable: true
          description: Profile photo (avatar) URL.
        bio:
          type: string
          nullable: true
          description: Free-text "About me" blurb shown on the public website.
        specializations:
          type: array
          items:
            type: string
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          description: Image or video URLs of the staff member's work, shown on the public website.
        createdAt:
          type: string
          format: date-time

    PresignedUpload:
      type: object
      description: Pre-signed URLs for a direct-to-storage photo upload.
      properties:
        presignedUrl:
          type: string
          format: uri
          description: >
            PUT this URL with the file body and matching `Content-Type` header to
            upload the photo. In production this is a time-limited S3 signed URL;
            in local dev it is a backend endpoint.
        publicUrl:
          type: string
          format: uri
          description: >
            The CDN or public URL to persist on the staff profile once the
            upload completes.

