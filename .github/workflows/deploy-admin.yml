name: Deploy salon-admin

on:
#  push:
#    branches: [main]
#    paths:
#      - "frontend/**"
#      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build salon-admin
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SALON_DOMAIN: ${{ vars.VITE_SALON_DOMAIN }}
          VITE_BASE_PATH: /
          VITE_BOOKING_BASE_URL: ${{ vars.VITE_BOOKING_BASE_URL }}
        run: npm run build:admin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-admin
          path: frontend/apps/salon-admin/build/client
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    if: false  # disabled: AWS deployment replaced by Azure
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-admin
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist \
            s3://salon-saas-admin-web/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html \
            s3://salon-saas-admin-web/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id E20WDQABJM1OZA --paths "/*"

  deploy-azure:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-admin
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --source dist \
            --destination '$web' \
            --account-name salonsaasdevadmin \
            --auth-mode login \
            --overwrite true \
            --content-cache-control "public,max-age=31536000,immutable"
          az storage blob upload \
            --file dist/index.html \
            --name index.html \
            --container '$web' \
            --account-name salonsaasdevadmin \
            --auth-mode login \
            --content-cache-control "no-cache,no-store,must-revalidate" \
            --overwrite true

      - name: Purge Azure Front Door
        run: |
          az afd endpoint purge \
            --resource-group multi-tenant-salon-dev \
            --profile-name salon-saas-dev-fe-afd \
            --endpoint-name salon-saas-dev-fe-admin-web \
            --content-paths "/*" \
            --domains salon-saas-dev-fe-admin-web-f0hhancqhac5chg3.z01.azurefd.net
