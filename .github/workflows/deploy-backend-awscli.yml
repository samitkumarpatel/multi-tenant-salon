name: Deploy backend (AWS CLI)

on:
#  push:
#    branches: [main]
#    paths:
#      - "src/**"
#      - "pom.xml"
#      - ".github/workflows/deploy-backend-awscli.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samitkumarpatel/multi-tenant-salon
  AWS_REGION: eu-north-1
  ECS_SERVICE: salon-saas-dev-api
  ECS_CLUSTER: salon-saas-dev-cluster
  ECS_TASK_DEFINITION_FAMILY: salon-saas-dev-api
  CONTAINER_NAME: api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG

          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

          docker tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:latest

          echo "image=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83  # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

          echo "---------------------debug: task-definition.json---------------------"
          cat task-definition.json

      - name: Update image in task definition
        run: |
          jq --arg IMAGE "${{ needs.build.outputs.image }}" \
             --arg NAME "${{ env.CONTAINER_NAME }}" \
             '(.containerDefinitions[] | select(.name == $NAME) | .image) = $IMAGE' \
             task-definition.json > task-definition.new.json
          mv task-definition.new.json task-definition.json

      - name: Register new task definition
        id: register
        run: |
          REVISION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$REVISION_ARN" >> "$GITHUB_OUTPUT"

      - name: Record previous task definition (for rollback)
        id: previous
        run: |
          PREV_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "prev_task_def_arn=$PREV_ARN" >> "$GITHUB_OUTPUT"

      - name: Update service to new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register.outputs.task_def_arn }} \
            --force-new-deployment

      - name: Wait for service to stabilize
        id: wait
        continue-on-error: true
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Roll back on failure
        if: steps.wait.outcome == 'failure'
        run: |
          echo "Deployment failed, rolling back to ${{ steps.previous.outputs.prev_task_def_arn }}"
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.previous.outputs.prev_task_def_arn }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          exit 1

      - name: Deployment succeeded
        if: steps.wait.outcome == 'success'
        run: echo "Deployed ${{ needs.build.outputs.image }} to ${{ env.ECS_SERVICE }}"
