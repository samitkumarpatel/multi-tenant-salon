name: Deploy saloon-onboarding

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/saloon-onboarding/**"
      - "frontend/package.json"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend/apps/saloon-onboarding
        run: npx react-router build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: saloon-onboarding
          path: frontend/apps/saloon-onboarding/build/client
          retention-days: 7

