name: Deploy salon-onboarding

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-onboarding.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build salon-onboarding
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_MIX || 'https://api-m.salonsaas.org' }}
          VITE_SALON_DOMAIN: ${{ vars.VITE_SALON_DOMAIN_MIX || 'salonsaas.org' }}
          VITE_ADMIN_APP_URL: ${{ vars.VITE_ADMIN_APP_URL_MIX || 'https://admin-m.salonsaas.org' }}
          VITE_BASE_PATH: /
        run: npm run build:onboarding

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-onboarding
          path: frontend/apps/salon-onboarding/build/client
          retention-days: 7

  # ── Cloudflare Pages (mix) — ACTIVE deploy path ────────────────────────────
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-onboarding
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=salonsaas-onboarding --branch=main

  deploy:
    runs-on: ubuntu-latest
    if: false # disabled: AWS deployment replaced by Cloudflare Pages
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-onboarding
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist \
            s3://salon-saas-onboarding-web/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html \
            s3://salon-saas-onboarding-web/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id EOLKINLTPH8ZG --paths "/*"

  deploy-azure:
    runs-on: ubuntu-latest
    if: false # disabled: Azure Blob Storage + Front Door replaced by Cloudflare Pages
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-onboarding
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Blob Storage
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --account-name salonsaasdevonboarding \
            --resource-group multi-tenant-salon-dev \
            --query "[0].value" -o tsv)
          az storage blob upload-batch \
            --source dist \
            --destination '$web' \
            --account-name salonsaasdevonboarding \
            --account-key "$ACCOUNT_KEY" \
            --overwrite true \
            --content-cache-control "public,max-age=31536000,immutable"
          az storage blob upload \
            --file dist/index.html \
            --name index.html \
            --container '$web' \
            --account-name salonsaasdevonboarding \
            --account-key "$ACCOUNT_KEY" \
            --content-cache-control "no-cache,no-store,must-revalidate" \
            --overwrite true

      - name: Purge Azure Front Door
        run: |
          az afd endpoint purge --no-wait \
            --resource-group multi-tenant-salon-dev \
            --profile-name salon-saas-dev-fe-afd \
            --endpoint-name salon-saas-dev-fe-onboarding-web \
            --content-paths "/*" \
            --domains salon-saas-dev-fe-onboarding-web-fqeag8g9h3c5g3fp.z01.azurefd.net
