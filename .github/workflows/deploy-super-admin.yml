name: Deploy saloon-super-admin

on:
  push:
    branches: [main, infrastructure]
    paths:
      - "frontend/apps/saloon-super-admin/**"
      - "frontend/package.json"
      - ".github/workflows/deploy-super-admin.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build saloon-super-admin
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:super-admin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: saloon-super-admin
          path: frontend/apps/saloon-super-admin/build/client
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/apps/saloon-super-admin/build/client \
            s3://my-saloon-super-admin-web/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/apps/saloon-super-admin/build/client/index.html \
            s3://my-saloon-super-admin-web/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ENS8GTYX5RDXL --paths "/*"
