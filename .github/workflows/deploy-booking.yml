name: Deploy salon-booking

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/salon-booking/**"
      - "frontend/packages/ui-website/**"
      - ".github/workflows/deploy-booking.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build salon-booking
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.salonsaas.org' }}
        run: npm run build:booking

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: salon-booking
          path: frontend/apps/salon-booking/build/client
          retention-days: 7

  # ── Deploy · Cloudflare Pages (ACTIVE) ───────────────────────────────────
  cloudflare-deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-booking
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=salonsaas-booking --branch=main

  # ── Deploy · AWS S3 + CloudFront (DISABLED) ──────────────────────────────
  # The S3 bucket + CloudFront distribution were destroyed in the Cloudflare
  # migration. To re-enable: re-provision infrastructure/aws, set the
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets, then change `if: false`
  # to `if: true`.
  aws-s3-deploy:
    runs-on: ubuntu-latest
    if: false
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-booking
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist \
            s3://salon-saas-booking-web/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html \
            s3://salon-saas-booking-web/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id E3B923Q0BOJBQJ --paths "/*"

  # ── Deploy · Azure Blob $web + Front Door (DISABLED) ─────────────────────
  # The storage account + Front Door endpoint were destroyed in the Cloudflare
  # migration. To re-enable: re-provision infrastructure/azure, set the
  # AZURE_CREDENTIALS secret, then change `if: false` to `if: true`.
  azure-storage-deploy:
    runs-on: ubuntu-latest
    if: false
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: salon-booking
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Blob Storage
        run: |
          az storage blob sync \
            --source dist \
            --container '$web' \
            --account-name salonsaasdevbooking \
            --auth-mode login \
            --delete-destination true \
            --exclude-pattern "index.html" \
            --content-cache-control "public,max-age=31536000,immutable"
          az storage blob upload \
            --file dist/index.html \
            --name index.html \
            --container '$web' \
            --account-name salonsaasdevbooking \
            --auth-mode login \
            --content-cache-control "no-cache,no-store,must-revalidate" \
            --overwrite true

      - name: Purge Azure Front Door
        run: |
          az afd endpoint purge \
            --resource-group multi-tenant-salon-dev \
            --profile-name salon-saas-dev-fe-afd \
            --endpoint-name salon-saas-dev-fe-booking-web \
            --content-paths "/*" \
            --domains salon-saas-dev-fe-booking-web-azb8hvgucfd7hcbq.z01.azurefd.net
