name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "helm/api/**"
      - "pom.xml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samitkumarpatel/multi-tenant-salon
  AKS_RESOURCE_GROUP: multi-tenant-salon-dev
  AKS_CLUSTER_NAME: salon-saas-dev
  AKS_NAMESPACE: salon

jobs:
  # ── Stage 1: Build & push image ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-image
        run: |
          IMAGE=$REGISTRY/$IMAGE_NAME

          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$IMAGE:${{ github.sha }}

          docker push $IMAGE:${{ github.sha }}

          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

          echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ── Stage 2: AWS ECS deployment (disabled — replaced by Azure) ───────────────
  deploy-aws:
    runs-on: ubuntu-latest
    if: false
    needs: build
    environment: dev
    permissions:
      contents: read

    env:
      AWS_REGION: eu-north-1
      ECS_SERVICE: salon-saas-dev-api
      ECS_CLUSTER: salon-saas-dev-cluster
      ECS_TASK_DEFINITION_FAMILY: salon-saas-dev-api
      CONTAINER_NAME: api

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            BPL_JVM_THREAD_COUNT=100
            SPRING_CLOUD_AWS_S3_ENABLED=true
            STORAGE_TYPE=S3

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  # ── Stage 3: Azure AKS deployment via Helm ───────────────────────────────────
  deploy-azure:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy API via Helm
        run: |
          helm upgrade --install api ./helm/api \
            --namespace ${{ env.AKS_NAMESPACE }} \
            --create-namespace \
            -f helm/api/values-dev.yaml \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m
