name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samitkumarpatel/multi-tenant-salon

jobs:
  # ── Stage 1: Build & push image ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-image
        run: |
          IMAGE=$REGISTRY/$IMAGE_NAME

          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$IMAGE:${{ github.sha }}

          docker push $IMAGE:${{ github.sha }}

          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

          echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ── Stage 2: Azure Container Apps rolling image update ─────────────────────
  # Infra (the salon-saas-mix-api Container App, its env, PostgreSQL and Key
  # Vault) is provisioned by infrastructure/mix. This job only rolls the image.
  # The `auth` service ships from the multi-tenant-salon-authz repo's own workflow.
  deploy-container-apps:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    env:
      RESOURCE_GROUP: multi-tenant-salon-mix
      API_APP: salon-saas-mix-api

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll api image on Container Apps
        run: |
          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build.outputs.image }}"

      - name: Show revision status on failure
        if: failure()
        run: |
          az containerapp revision list \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, state:properties.runningState, replicas:properties.replicas}" \
            -o table || true
