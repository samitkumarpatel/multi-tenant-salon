name: Deploy saloon-public-website

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/saloon-public-website/**"
      - "frontend/packages/ui-website/**"
      - "frontend/package.json"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build saloon-public-website
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
          VITE_SALOON_DOMAIN: ${{ vars.VITE_SALOON_DOMAIN || 'my-saloon.online' }}
        run: npm run build:public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: saloon-public-website
          path: frontend/apps/saloon-public-website/build/client
          retention-days: 7

