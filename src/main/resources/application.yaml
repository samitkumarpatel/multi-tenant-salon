spring:
  application:
    name: @project.artifactId@
    utility:
      static-geo-data: classpath:data/countries.json
      static-currency-data: classpath:data/currencies.json
  datasource:
    url: jdbc:postgresql://localhost:5432/saloon
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
    locations:
      - db