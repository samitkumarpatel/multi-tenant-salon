spring:
  application:
    name: @project.artifactId@
    utility:
      static-geo-data: classpath:data/countries.json
      static-currency-data: classpath:data/currencies.json
    media:
      # STORAGE_TYPE=LOCAL (default) — photos stored locally and served by the backend
      # STORAGE_TYPE=S3              — photos stored in S3; also set SPRING_CLOUD_AWS_S3_ENABLED=true
      # STORAGE_TYPE=AZURE           — photos stored in Azure Blob Storage; also set AZURE_STORAGE_ACCOUNT_NAME
      storage-type: ${STORAGE_TYPE:LOCAL}
      staff-bucket-name: ${MEDIA_STAFF_BUCKET_NAME:}
      staff-container-name: ${MEDIA_STAFF_CONTAINER_NAME:staff-media}
      staff-cdn-base-url: ${MEDIA_STAFF_CDN_BASE_URL:https://staff.salonsaas.org}
      local-base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8080}
      local-storage-path: ${MEDIA_LOCAL_STORAGE_PATH:/tmp/salon-photos}
      # Signs local-mode upload URLs so /api/media/photos/upload/** can verify a request was
      # actually issued, the way S3 verifies a pre-signed URL's signature. Set this explicitly
      # for any multi-instance deployment — unset, each instance generates its own random secret.
      upload-signing-secret: ${MEDIA_UPLOAD_SIGNING_SECRET:}
    analytics:
      # Azure Storage Queue that buffers SPA click/view events between the public ingestion
      # endpoint and the DB-writing consumer. Leave AZURE_STORAGE_ACCOUNT_NAME unset to log
      # events instead of enqueuing them — the default for dev/test (same idea as the Mailjet
      # api-key fallback below).
      queue-name: ${ANALYTICS_QUEUE_NAME:salon-activity-events}
      poll-interval-ms: ${ANALYTICS_POLL_INTERVAL_MS:5000}
    cors:
      # Comma-separated origin patterns. Override in production via CORS_ALLOWED_ORIGIN_PATTERNS.
      # e.g. https://salonsaas.org,https://www.salonsaas.org,https://*.salonsaas.org
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    website-domains:
      enabled: ${WEBSITE_DOMAINS_ENABLED:false}
      platform-domain: ${SALON_DOMAIN:salonsaas.org}
      cname-target: ${WEBSITE_DOMAINS_CNAME_TARGET:customers.salonsaas.org}
      zone-id: ${WEBSITE_DOMAINS_ZONE_ID:}
      api-token: ${WEBSITE_DOMAINS_API_TOKEN:}
      poll-interval-ms: ${WEBSITE_DOMAINS_POLL_INTERVAL_MS:60000}
    notification:
      mailjet:
        sender: ${MAILJET_SENDER:noreply@salonsaas.org}
        sender-name: ${MAILJET_SENDER_NAME:SalonSaaS}
        # Leave unset to disable actual sending (notifications are logged only) — e.g. in dev/test.
        api-key: ${MAILJET_API_KEY:}
        api-secret: ${MAILJET_API_SECRET:}
      salon-domain: ${SALON_DOMAIN:salonsaas.org}
      admin-app-url: ${NOTIFICATION_ADMIN_APP_URL:https://admin.salonsaas.org}
      staff-app-url: ${NOTIFICATION_STAFF_APP_URL:https://staff.salonsaas.org}
      booking-app-url: ${NOTIFICATION_BOOKING_APP_URL:https://book.salonsaas.org}
      support-email: ${NOTIFICATION_SUPPORT_EMAIL:admin@salonsaas.org}
      # Help Center (wiki/) — linked from owner/staff emails only, never customer ones.
      help-url: ${NOTIFICATION_HELP_URL:https://help.salonsaas.org}
    payments:
      stripe-secret-key: ${STRIPE_SECRET_KEY:}
      stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Platform publishable key: lets the website/desk render Stripe's embedded or branded payment form
      # on the salon's connected account. Without it every area falls back to the redirect checkout.
      stripe-publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      admin-app-url: ${PAYMENTS_ADMIN_APP_URL:https://admin.salonsaas.org}
      dashboard-app-url: ${PAYMENTS_DASHBOARD_APP_URL:https://dashboard.salonsaas.org}
      booking-app-url: ${PAYMENTS_BOOKING_APP_URL:https://book.salonsaas.org}
      website-app-url: ${PAYMENTS_WEBSITE_APP_URL:}
      salon-domain: ${SALON_DOMAIN:salonsaas.org}
      # Stripe-Version sent on Accounts v2 (/v2/core/**) calls; v1 Checkout calls use the account default.
      stripe-api-version: ${STRIPE_API_VERSION:2026-08-26.dahlia}
    membership:
      # Members pay per period (one-time Checkout, like the shop); this job emails renewal links and
      # expires lapsed memberships.
      renewal-cron: ${MEMBERSHIP_RENEWAL_CRON:0 */15 * * * *}
      renewal-reminder-days: ${MEMBERSHIP_RENEWAL_REMINDER_DAYS:7}
    customer:
      # Customer self-service accounts: an emailed one-time code signs a customer in to one salon.
      code-ttl: ${CUSTOMER_CODE_TTL:PT10M}
      session-ttl: ${CUSTOMER_SESSION_TTL:P30D}
      # Codes sent to one address in one salon per 15 minutes, and sign-in requests per client IP per hour.
      max-codes-per-email: ${CUSTOMER_MAX_CODES_PER_EMAIL:5}
      max-requests-per-ip: ${CUSTOMER_MAX_REQUESTS_PER_IP:30}
      # Wrong guesses allowed against one code before it stops working.
      max-code-attempts: ${CUSTOMER_MAX_CODE_ATTEMPTS:5}
    chat:
      # Base URL the AI assistant's tools use to call this app's own public /api/salon/** API.
      internal-api-base-url: ${INTERNAL_API_BASE_URL:http://localhost:8080}
      memory:
        # How long an idle chat conversation is kept before it's forgotten (ISO-8601 duration).
        ttl: ${CHAT_MEMORY_TTL:PT30M}
        # Max turns kept per conversation (older ones are trimmed, oldest full turn first).
        max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
        # Hard cap on live conversations held in memory; least-recently-used evicted when full.
        max-conversations: ${CHAT_MEMORY_MAX_CONVERSATIONS:5000}
    mcp:
      # Extra origins (comma-separated) the Salon MCP App views may load images/videos from, on top
      # of the media upload origin. MCP hosts (Claude, ChatGPT) block any origin not in the view's CSP.
      app-resource-domains: ${MCP_APP_RESOURCE_DOMAINS:}
  ai:
    mcp:
      server:
        name: salon-platform
        version: 1.0.0
        # Sent to clients in the initialize result; hosts such as Claude add it to the model's
        # context. MCP App views render where the tool call sits in the reply, so ask for the
        # text first and the app last.
        instructions: >-
          These tools open interactive Salon MCP Apps that show a salon's live services, team,
          opening hours, booking, shop and memberships. When you open an app, first write a short reply of one
          or two sentences saying what you are showing (for example "Here are Anna's profile and
          services."), then call the app tool as the last step of your turn, so the visitor reads
          your text and then sees the app below it. Do not state prices, times or availability
          before the app shows them, and do not repeat the app's contents after it; only add text
          after the app if the tool returned an error. Bookings and orders are made only when the
          visitor confirms them inside the app — never say one was made.
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:3weew334}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5-20251001}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}
  cloud:
    aws:
      s3:
        enabled: ${SPRING_CLOUD_AWS_S3_ENABLED:false}  # set true when STORAGE_TYPE=S3
      region:
        static: ${AWS_DEFAULT_REGION:${AWS_REGION:eu-north-1}}
    azure:
      storage:
        blob:
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
          account-key: ${AZURE_STORAGE_ACCOUNT_KEY:}
        queue:
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
          account-key: ${AZURE_STORAGE_ACCOUNT_KEY:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salon}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/V1__schema.sql
        - classpath:db/V2__add_terms_accepted.sql
        - classpath:db/V3__chat_layout_default_fullscreen.sql
        - classpath:db/V4__theme_palette_defaults.sql
        - classpath:db/V5__staff_bio_and_photos.sql
        - classpath:db/V6__analytics_events.sql
        - classpath:db/V7__genui_events.sql
        - classpath:db/V8__salon_social_links.sql
        - classpath:db/V9__shop_module.sql
        - classpath:db/V10__additional_changes.sql
        - classpath:db/V11__website_domains.sql
        - classpath:db/V12__stripe_connect.sql
        - classpath:db/V13__website_domain_zone.sql
        - classpath:db/V14__ratings.sql
        - classpath:db/V15__salon_languages.sql
        - classpath:db/V16__salon_policies.sql
        - classpath:db/V17__location_maps_url.sql
        - classpath:db/V18__membership.sql
        - classpath:db/V19__membership_desk_sales.sql
        - classpath:db/V20__payment_areas_and_ledger.sql
        - classpath:db/V21__payment_terminals.sql
        - classpath:db/V22__desk_shop_membership_hardening.sql
        - classpath:db/V23__shop_shipping_weight_currency.sql
        - classpath:db/V24__customer_accounts.sql
        - classpath:db/V25__salon_customer.sql
        - classpath:db/V26__customer_self_service_policy.sql
        - classpath:db/V27__booking_fee_policy_and_staff_calendar_color.sql
        - classpath:db/V28__user_access_management.sql
        - classpath:db/V29__login_audit.sql
        - classpath:db/V30__rating_feedback_reply.sql
        - classpath:db/V31__loyalty.sql
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      # Delivered events move to event_publication_archive (pruned after app.events.archive-retention),
      # so event_publication only holds what is still in flight or failed.
      completion-mode: archive
      # Publications stuck mid-delivery (the app stopped) are marked FAILED, then retried by
      # EventPublicationMaintenance. Restart republishing stays off: with several replicas it would
      # deliver the same event more than once.
      republish-outstanding-events-on-restart: false
      staleness:
        check-intervall: ${EVENTS_STALENESS_CHECK:PT1M}
        published: ${EVENTS_STALE_PUBLISHED:PT10M}
        processing: ${EVENTS_STALE_PROCESSING:PT15M}
        resubmitted: ${EVENTS_STALE_RESUBMITTED:PT15M}
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
    locations:
      - db
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    web: ${LOGGING_LEVEL:INFO}
    sql: ${LOGGING_LEVEL:INFO}
    org.springframework: ${LOGGING_LEVEL:INFO}

app:
  events:
    # Fail fast (tests) or log (production) when a domain event is published outside a transaction.
    fail-outside-transaction: false
    retry:
      interval: ${EVENTS_RETRY_INTERVAL:PT1M}
      max-attempts: ${EVENTS_RETRY_MAX_ATTEMPTS:10}
      initial-backoff: ${EVENTS_RETRY_INITIAL_BACKOFF:PT1M}
      max-backoff: ${EVENTS_RETRY_MAX_BACKOFF:PT6H}
      batch-size: 50
      # Never resend something this old (e.g. left over from before an outage or this upgrade).
      max-age: ${EVENTS_RETRY_MAX_AGE:P2D}
    archive-retention: ${EVENTS_ARCHIVE_RETENTION:P90D}
