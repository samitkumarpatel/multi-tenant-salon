spring:
  application:
    name: @project.artifactId@
    utility:
      static-geo-data: classpath:data/countries.json
      static-currency-data: classpath:data/currencies.json
    media:
      # STORAGE_TYPE=LOCAL (default) — photos stored locally and served by the backend
      # STORAGE_TYPE=S3              — photos stored in S3; also set SPRING_CLOUD_AWS_S3_ENABLED=true
      # STORAGE_TYPE=AZURE           — photos stored in Azure Blob Storage; also set AZURE_STORAGE_ACCOUNT_NAME
      storage-type: ${STORAGE_TYPE:LOCAL}
      staff-bucket-name: ${MEDIA_STAFF_BUCKET_NAME:}
      staff-container-name: ${MEDIA_STAFF_CONTAINER_NAME:staff-media}
      staff-cdn-base-url: ${MEDIA_STAFF_CDN_BASE_URL:https://staff.salonsaas.org}
      local-base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8080}
      local-storage-path: ${MEDIA_LOCAL_STORAGE_PATH:/tmp/salon-photos}
      # Signs local-mode upload URLs so /api/media/photos/upload/** can verify a request was
      # actually issued, the way S3 verifies a pre-signed URL's signature. Set this explicitly
      # for any multi-instance deployment — unset, each instance generates its own random secret.
      upload-signing-secret: ${MEDIA_UPLOAD_SIGNING_SECRET:}
    analytics:
      # Azure Storage Queue that buffers SPA click/view events between the public ingestion
      # endpoint and the DB-writing consumer. Leave AZURE_STORAGE_ACCOUNT_NAME unset to log
      # events instead of enqueuing them — the default for dev/test (same idea as the Mailjet
      # api-key fallback below).
      queue-name: ${ANALYTICS_QUEUE_NAME:salon-activity-events}
      poll-interval-ms: ${ANALYTICS_POLL_INTERVAL_MS:5000}
    cors:
      # Comma-separated origin patterns. Override in production via CORS_ALLOWED_ORIGIN_PATTERNS.
      # e.g. https://salonsaas.org,https://www.salonsaas.org,https://*.salonsaas.org
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    notification:
      mailjet:
        sender: ${MAILJET_SENDER:noreply@salonsaas.org}
        sender-name: ${MAILJET_SENDER_NAME:SalonSaaS}
        # Leave unset to disable actual sending (notifications are logged only) — e.g. in dev/test.
        api-key: ${MAILJET_API_KEY:}
        api-secret: ${MAILJET_API_SECRET:}
      salon-domain: ${SALON_DOMAIN:salonsaas.org}
      admin-app-url: ${NOTIFICATION_ADMIN_APP_URL:https://admin.salonsaas.org}
      staff-app-url: ${NOTIFICATION_STAFF_APP_URL:https://staff.salonsaas.org}
      booking-app-url: ${NOTIFICATION_BOOKING_APP_URL:https://book.salonsaas.org}
      support-email: ${NOTIFICATION_SUPPORT_EMAIL:admin@salonsaas.org}
    chat:
      # Base URL the AI assistant's tools use to call this app's own public /api/salon/** API.
      internal-api-base-url: ${INTERNAL_API_BASE_URL:http://localhost:8080}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:3weew334}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5-20251001}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9000}
  cloud:
    aws:
      s3:
        enabled: ${SPRING_CLOUD_AWS_S3_ENABLED:false}  # set true when STORAGE_TYPE=S3
      region:
        static: ${AWS_DEFAULT_REGION:${AWS_REGION:eu-north-1}}
    azure:
      credential:
        managed-identity-enabled: ${AZURE_MANAGED_IDENTITY_ENABLED:true}
      storage:
        blob:
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
        queue:
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salon}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/V1__schema.sql
        - classpath:db/V2__add_terms_accepted.sql
        - classpath:db/V3__chat_layout_default_fullscreen.sql
        - classpath:db/V4__theme_palette_defaults.sql
        - classpath:db/V5__staff_bio_and_photos.sql
        - classpath:db/V6__analytics_events.sql
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
    locations:
      - db
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    web: ${LOGGING_LEVEL:INFO}
    sql: ${LOGGING_LEVEL:INFO}
    org.springframework: ${LOGGING_LEVEL:INFO}