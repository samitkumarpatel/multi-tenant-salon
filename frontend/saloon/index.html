<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saloon Manager</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <link rel="stylesheet" href="/saloon/styles.css" />
</head>
<body>
<div id="app"></div>
<script src="/saloon/shared.js"></script>
<script>
const { createApp, ref, reactive, onMounted } = Vue;
const { createRouter, createWebHistory, useRoute, useRouter } = VueRouter;

// ══════════════════════════════════════════════════════════════════════
//  SaloonListView  —  /saloon/   (platform admin, all saloons)
// ══════════════════════════════════════════════════════════════════════
const SaloonListView = {
  setup() {
    const router    = useRouter();
    const saloons   = ref([]);
    const loading   = ref(true);
    const pageError = ref(null);
    const busy      = ref(false);
    const toast     = ref(null);
    const target    = ref(null);

    const modal = reactive({ create: false, editSaloon: false, features: false, del: false });

    const cf = reactive({
      name:'', ownerName:'', ownerEmail:'', ownerPhone:'',
      location: { address:'', city:'', state:'', country:'', zipCode:'' },
      contact:  { phone:'', email:'', website:'' },
      operatingHours: defaultHours(), features: [],
    });
    const cfTouched = reactive({ name:false, ownerName:false, ownerEmail:false });

    const ef = reactive({
      name:'',
      location: { address:'', city:'', state:'', country:'', zipCode:'' },
      contact:  { phone:'', email:'', website:'' },
      operatingHours: defaultHours(),
    });

    const ff = reactive({ features: [] });

    function notify(msg, type = 'success') {
      toast.value = { msg, type };
      setTimeout(() => (toast.value = null), 3000);
    }

    async function loadSaloons() {
      loading.value = true; pageError.value = null;
      try { saloons.value = await apiFetch(API); }
      catch (e) { pageError.value = e.message; }
      finally { loading.value = false; }
    }

    function openCreate() {
      Object.assign(cf, { name:'', ownerName:'', ownerEmail:'', ownerPhone:'', features:[] });
      cf.location = { address:'', city:'', state:'', country:'', zipCode:'' };
      cf.contact  = { phone:'', email:'', website:'' };
      cf.operatingHours = defaultHours();
      Object.assign(cfTouched, { name:false, ownerName:false, ownerEmail:false });
      modal.create = true;
    }

    async function submitCreate() {
      cfTouched.name = cfTouched.ownerName = cfTouched.ownerEmail = true;
      if (!cf.name || !cf.ownerName || !cf.ownerEmail) return;
      busy.value = true;
      try {
        const created = await apiFetch(API, { method:'POST', body: JSON.stringify({
          name:cf.name, ownerName:cf.ownerName, ownerEmail:cf.ownerEmail, ownerPhone:cf.ownerPhone,
          location:cf.location, contact:cf.contact, operatingHours:cf.operatingHours, features:cf.features,
        })});
        saloons.value.unshift(created);
        modal.create = false;
        notify(`"${created.name}" created!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openEditSaloon(s) {
      ef.name = s.name;
      ef.location = s.location ? { ...s.location } : { address:'', city:'', state:'', country:'', zipCode:'' };
      ef.contact  = s.contact  ? { ...s.contact  } : { phone:'', email:'', website:'' };
      ef.operatingHours = cloneHours(s.operatingHours);
      target.value = s; modal.editSaloon = true;
    }

    async function submitEditSaloon() {
      if (!ef.name) return;
      busy.value = true;
      try {
        const updated = await apiFetch(`${API}/${target.value.id}`, { method:'PUT', body: JSON.stringify({
          name:ef.name, location:ef.location, contact:ef.contact, operatingHours:ef.operatingHours,
        })});
        const idx = saloons.value.findIndex(s => s.id === updated.id);
        if (idx !== -1) saloons.value[idx] = updated;
        modal.editSaloon = false;
        notify(`"${updated.name}" updated!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openFeatures(s) { target.value = s; ff.features = [...(s.features||[])]; modal.features = true; }

    async function submitFeatures() {
      busy.value = true;
      try {
        const updated = await apiFetch(`${API}/${target.value.id}/features`, { method:'PUT', body: JSON.stringify({ features:ff.features }) });
        const idx = saloons.value.findIndex(s => s.id === updated.id);
        if (idx !== -1) saloons.value[idx] = updated;
        modal.features = false; notify('Features updated!');
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openDelete(s) { target.value = s; modal.del = true; }

    async function submitDelete() {
      busy.value = true;
      try {
        await apiFetch(`${API}/${target.value.id}`, { method:'DELETE' });
        const name = target.value.name;
        saloons.value = saloons.value.filter(s => s.id !== target.value.id);
        modal.del = false; notify(`"${name}" deleted.`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    onMounted(loadSaloons);

    return {
      saloons, loading, pageError, busy, toast, target, modal,
      cf, cfTouched, ef, ff,
      FEATURES, FEATURE_LABEL, DAYS, DAY_SHORT,
      formatDate, toggle, openDays,
      loadSaloons, openCreate, submitCreate,
      openEditSaloon, submitEditSaloon,
      openFeatures, submitFeatures,
      openDelete, submitDelete,
    };
  },

  template: `
  <div>
    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <h1>&#9986; Saloon Manager</h1>
          <div class="subtitle">Platform Admin — All Saloons</div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="toolbar">
        <span class="toolbar-count">
          <template v-if="loading">Loading&hellip;</template>
          <template v-else>{{ saloons.length }} saloon{{ saloons.length !== 1 ? 's' : '' }}</template>
        </span>
        <div class="btn-row">
          <button class="btn btn-ghost" @click="loadSaloons" :disabled="loading">&#8635; Refresh</button>
          <button class="btn btn-primary" @click="openCreate">+ New Saloon</button>
        </div>
      </div>

      <div class="error-bar" v-if="pageError">&#9888; {{ pageError }} <button @click="loadSaloons">Retry</button></div>
      <div class="loading-state" v-if="loading"><div class="spinner"></div><p>Loading saloons&hellip;</p></div>

      <div class="empty-state" v-else-if="!saloons.length && !pageError">
        <div class="empty-icon">&#9986;</div>
        <h3>No saloons yet</h3><p>Create your first saloon to get started.</p>
        <button class="btn btn-primary" style="margin-top:1.25rem" @click="openCreate">+ New Saloon</button>
      </div>

      <div class="cards-grid" v-else>
        <div class="card" v-for="s in saloons" :key="s.id">
          <div class="card-title">{{ s.name }}</div>
          <div class="card-id">{{ s.id }}</div>
          <div class="manage-url-row">
            <span class="manage-url-icon">&#127760;</span>
            <a :href="'/saloon/' + s.id + '/manage'" class="manage-url-link">/saloon/{{ s.id }}/manage</a>
          </div>

          <div class="info-block">
            <div class="block-label">Owner</div>
            <div class="block-name">{{ s.owner?.name }}</div>
            <div class="block-meta">{{ s.owner?.email }}<template v-if="s.owner?.phone"> &middot; {{ s.owner.phone }}</template></div>
          </div>

          <div class="info-block" v-if="s.location?.city || s.location?.address">
            <div class="block-label">Location</div>
            <div class="block-meta">
              <template v-if="s.location.address">{{ s.location.address }}<br/></template>
              {{ [s.location.city, s.location.state, s.location.country].filter(Boolean).join(', ') }}
            </div>
          </div>

          <div class="info-block" v-if="s.contact?.phone || s.contact?.email">
            <div class="block-label">Contact</div>
            <div class="block-meta">
              <template v-if="s.contact.phone">{{ s.contact.phone }}<br/></template>
              <template v-if="s.contact.email">{{ s.contact.email }}<br/></template>
              <template v-if="s.contact.website">{{ s.contact.website }}</template>
            </div>
          </div>

          <div v-if="openDays(s)" style="font-size:0.75rem;color:#475569;margin-bottom:0.5rem">
            <span style="font-size:0.6rem;text-transform:uppercase;letter-spacing:0.6px;color:#94a3b8;font-weight:700">Open: </span>{{ openDays(s) }}
          </div>

          <div style="margin-bottom:0.75rem">
            <div class="block-label">Features</div>
            <div class="features-wrap" v-if="s.features?.length" style="margin-top:0.3rem">
              <span v-for="f in s.features" :key="f" class="badge">{{ FEATURE_LABEL[f] || f }}</span>
            </div>
            <span class="no-text" v-else>No features enabled</span>
          </div>

          <div class="card-timestamp" v-if="s.createdAt">Created {{ formatDate(s.createdAt) }}</div>
          <div class="card-actions">
            <router-link :to="'/' + s.id + '/manage'" class="btn btn-primary btn-sm">Manage &rarr;</router-link>
            <button class="btn btn-ghost btn-sm" @click="openEditSaloon(s)">Edit</button>
            <button class="btn btn-ghost btn-sm" @click="openFeatures(s)">Features</button>
            <button class="btn btn-danger btn-sm" style="margin-left:auto" @click="openDelete(s)">Delete</button>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL: Create Saloon -->
    <div class="overlay" v-if="modal.create" @click.self="modal.create = false">
      <div class="modal modal-lg">
        <div class="modal-head"><span class="modal-title">New Saloon</span><button class="modal-x" @click="modal.create = false">&times;</button></div>
        <div class="section-divider">Saloon Info</div>
        <div class="field"><label>Saloon Name *</label><input class="input" :class="{ invalid: cfTouched.name && !cf.name }" v-model="cf.name" placeholder="e.g. Luxe Hair Studio" @blur="cfTouched.name = true" /></div>
        <div class="section-divider">Owner Details</div>
        <p class="section-hint">Account holder — used for internal management, not shown to customers.</p>
        <div class="col2">
          <div class="field"><label>Name *</label><input class="input" :class="{ invalid: cfTouched.ownerName && !cf.ownerName }" v-model="cf.ownerName" placeholder="Full name" @blur="cfTouched.ownerName = true" /></div>
          <div class="field"><label>Email *</label><input class="input" :class="{ invalid: cfTouched.ownerEmail && !cf.ownerEmail }" type="email" v-model="cf.ownerEmail" placeholder="owner@saloon.com" @blur="cfTouched.ownerEmail = true" /></div>
        </div>
        <div class="field"><label>Phone</label><input class="input" v-model="cf.ownerPhone" placeholder="+1 234 567 8900" /></div>
        <div class="section-divider">Location</div>
        <p class="section-hint">Physical address of the saloon.</p>
        <div class="field"><label>Address</label><input class="input" v-model="cf.location.address" placeholder="123 Main St" /></div>
        <div class="col3">
          <div class="field"><label>City</label><input class="input" v-model="cf.location.city" placeholder="City" /></div>
          <div class="field"><label>State</label><input class="input" v-model="cf.location.state" placeholder="State" /></div>
          <div class="field"><label>Zip</label><input class="input" v-model="cf.location.zipCode" placeholder="00000" /></div>
        </div>
        <div class="field"><label>Country</label><input class="input" v-model="cf.location.country" placeholder="Country" /></div>
        <div class="section-divider">Saloon Contact Info</div>
        <p class="section-hint">Public-facing details displayed to customers.</p>
        <div class="col3">
          <div class="field"><label>Phone</label><input class="input" v-model="cf.contact.phone" placeholder="+1 234 567 8900" /></div>
          <div class="field"><label>Email</label><input class="input" type="email" v-model="cf.contact.email" placeholder="info@saloon.com" /></div>
          <div class="field"><label>Website</label><input class="input" v-model="cf.contact.website" placeholder="www.saloon.com" /></div>
        </div>
        <div class="section-divider">Operating Hours</div>
        <p class="section-hint">Set opening and closing times for each day.</p>
        <table class="hours-table">
          <thead><tr><th>Day</th><th>Open</th><th>Close</th><th>Closed</th></tr></thead>
          <tbody>
            <tr v-for="h in cf.operatingHours" :key="h.day">
              <td>{{ DAY_SHORT[h.day] }}</td>
              <td><input class="hours-input" type="time" v-model="h.openTime" :disabled="h.closed" /></td>
              <td><input class="hours-input" type="time" v-model="h.closeTime" :disabled="h.closed" /></td>
              <td><label class="closed-label"><input type="checkbox" v-model="h.closed" /> Closed</label></td>
            </tr>
          </tbody>
        </table>
        <div class="section-divider">Features</div>
        <div class="tile-grid">
          <div v-for="f in FEATURES" :key="f" class="tile" :class="{ on: cf.features.includes(f) }" @click="toggle(cf.features, f)">
            <div class="tile-check">{{ cf.features.includes(f) ? '&#10003;' : '' }}</div>
            <span class="tile-label">{{ FEATURE_LABEL[f] }}</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" @click="modal.create = false">Cancel</button>
          <button class="btn btn-primary" :disabled="busy || !cf.name || !cf.ownerName || !cf.ownerEmail" @click="submitCreate">{{ busy ? 'Creating&hellip;' : 'Create Saloon' }}</button>
        </div>
      </div>
    </div>

    <!-- MODAL: Edit Saloon -->
    <div class="overlay" v-if="modal.editSaloon" @click.self="modal.editSaloon = false">
      <div class="modal modal-lg">
        <div class="modal-head"><span class="modal-title">Edit Saloon</span><button class="modal-x" @click="modal.editSaloon = false">&times;</button></div>
        <div class="section-divider">Saloon Info</div>
        <div class="field"><label>Saloon Name</label><input class="input" v-model="ef.name" /></div>
        <div class="section-divider">Location</div>
        <div class="field"><label>Address</label><input class="input" v-model="ef.location.address" /></div>
        <div class="col3">
          <div class="field"><label>City</label><input class="input" v-model="ef.location.city" /></div>
          <div class="field"><label>State</label><input class="input" v-model="ef.location.state" /></div>
          <div class="field"><label>Zip</label><input class="input" v-model="ef.location.zipCode" /></div>
        </div>
        <div class="field"><label>Country</label><input class="input" v-model="ef.location.country" /></div>
        <div class="section-divider">Saloon Contact Info</div>
        <div class="col3">
          <div class="field"><label>Phone</label><input class="input" v-model="ef.contact.phone" /></div>
          <div class="field"><label>Email</label><input class="input" type="email" v-model="ef.contact.email" /></div>
          <div class="field"><label>Website</label><input class="input" v-model="ef.contact.website" /></div>
        </div>
        <div class="section-divider">Operating Hours</div>
        <table class="hours-table">
          <thead><tr><th>Day</th><th>Open</th><th>Close</th><th>Closed</th></tr></thead>
          <tbody>
            <tr v-for="h in ef.operatingHours" :key="h.day">
              <td>{{ DAY_SHORT[h.day] }}</td>
              <td><input class="hours-input" type="time" v-model="h.openTime" :disabled="h.closed" /></td>
              <td><input class="hours-input" type="time" v-model="h.closeTime" :disabled="h.closed" /></td>
              <td><label class="closed-label"><input type="checkbox" v-model="h.closed" /> Closed</label></td>
            </tr>
          </tbody>
        </table>
        <div class="modal-foot">
          <button class="btn btn-ghost" @click="modal.editSaloon = false">Cancel</button>
          <button class="btn btn-primary" :disabled="busy || !ef.name" @click="submitEditSaloon">{{ busy ? 'Saving&hellip;' : 'Save Changes' }}</button>
        </div>
      </div>
    </div>

    <!-- MODAL: Edit Features -->
    <div class="overlay" v-if="modal.features" @click.self="modal.features = false">
      <div class="modal">
        <div class="modal-head"><span class="modal-title">Edit Features</span><button class="modal-x" @click="modal.features = false">&times;</button></div>
        <p style="font-size:0.83rem;color:#64748b;margin-bottom:1rem">{{ target?.name }}</p>
        <div class="tile-grid">
          <div v-for="f in FEATURES" :key="f" class="tile" :class="{ on: ff.features.includes(f) }" @click="toggle(ff.features, f)">
            <div class="tile-check">{{ ff.features.includes(f) ? '&#10003;' : '' }}</div>
            <span class="tile-label">{{ FEATURE_LABEL[f] }}</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" @click="modal.features = false">Cancel</button>
          <button class="btn btn-primary" :disabled="busy" @click="submitFeatures">{{ busy ? 'Saving&hellip;' : 'Save Features' }}</button>
        </div>
      </div>
    </div>

    <!-- MODAL: Delete Saloon -->
    <div class="overlay" v-if="modal.del" @click.self="modal.del = false">
      <div class="modal modal-sm">
        <div class="modal-head"><span class="modal-title">Delete Saloon</span><button class="modal-x" @click="modal.del = false">&times;</button></div>
        <p class="confirm-text">Are you sure you want to delete <strong>{{ target?.name }}</strong>? This cannot be undone.</p>
        <div class="modal-foot">
          <button class="btn btn-ghost" @click="modal.del = false">Cancel</button>
          <button class="btn btn-danger" :disabled="busy" @click="submitDelete">{{ busy ? 'Deleting&hellip;' : 'Delete' }}</button>
        </div>
      </div>
    </div>

    <div v-if="toast" class="toast" :class="'toast-' + toast.type">{{ toast.msg }}</div>
  </div>
  `,
};

// ══════════════════════════════════════════════════════════════════════
//  SaloonManageView  —  /saloon/:saloonId/manage   (owner view)
// ══════════════════════════════════════════════════════════════════════
const SaloonManageView = {
  setup() {
    const route     = useRoute();
    const router    = useRouter();
    const sid       = route.params.saloonId;

    const saloon    = ref(null);
    const staff     = ref([]);
    const services  = ref([]);
    const loading   = ref(true);
    const pageError = ref(null);
    const busy      = ref(false);
    const toast     = ref(null);
    const activeTab = ref('services');

    const staffTarget   = ref(null);
    const serviceTarget = ref(null);

    const modal = reactive({
      editSaloon: false, features: false,
      onboard: false, editStaff: false, delStaff: false,
      addService: false, editService: false, delService: false,
    });

    const ef  = reactive({ name:'', location:{ address:'', city:'', state:'', country:'', zipCode:'' }, contact:{ phone:'', email:'', website:'' }, operatingHours: defaultHours() });
    const ff  = reactive({ features: [] });
    const sf  = reactive({ name:'', email:'', phone:'', role:'STYLIST', specializations:[] });
    const sef = reactive({ name:'', email:'', phone:'', role:'STYLIST', status:'ACTIVE', specializations:[] });
    const svf  = reactive({ name:'', description:'', price:'', currency:'USD', durationMinutes:30, category:'HAIR', assignedStaffIds:[] });
    const svef = reactive({ name:'', description:'', price:'', currency:'USD', durationMinutes:30, category:'HAIR', active:true, assignedStaffIds:[] });

    function notify(msg, type = 'success') {
      toast.value = { msg, type };
      setTimeout(() => (toast.value = null), 3000);
    }

    async function loadAll() {
      loading.value = true; pageError.value = null;
      try {
        const [s, st, sv] = await Promise.all([
          apiFetch(`${API}/${sid}`),
          apiFetch(`${API}/${sid}/staff`),
          apiFetch(`${API}/${sid}/services`),
        ]);
        saloon.value = s; staff.value = st; services.value = sv;
        document.title = `${s.name} — Manage`;
      } catch (e) { pageError.value = e.message; }
      finally { loading.value = false; }
    }

    function openEditSaloon() {
      const s = saloon.value;
      ef.name = s.name;
      ef.location = s.location ? { ...s.location } : { address:'', city:'', state:'', country:'', zipCode:'' };
      ef.contact  = s.contact  ? { ...s.contact  } : { phone:'', email:'', website:'' };
      ef.operatingHours = cloneHours(s.operatingHours);
      modal.editSaloon = true;
    }

    async function submitEditSaloon() {
      if (!ef.name) return;
      busy.value = true;
      try {
        saloon.value = await apiFetch(`${API}/${sid}`, { method:'PUT', body: JSON.stringify({
          name:ef.name, location:ef.location, contact:ef.contact, operatingHours:ef.operatingHours,
        })});
        modal.editSaloon = false;
        document.title = `${saloon.value.name} — Manage`;
        notify('Saloon updated!');
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openFeatures() { ff.features = [...(saloon.value.features||[])]; modal.features = true; }

    async function submitFeatures() {
      busy.value = true;
      try {
        saloon.value = await apiFetch(`${API}/${sid}/features`, { method:'PUT', body: JSON.stringify({ features:ff.features }) });
        modal.features = false; notify('Features updated!');
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openOnboard() { Object.assign(sf, { name:'', email:'', phone:'', role:'STYLIST', specializations:[] }); modal.onboard = true; }

    async function submitOnboard() {
      if (!sf.name || !sf.email) return;
      busy.value = true;
      try {
        const m = await apiFetch(`${API}/${sid}/staff`, { method:'POST', body: JSON.stringify({ name:sf.name, email:sf.email, phone:sf.phone, role:sf.role, specializations:sf.specializations }) });
        staff.value.unshift(m); modal.onboard = false; notify(`${m.name} onboarded!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openEditStaff(m) {
      staffTarget.value = m;
      Object.assign(sef, { name:m.name, email:m.email, phone:m.phone||'', role:m.role, status:m.status, specializations:[...(m.specializations||[])] });
      modal.editStaff = true;
    }

    async function submitEditStaff() {
      busy.value = true;
      try {
        const updated = await apiFetch(`${API}/${sid}/staff/${staffTarget.value.id}`, { method:'PUT', body: JSON.stringify({ name:sef.name, email:sef.email, phone:sef.phone, role:sef.role, status:sef.status, specializations:sef.specializations }) });
        const idx = staff.value.findIndex(m => m.id === updated.id);
        if (idx !== -1) staff.value[idx] = updated;
        modal.editStaff = false; notify(`${updated.name} updated!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openDelStaff(m) { staffTarget.value = m; modal.delStaff = true; }

    async function submitDelStaff() {
      busy.value = true;
      try {
        await apiFetch(`${API}/${sid}/staff/${staffTarget.value.id}`, { method:'DELETE' });
        const name = staffTarget.value.name;
        staff.value = staff.value.filter(m => m.id !== staffTarget.value.id);
        modal.delStaff = false; notify(`${name} removed.`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openAddService() { Object.assign(svf, { name:'', description:'', price:'', currency:'USD', durationMinutes:30, category:'HAIR', assignedStaffIds:[] }); modal.addService = true; }

    async function submitAddService() {
      if (!svf.name || !svf.price) return;
      busy.value = true;
      try {
        const item = await apiFetch(`${API}/${sid}/services`, { method:'POST', body: JSON.stringify({ name:svf.name, description:svf.description, price:parseFloat(svf.price), currency:svf.currency, durationMinutes:parseInt(svf.durationMinutes), category:svf.category, assignedStaffIds:svf.assignedStaffIds }) });
        services.value.unshift(item); modal.addService = false; notify(`"${item.name}" added!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openEditService(item) {
      serviceTarget.value = item;
      Object.assign(svef, { name:item.name, description:item.description||'', price:item.price, currency:item.currency||'USD', durationMinutes:item.durationMinutes, category:item.category, active:item.active, assignedStaffIds:[...(item.assignedStaffIds||[])] });
      modal.editService = true;
    }

    async function submitEditService() {
      busy.value = true;
      try {
        const updated = await apiFetch(`${API}/${sid}/services/${serviceTarget.value.id}`, { method:'PUT', body: JSON.stringify({ name:svef.name, description:svef.description, price:parseFloat(svef.price), currency:svef.currency, durationMinutes:parseInt(svef.durationMinutes), category:svef.category, active:svef.active, assignedStaffIds:svef.assignedStaffIds }) });
        const idx = services.value.findIndex(s => s.id === updated.id);
        if (idx !== -1) services.value[idx] = updated;
        modal.editService = false; notify(`"${updated.name}" updated!`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function openDelService(item) { serviceTarget.value = item; modal.delService = true; }

    async function submitDelService() {
      busy.value = true;
      try {
        await apiFetch(`${API}/${sid}/services/${serviceTarget.value.id}`, { method:'DELETE' });
        const name = serviceTarget.value.name;
        services.value = services.value.filter(s => s.id !== serviceTarget.value.id);
        modal.delService = false; notify(`"${name}" removed.`);
      } catch (e) { notify(e.message, 'error'); }
      finally { busy.value = false; }
    }

    function staffName(id) { return staff.value.find(m => m.id === id)?.name || id; }

    onMounted(loadAll);

    return {
      saloon, staff, services, loading, pageError, busy, toast, activeTab,
      staffTarget, serviceTarget, modal,
      ef, ff, sf, sef, svf, svef,
      FEATURES, FEATURE_LABEL, DAYS, DAY_SHORT,
      STAFF_ROLES, STAFF_ROLE_LABEL, STAFF_STATUSES, STAFF_STATUS_LABEL,
      SERVICE_CATEGORIES, CATEGORY_LABEL, SPECIALIZATION_OPTIONS,
      formatPrice, toggle, staffName,
      openEditSaloon, submitEditSaloon,
      openFeatures, submitFeatures,
      openOnboard, submitOnboard, openEditStaff, submitEditStaff, openDelStaff, submitDelStaff,
      openAddService, submitAddService, openEditService, submitEditService, openDelService, submitDelService,
    };
  },

        <div class="col3">

const router = createRouter({
  history: createWebHistory('/saloon/'),
  routes: [
    { path: '/',                   component: SaloonListView },
    { path: '/:saloonId/manage',   component: SaloonManageView },
    { path: '/:pathMatch(.*)*',    redirect: '/' },
  ],
});
