<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square with green gradient -->
  <rect width="32" height="32" rx="8" fill="url(#g)"/>

  <!-- Blade 1: top-left handle → bottom-right tip -->
  <line x1="12" y1="9" x2="26" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade 2: bottom-left handle → top-right tip -->
  <line x1="12" y1="23" x2="26" y2="9" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Handle ring 1 (top) — filled with gradient to mask blade start -->
  <circle cx="8" cy="9" r="4" fill="url(#g)" stroke="white" stroke-width="1.8"/>
  <!-- Handle ring 2 (bottom) -->
  <circle cx="8" cy="23" r="4" fill="url(#g)" stroke="white" stroke-width="1.8"/>

  <!-- Pivot screw at blade crossing (≈19, 16) -->
  <circle cx="19" cy="16" r="3" fill="url(#g)"/>
  <circle cx="19" cy="16" r="1.4" fill="white"/>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
</svg>
