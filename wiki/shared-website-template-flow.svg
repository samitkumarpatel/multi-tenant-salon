<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Shared website template flow between admin design mode and public customer view</title>
<desc>Both saloon-admin design mode and saloon-public-website consume the same shared template module and the same public salon API</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="70" y="20" width="260" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="200" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">admin design mode</text>
<text x="200" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">owner edits with palette</text>

<rect x="350" y="20" width="260" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="480" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">public-website</text>
<text x="480" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">customer views live site</text>

<path d="M200 76 L200 110 L340 110 L340 140" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 76 L480 110 L340 110 L340 140" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="140" width="260" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">shared template module</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">same components, same data</text>

<line x1="340" y1="196" x2="340" y2="236" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="236" width="320" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">/api/saloon/&lt;id&gt;/...</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">public salon data endpoint</text>
</svg>
