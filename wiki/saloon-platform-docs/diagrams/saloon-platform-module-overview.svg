<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Multi-tenant salon platform module overview</title>
<desc>Domain routing feeds four micro-frontend modules, which all call a shared multi-tenant backend API</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="210" y="20" width="260" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Domain routing</text>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">your-saloon.online + tenants</text>

<line x1="340" y1="76" x2="340" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="20" y="108" width="640" height="192" rx="20" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="44" y="130" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Micro-frontend layer</text>

<rect x="42" y="160" width="140" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="112" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">onboarding</text>
<text x="112" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">signup, discovery</text>

<rect x="194" y="160" width="140" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="264" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">public-website</text>
<text x="264" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">customer facing</text>

<rect x="346" y="160" width="140" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="416" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">admin</text>
<text x="416" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">owner console</text>

<rect x="498" y="160" width="140" height="56" rx="8" stroke-width="0.5" fill="#FBEAF0" stroke="#993556"/>
<text x="568" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">super-admin</text>
<text x="568" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#72243E">internal ops</text>

<line x1="340" y1="300" x2="340" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="160" y="340" width="360" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Backend API (multi-tenant)</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">/api/saloon-{module}/...</text>
</svg>
